# oapi-codegen config: server interfaces + types for tw-mgmt. The spec itself
# is embedded as YAML by package api (api/spec.go), not as a base64 blob here.
# Regenerate with `make api`; CI checks the output is current (`make api-check`).
package: v1
output: mgmt/api/v1/api.gen.go
generate:
  models: true
  std-http-server: true
  strict-server: true
  embedded-spec: false
output-options:
  nullable-type: true
  skip-prune: false
  name-normalizer: ToCamelCaseWithInitialisms
  # Keep in sync with excludedTags in mgmt/api/v1/validate.go.
  exclude-tags: [mcp, registry]
