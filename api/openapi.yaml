openapi: 3.1.0
info:
  title: tailworks management API
  version: "1.0.0-pre"
  summary: tw-mgmt ⇄ tw-hostd ⇄ tailworks CLI contract (/v1)
  description: |
    This document is the **single source of truth** for `/v1`. Go server
    interfaces and types (`mgmt/api/v1`), the hostd/CLI client
    (`hostd/mgmtapi/v1`) and `docs/contracts/mgmt-api.md` are generated from
    it (`make api`); none of them is hand-edited. `/v0` is gone: tailworks is
    pre-release and `/v1` is a breaking replacement with no compatibility shim.

    ## Transport and authentication (tsnet-only in normal operation)

    mgmt serves the API on **its own tsnet node** `tw-mgmt` (`tag:tw-mgmt`),
    on `:80` and, when the tailnet has HTTPS, on `:443` with the node's
    certificate (tailnet-only). mgmt serves nothing over Funnel.

    Every tailnet request is authenticated by **Tailscale WhoIs on the
    connection**, never by a bearer token or API key:

    - **host** — the peer node carries `tag:tw-host`. hostd runs its own
      tsnet node `tw-host-<hostID>`; the node is bound to the `hostID` it
      registered with (`PUT /v1/hosts/{id}`), and may only act on that host's
      records and on the namespaces it holds a lease for.
    - **admin** — the peer's WhoIs `CapMap` holds the app capability
      `github.com/rosskukulinski/tailworks/cap/admin` toward `tag:tw-mgmt` (granted by the base policy
      snippet to `autogroup:admin`; tenants may grant it to users, groups or
      tags such as a CI node). `tw-mgmt -admins <logins>` is an override.
    - **tenant admin** — the peer holds `github.com/rosskukulinski/tailworks/cap/tenant-admin` (and not
      `github.com/rosskukulinski/tailworks/cap/admin`). Each value names tenants and actions:
      `{"tenants": ["payments"], "actions": ["read", "deploy"]}`, both
      required. The actions are `read`, `deploy`, `kill`, `secrets` and
      `data`. An operation is open to tenant admins only if its `x-tw-role`
      has a `tenant:<action>` part, and only for a tenant that one single
      value names with that action. Lists are limited to those tenants, and
      another tenant's deployment or object is `404`. Hosts, releases,
      upgrades and tenant settings stay with admins
      (ADR-043).
    - everyone else: `403 not_admin` with the grant `snippet` to add.

    Each operation declares its role in `x-tw-role` (`admin`, `host`,
    `admin|host`, `any`, plus `tenant:<action>` where tenant admins may call
    it). The security scheme `tailnetWhoIs` documents this;
    it is **not** a token scheme and no header is sent.

    The unix socket + host token (RT-03) survives **only** behind
    `--local-dev` (`tw dev`, hermetic tests). It is the `localHostToken`
    scheme; `tw doctor` reports `transport: tsnet` in normal operation and
    flags any local-socket use.

    mgmt → hostd pushes (kill, assignments) go to the host's tsnet node and are
    hostd's API, not this document's.

    ## Conventions

    - JSON everywhere. Timestamps are unix **milliseconds** unless the field
      says otherwise (`AuditRecord.ts` is RFC 3339).
    - **Pagination.** Every list returns `{"items": [...], "nextCursor":
      "..." | null}`. `?limit=` defaults to 50; 1–500 is accepted and anything
      else is `400 bad_request`. `?cursor=` is opaque; it encodes the
      stable sort key `(createdAt, id)` (audit: `(ts, chain, seq)`), so a page
      is stable under concurrent inserts. A cursor that does not decode is
      `400 bad_cursor`. Filters are query parameters and must be repeated
      unchanged with the cursor.
    - **ETags.** Every single-resource `GET` sets a strong `ETag`
      (`"<sha256-prefix of the canonical JSON>"`). `PATCH`/`DELETE` accept
      `If-Match`; a stale value is `412 precondition_failed`. `If-None-Match`
      on `GET` answers `304`.
    - **PATCH** bodies are partial JSON following **JSON Merge Patch (RFC
      7396)**: absent keys are untouched, `null` clears a field. Media type
      `application/merge-patch+json` (plain `application/json` is accepted).
    - **DELETE** takes options as query parameters, never a body.
    - **Async creates** answer `202 Accepted` with a `Location` header to poll.
    - **Tombstones.** A killed object stays readable as `410 Gone` whose body
      is the typed error plus the kill record (`TombstoneError`).
    - **Errors** are the typed error catalog (docs/errors.md) shape
      `{code, message, missing?, snippet?, doc_url, trace_id}` and also set
      `Tw-Error: <code>`; `identity_pending` sets `Retry-After: 1`.
    - **Body limits.** Requests from the `host` role are capped at **1 MiB**
      except `POST /v1/audit` (batches; 64 MiB). Admin uploads (`POST
      /v1/deployments` bundles) keep the 64 MiB limit. Over the cap is
      `400 bad_request`.
    - **Audit.** Every mutating operation is marked `x-tw-audit: true` and
      writes to mgmt's hash chain with the caller's actor (`deployedBy`,
      `by`): the WhoIs login for users, `<tag> (<stableNodeID>)` for tagged
      admin nodes, `host:<id>` for hosts, `Tw-Actor` or `local` on the
      local-dev socket.

    ## Decisions recorded here

    - **Preflight is `POST /v1/deployments?dryRun=true`** (decided by Ross,
      2026-11-08): the request body is exactly a real deploy's; mgmt parses
      `tailworks.jsonc` from the bundle as a deploy would (`tailnet.tags`,
      `tailnet.objects.*.tags` → `srcTags`; `tailnet.connects`), checks grants
      and tagOwners against the policy cache and answers `200 PreflightResult`
      (missing grants with HuJSON snippets). Nothing is created, no lease is
      taken, and the only audit record is an optional `kind: preflight`.
      There is no separate preflight resource.
    - **Audit verification is `GET /v1/audit/verification`**: the noun form.
      It is a read-only report, so a resource name fits, and it needs no
      custom-method (`:verb`) syntax that routers, generators and linters
      treat specially. No reason was found to prefer `:verify`.
    - **Credentials and key grants are `POST`** (`…/credentials`,
      `…/keys`): each call *creates* a single-use grant (a fresh auth key, a
      fenced key release) and is audited, so a `GET` would be wrong.
    - The only other RPC-shaped operation is a diagnostic that produces a
      report: `POST /v1/device-delete-runs` (execute the scheduled device
      deletes now). It is documented as such.

  contact:
    name: tailworks
    url: https://github.com/rosskukulinski/tailworks
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary

servers:
  - url: https://tw-mgmt.{tailnet}
    description: mgmt's tsnet node over the tailnet (HTTPS when the tailnet has it)
    variables:
      tailnet:
        default: example.ts.net
        description: the operator tailnet's MagicDNS suffix
  - url: http://tw-mgmt.{tailnet}
    description: mgmt's tsnet node, plain HTTP on :80 (tailnet-only)
    variables:
      tailnet:
        default: example.ts.net
  - url: http+unix://~/.tailworks/run/mgmt.sock
    description: "--local-dev only: the unix socket with the host token (tw dev, hermetic tests)"

tags:
  - name: tenants
    description: Customer tailnets. Admin only.
  - name: hosts
    description: tw-hostd instances. A host writes its own record; admins read.
  - name: deployments
    description: Deploys of a workload bundle to a host.
  - name: objects
    description: DO instances, agents and sub-agents, each with its own tailnet node.
  - name: credentials
    description: Single-use auth keys and node certificates.
  - name: secrets
    description: Worker secrets (Cloudflare-compatible `env.NAME`), encrypted in mgmt custody and released only to the workload's lease holder.
  - name: stores
    description: Platform storage objects (ADR-044) behind storage bindings such as Workers KV. Each store is served by a platform-owned SQLite Durable Object on the workload's host; its writes go first to a fenced, encrypted journal here, so a store survives hostd restarts and moves to another host.
  - name: telemetry
    description: A tenant's OTLP export (ADR-045). The config, collector credentials included, lives in mgmt custody and is released only to a workload's lease holder.
  - name: queues
    description: Cloudflare-style Queues (ADR-039). A queue belongs to the tenant; its messages are sealed rows here. Producers send through their host, push consumers' hosts claim batches with a visibility timeout and settle them, and admins can pull, peek, purge and delete.
  - name: audit
    description: Hash-chained, append-only audit log.
  - name: approvals
    description: Workflow approvals decided by tailnet identities (`github.com/rosskukulinski/tailworks/cap/approve`), not links or tokens (ADR-040).
  - name: upgrades
    description: |
      Releases and upgrades (ADR-041). tw-mgmt keeps a release catalog (the
      releases it was built with, plus imported ones), plans upgrades from it and the fleet's
      reported versions and features, and runs fleet upgrades as durable upgrade runs.
  - name: volumes
    description: dm-crypt data keys for DO volumes (microVM tier).
  - name: containers
    description: Container and code-sandbox reservations against tenant quotas (microVM tier, ADR-032).
  - name: images
    description: Container images (ADR-032 D3) — public base images shared across tenants, and the arm64 alias map.
  - name: mcp
    description: |
      tailworks' own MCP server (ADR-035), served by tw-mgmt at `/mcp` on the same listeners and
      behind the same WhoIs gate as `/v1`. Its wire protocol is the external Model Context Protocol
      (Streamable HTTP, stateless: one JSON-RPC request per POST, answered with `application/json`);
      this entry documents the route and who may call it, and is excluded from code generation (the
      server is hand-written: `mgmt/mcp.go`). Tools run the `/v1` operations in process.

      - **admins** (`github.com/rosskukulinski/tailworks/cap/admin`) and holders of `github.com/rosskukulinski/tailworks/cap/mcp` get the read tools:
        `whoami`, `status`, `ls`, `logs`, `audit`. A caller with only `github.com/rosskukulinski/tailworks/cap/mcp` reaches
        `/mcp` and nothing else.
      - `deploy`, `kill` and `undeploy` need a `github.com/rosskukulinski/tailworks/cap/mcp` grant naming them
        (`[{"tools": ["kill"]}]`, or `"*"`); being an admin is not enough.
      - the local operator (the `tw mcp` bridge on the tailworks host) gets the read tools, or exactly
        the tools it lists in `Tw-MCP-Tools`; for tailnet callers that header only narrows.
      - hosts and browsers are refused.
  - name: registry
    description: |
      tailworks' OCI distribution registry (ADR-032 D3), served by tw-mgmt at `/v2/` on the same listeners
      and behind the same WhoIs gate as `/v1`. Its wire protocol is the external OCI Distribution Spec v1.1
      (push and pull subset); these entries document the routes and the roles tailworks enforces, and are
      excluded from code generation (the registry is hand-written: `internal/registry`).

      - `{name}` is a repository and may contain `/`: `<tenantID>/<path>` (one namespace per tenant) or
        `public/<path>` (operator base images and alias targets).
      - **admins** push and pull every namespace; **hosts** only pull, and only `public/…` and the
        namespaces of tenants they hold a deployment of (`403 DENIED` otherwise).
      - Blobs are content-addressed and stored once, but visible only through a repository they were
        pushed or mirrored into: another namespace answers `404 BLOB_UNKNOWN` exactly as for absent
        content, cross-namespace mounts are refused, and a manifest may only reference content already
        in its own repository.
      - Errors are the spec's `{"errors": [{code, message}]}`; the body also carries tailworks' `code`
        (`forbidden`, `not_found`, `bad_request`) and `Tw-Error`.
  - name: operational
    description: Health, status, identity, maintenance.

security:
  - tailnetWhoIs: []
  - localHostToken: []

paths:
  # ---------------------------------------------------------------- tenants
  /v1/tenants:
    post:
      tags: [tenants]
      operationId: CreateTenant
      summary: Create a tenant
      x-tw-role: admin
      x-tw-audit: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantCreate" }
            examples:
              oauth:
                value: { tailnet: tail7906d5.ts.net, mintMode: oauth, oauthClientID: kOAuth123CNTRL, oauthClientFile: /Users/me/.config/tailworks/oauth.env }
              headscale:
                value: { tailnet: hs.example.net, controlURL: "https://headscale.example.net", mintMode: headscale, apiKeyFile: /Users/me/.config/tailworks/headscale.env }
      responses:
        "201":
          description: Created.
          headers:
            Location: { $ref: "#/components/headers/Location" }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/Error" }
    get:
      tags: [tenants]
      operationId: ListTenants
      summary: List tenants
      description: |
        Hosts may list tenants too (they deny each tenant's `apiKeyFile` and
        `oauthClientFile` path to their workload sandboxes), but a host sees
        **only the tenants with a deployment assigned to it** (a namespace
        lease it holds); admins see every tenant.
      x-tw-role: admin|host|tenant:read
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: One page of tenants, ordered by `(createdAt, tenantID)`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/Error" }

  /v1/tenants/{id}:
    parameters:
      - $ref: "#/components/parameters/tenantID"
    get:
      tags: [tenants]
      operationId: GetTenant
      summary: Read a tenant
      description: |
        Includes `oboPublicKey` (hostd pins it). A host may read only
        tenants with a deployment assigned
        to it (any other tenant is `404 not_found` for it).
      x-tw-role: admin|host|tenant:read
      parameters:
        - $ref: "#/components/parameters/ifNoneMatch"
      responses:
        "200":
          description: The tenant.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "304": { $ref: "#/components/responses/NotModified" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [tenants]
      operationId: UpdateTenant
      summary: Update a tenant (JSON Merge Patch)
      description: |
        Updatable: `mintMode`, `apiKeyFile`, `oauthClientID`,
        `oauthClientFile`, `registrationsPerMinute`, `maxObjects`, `pool`,
        `tier`. Switching mode or changing a client ID / credential file drops
        cached tokens. A tenant left in a removed mint mode (`apikey`, `wif`)
        can't mint until it is switched: `{mintMode: oauth, oauthClientFile: …}`.
        `tailnet` and `controlURL` are immutable (`400 immutable_field`).
      x-tw-role: admin
      x-tw-audit: true
      parameters:
        - $ref: "#/components/parameters/ifMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: "#/components/schemas/TenantPatch" }
            examples:
              switchToOAuth:
                value: { mintMode: oauth, oauthClientFile: /Users/me/.config/tailworks/oauth.env }
              raiseQuota:
                value: { maxObjects: 5000, registrationsPerMinute: 400 }
          application/json:
            schema: { $ref: "#/components/schemas/TenantPatch" }
      responses:
        "200":
          description: The updated tenant.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [tenants]
      operationId: DeleteTenant
      summary: Delete a tenant
      description: |
        `409 tenant_has_live_objects` while any object of the tenant is live,
        unless `force=true`: then every live object is killed (cascade, device
        deletes through the tenant credential), killed/failed objects are
        purged, deployments and leases are released, and the whole cascade is
        audited (`kind: tenant_delete`, with the counts of what was removed).
        Then everything the tenant owns is removed: its custody entries (store
        and queue data keys, workload secrets, volume keys, auth keys,
        notification and telemetry settings, OBO roots), its KV, D1 and R2
        journals, queue messages, objects, deployments and the rest of its
        rows, and the tenant row last. Every host removes the tenant's files
        (`tenants/<id>/`, R2 blobs) at its next heartbeat (`purgeTenants`),
        audited `tenant_purge_host`. Only the audit records stay. The delete
        is idempotent: if it fails part way, run it again to finish.
      x-tw-role: admin
      x-tw-audit: true
      parameters:
        - $ref: "#/components/parameters/ifMatch"
        - name: force
          in: query
          description: Cascade-kill live objects and purge before deleting.
          schema: { type: boolean, default: false }
      responses:
        "202":
          description: Accepted; the cascade runs. Poll `GET /v1/tenants/{id}` until `404`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantDeleteResult" }
        "204":
          description: Deleted (nothing was live).
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Live objects exist and `force` was not set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: tenant_has_live_objects
                message: "tenant tn_tail7906d5 has 3 live objects; pass ?force=true to kill and purge them"
                missing: { liveObjects: 3 }
                doc_url: https://github.com/rosskukulinski/tailworks/blob/master/docs/errors.md#tenant_has_live_objects
                trace_id: 7f3a…
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        default: { $ref: "#/components/responses/Error" }

  /v1/tenants/{id}/objects:
    parameters:
      - $ref: "#/components/parameters/tenantID"
    delete:
      tags: [tenants, objects]
      operationId: PurgeTenantObjects
      summary: Purge terminal objects of a tenant
      description: |
        Forgets the tenant's objects in the given terminal `state`s (default:
        both `killed` and `failed`) so the same `(workload, namespace, name)`
        can be created again. Pending device deletes for them run first. Live
        objects are never touched (there is no `force` here; use `DELETE
        /v1/objects/{id}` to kill). Each removal is audited (`kind: purge`).
        Replaces `POST /v0/tenants/{id}/purge`.
      x-tw-role: admin
      x-tw-audit: true
      parameters:
        - name: state
          in: query
          description: Terminal states to purge. Repeatable. Any other value is `400 bad_request`.
          style: form
          explode: true
          schema:
            type: array
            items: { type: string, enum: [killed, failed, transferred] }
            default: [killed, failed, transferred]
      responses:
        "200":
          description: Purged.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurgeResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }

  /v1/tenants/{id}/workloads/{workload}/logs:
    parameters:
      - $ref: "#/components/parameters/tenantID"
      - $ref: "#/components/parameters/workloadName"
    get:
      tags: [tenants, deployments]
      operationId: GetWorkloadLogs
      summary: Read (or follow) a workload's workerd / node log (`tw logs` from a linked machine)
      description: |
        The app's log is a file on the host that runs it. mgmt finds the
        host holding the workload's namespace lease and reads the log from
        that host's hostd over the mgmt → hostd channel (the push port);
        hostd resolves the file from its own record of the tenant's
        workload, never from a path the caller sends. The response is
        `text/plain`: the last `n` lines, then (with `follow=true`) new
        lines as they are written, streamed until the client disconnects
        or the host ends the stream (at most an hour; follow again to
        continue).

        A workload with `replicas` reads every replica's host; each line
        is then prefixed with `[<hostID>] `, and `host` selects one
        replica. A host that does not answer contributes one
        `[<hostID>] tw: …` line instead (`502 host_unavailable` when no
        host answers). `404 unknown_workload` when the workload has no
        running replica (on `host`); `404 no_logs` when the host has no
        log file for it yet. A read, so not audited; mgmt logs the actor.
        Only the workload's own app log: the daemons' logs
        (`--component`) stay on the host.
      x-tw-role: admin|tenant:read
      parameters:
        - name: "n"
          in: query
          description: Lines from the end of the log (0 with `follow` for new lines only).
          schema: { type: integer, minimum: 0, maximum: 10000, default: 50 }
        - name: follow
          in: query
          description: Keep the stream open and send new lines as they are written.
          schema: { type: boolean, default: false }
        - name: host
          in: query
          description: Only the replica on this host (a host ID).
          schema: { type: string }
        - name: source
          in: query
          description: |
            `console`: the app's raw output (workerd's stdout, the node
            tier's `app.log`, the microVM console). `requests`: the
            workload's structured request records (ADR-045), as
            JSON Lines (`application/x-ndjson`), one `RequestRecord` per
            line; `n` and the filters below then count records, not lines.
          schema: { type: string, enum: [console, requests], default: console }
        - name: object
          in: query
          description: "`source=requests`: only records of this object (object ID, `Class/name`, `Class` or name)."
          schema: { type: string, maxLength: 256 }
        - name: status
          in: query
          description: "`source=requests`: only this HTTP status (`404`) or class (`5xx`)."
          schema: { type: string, pattern: "^([1-5][0-9][0-9]|[1-5]xx)$" }
        - name: outcome
          in: query
          description: "`source=requests`: only this workerd outcome (`ok`, `exception`, `canceled`, …)."
          schema: { type: string, maxLength: 64 }
        - name: caller
          in: query
          description: "`source=requests`: only callers whose login or node name contains this (`public` for Funnel requests)."
          schema: { type: string, maxLength: 256 }
        - name: trace
          in: query
          description: "`source=requests`: only this W3C trace ID (or a prefix of it) or audit trace ID."
          schema: { type: string, maxLength: 64 }
        - name: errors
          in: query
          description: "`source=requests`: only errors (status ≥ 400, an outcome other than `ok`, or an exception)."
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: The log lines (UTF-8 as the app wrote them; a stream with `follow`), or request records with `source=requests`.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            text/plain:
              schema: { type: string }
            application/x-ndjson:
              schema: { $ref: "#/components/schemas/RequestRecord" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }

  /v1/tenants/{id}/approvals:
    parameters:
      - $ref: "#/components/parameters/tenantID"
    get:
      tags: [tenants, approvals]
      operationId: ListApprovals
      summary: The Workflow approvals waiting in a tenant (`tw approvals`, the admin UI)
      description: |
        A Workflow instance that waits for an event of type `approval` or
        `approval-*` (the Agents SDK's `waitForApproval`) is listed here
        (ADR-040, docs/approvals.md). mgmt asks every live
        host over the mgmt → hostd channel and merges the answers, oldest
        first; a host that does not answer is named in `unreachable`.
        Admins see every approval; a tailnet caller holding only
        `github.com/rosskukulinski/tailworks/cap/approve` (toward `tag:tw-mgmt`) sees the ones its
        grants let it decide. A read, so not audited.
      x-tw-role: admin|approver
      parameters:
        - name: workload
          in: query
          description: Only this workload's approvals.
          schema: { type: string }
        - name: all
          in: query
          description: Include decided (and timed-out) approvals the hosts still keep.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: The approvals.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalList" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }

  /v1/tenants/{id}/workloads/{workload}/approvals/{workflow}/{instance}:
    parameters:
      - $ref: "#/components/parameters/tenantID"
      - $ref: "#/components/parameters/workloadName"
      - name: workflow
        in: path
        required: true
        description: The Workflow's name (wrangler `workflows[].name`).
        schema: { type: string, pattern: "^[A-Za-z0-9_][A-Za-z0-9_-]{0,63}$" }
      - name: instance
        in: path
        required: true
        description: The Workflow instance ID.
        schema: { type: string, minLength: 1, maxLength: 256 }
    post:
      tags: [tenants, approvals]
      operationId: DecideApproval
      summary: Approve or reject a waiting Workflow instance (`tw approve`, the admin UI)
      description: |
        The decision is made by the caller's own tailnet identity: mgmt's
        WhoIs of the connection (user, node, tags). mgmt sends it, with
        the caller's `github.com/rosskukulinski/tailworks/cap/approve` grants toward `tag:tw-mgmt`, to
        the host holding the workload's lease; that host checks the grants
        (`cap_missing` otherwise: the workload, Workflow, step, decision and
        numeric limits a grant names), delivers the event (the Workflow
        sees `approver`, never one from the request) and audits the
        decision (`approval_decision`, or `approval_denied`). Being a tailworks
        admin does not let anyone approve: the grant does. The operator
        console and the local socket have no personal identity, so they
        get `403 no_identity`; use `tw link` from your own machine.
        `409 approval_not_pending` when nothing waits for this decision.
      x-tw-role: admin|approver
      x-tw-audit: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalDecisionRequest" }
      responses:
        "200":
          description: Delivered; the approval as decided.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalDecisionResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/Error" }

  /v1/tenants/{id}/notifications:
    parameters:
      - $ref: "#/components/parameters/tenantID"
    get:
      tags: [tenants, approvals]
      operationId: GetTenantNotifications
      summary: Read the tenant's notification webhook (`tw notify`), without secrets
      description: |
        ADR-047. The webhook URL is shown as its origin
        only (scheme and host): a chat webhook's path or query is its
        credential. Header names only. A tenant that sends nothing has no
        `webhook`. `404 unknown_tenant`.
      x-tw-role: admin|tenant:read
      responses:
        "200":
          description: The tenant's notification config.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationConfig" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
    put:
      tags: [tenants, approvals]
      operationId: PutTenantNotifications
      summary: Set the tenant's notification webhook (`tw notify set`)
      description: |
        ADR-047. When one of `events` happens in the
        tenant, mgmt POSTs a JSON `NotificationEvent` to `url` (header
        `Tw-Event`), with a deep link to the admin UI. `approval_requested`
        fires when a Workflow starts waiting for an approval (when mgmt
        receives the host's audit record, usually within seconds). mgmt
        dials the URL itself: a tailnet name, a `100.x` address or a
        `*.ts.net` name over mgmt's tailnet node, anything else over the
        host's network; loopback and link-local addresses are refused.
        Delivery is tried 3 times; a final failure is audited
        (`notification_failed`). The config is stored encrypted in mgmt
        custody (custody name `tw/<tenant>/notifications`); the URL's path
        and query and the header values are never logged, audited or
        returned. Audited (`kind: notification_put`, the URL's host and
        header names).
      x-tw-role: admin|tenant:deploy
      x-tw-audit: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationsPut" }
            examples:
              slack:
                value: { webhook: { url: "https://hooks.slack.com/services/T000/B000/XXXX", events: [approval_requested] } }
      responses:
        "200":
          description: The new config (origin and header names only).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationConfig" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [tenants, approvals]
      operationId: DeleteTenantNotifications
      summary: Stop the tenant's notifications (`tw notify rm`)
      description: "Idempotent. Audited (`kind: notification_delete`)."
      x-tw-role: admin|tenant:deploy
      x-tw-audit: true
      responses:
        "204":
          description: Deleted (or there was nothing to delete).
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }

  /v1/tenants/{id}/notifications/test:
    parameters:
      - $ref: "#/components/parameters/tenantID"
    post:
      tags: [tenants, approvals]
      operationId: TestTenantNotifications
      summary: Send a test notification now (`tw notify test`)
      description: |
        POSTs a `NotificationEvent` with `event: test` to the configured
        webhook once, synchronously, and reports the outcome. Not retried.
        Audited (`kind: notification_test`, the origin and the outcome).
        `404 not_found` when no webhook is set.
      x-tw-role: admin|tenant:deploy
      x-tw-audit: true
      responses:
        "200":
          description: The delivery attempt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationTestResult" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }

  /v1/tenants/{id}/workloads/{workload}/deployments:
    parameters:
      - $ref: "#/components/parameters/tenantID"
      - $ref: "#/components/parameters/workloadName"
    get:
      tags: [deployments]
      operationId: ListWorkloadDeployments
      summary: A workload's deployment history, newest first (`tw deployments`)
      description: |
        ADR-046. Every deployment of the workload, newest first:
        who deployed it, when, the bundle's SHA-256, its status (the current
        one is `assigned`, `starting`, `active` or `failed`; older ones are
        `superseded` or `stopped`), the host's last report (`hostStatus`)
        and whether mgmt still holds the bundle (`bundleRetained`). mgmt
        keeps the bundles of the newest `bundleRetention` deployments of
        each workload (tw-mgmt `-bundle-retention`) and prunes older ones;
        their records stay, without the bundle, so they can't be rolled back
        to. `rollbackOf` names the deployment a rollback redeployed. A
        workload with no deployment is `404 unknown_workload`.
      x-tw-role: admin|tenant:read
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: One page of the workload's deployments, ordered by `(createdAt, deploymentID)` descending.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeploymentHistoryPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }

  /v1/tenants/{id}/workloads/{workload}/rollbacks:
    parameters:
      - $ref: "#/components/parameters/tenantID"
      - $ref: "#/components/parameters/workloadName"
    post:
      tags: [deployments]
      operationId: CreateRollback
      summary: Roll a workload back to a stored bundle (`tw rollback`), or preflight it with dryRun
      description: |
        ADR-046. Redeploys the bundle of an earlier deployment
        as a **new** deployment, through the same code path as
        `POST /v1/deployments`: the same validation, placement, lease at
        `epoch+1` and host fencing, and the same `409 lease_held`,
        `move_unconfirmed` and `takeover_unconfirmed` refusals. Placement
        is sticky as for any deploy (the workload stays on its host unless
        `replace` or `host` say otherwise), so Durable Object storage stays
        where it is. Container images the original deploy built and pushed
        to tailworks' registry are reused by digest.

        Without `deploymentID`, the target is the newest earlier deployment
        that ran (the host reported it `active` and it did not fail), whose
        bundle is retained and differs from the current one's;
        `409 no_rollback_target` if there is none. A target whose bundle was
        pruned is `409 bundle_pruned`. Naming the current deployment is
        `409 no_rollback_target`.

        A rollback changes code and configuration only. Durable Object
        storage, D1 databases (migrations are forward-only), KV, R2 and
        queues keep their current data, and the workload gets the secrets
        it has **now**: secrets are not versioned with bundles.

        Audited as `kind: rollback` (in place of `deploy`), with
        `rollbackOf`. `dryRun=true` preflights the stored bundle against the
        current policy, like `POST /v1/deployments?dryRun=true`.
      x-tw-role: admin|tenant:deploy
      x-tw-audit: true
      parameters:
        - name: dryRun
          in: query
          description: Preflight only (`200 PreflightResult`); nothing is deployed.
          schema: { type: boolean, default: false }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RollbackCreate" }
      responses:
        "200":
          description: "`dryRun=true`: the preflight report of the target's bundle. Nothing was deployed."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreflightResult" }
        "202":
          description: Accepted; the host is starting the rolled-back deployment.
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rollback" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/Error" }

  /v1/tenants/{id}/workloads/{workload}/previews:
    parameters:
      - $ref: "#/components/parameters/tenantID"
      - $ref: "#/components/parameters/workloadName"
    get:
      tags: [deployments]
      operationId: ListWorkloadPreviews
      summary: A workload's running previews (`tw previews`)
      description: |
        ADR-048. The previews of the workload that are not
        stopped, newest first. A preview is created by
        `POST /v1/deployments` with `preview: true`: it runs as a workload
        of its own, `<workload>--preview-<alias>`, with its own lease,
        Durable Object storage and stores, and never joins the workload's
        Tailscale Service or public routes. A workload without previews
        answers an empty list.
      x-tw-role: admin|tenant:read
      responses:
        "200":
          description: The running previews.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreviewList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }

  /v1/tenants/{id}/workloads/{workload}/promotions:
    parameters:
      - $ref: "#/components/parameters/tenantID"
      - $ref: "#/components/parameters/workloadName"
    post:
      tags: [deployments]
      operationId: CreatePromotion
      summary: Promote a preview to the workload (`tw promote`), or preflight it with dryRun
      description: |
        ADR-048. Deploys the bundle the preview runs to the
        workload itself, as a **new** deployment, through the same code
        path as `POST /v1/deployments`: the same validation, placement
        (sticky), lease at `epoch+1`, host fencing and refusals, and the
        workload's own `replicas`, Tailscale Service and public routes.
        Container images the preview's deploy built are reused by digest.
        The preview's data does not move: the workload keeps its own
        Durable Object storage, stores and secrets.

        Then the preview is undeployed, unless `keepPreview`. An unknown
        preview, or one that is stopped, is `404 unknown_preview`; a preview
        whose host reported it `failed` is `409 preview_failed`.

        Audited as `kind: promote` (in place of `deploy`), with
        `promotedFrom` (the preview's deployment) and `preview`.
        `dryRun=true` preflights the preview's bundle against the current
        policy.
      x-tw-role: admin|tenant:deploy
      x-tw-audit: true
      parameters:
        - name: dryRun
          in: query
          description: Preflight only (`200 PreflightResult`); nothing is deployed.
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromotionCreate" }
      responses:
        "200":
          description: "`dryRun=true`: the preflight report of the preview's bundle. Nothing was deployed."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreflightResult" }
        "202":
          description: Accepted; the host is starting the promoted deployment.
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Promotion" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/Error" }

  /v1/tenants/{id}/workloads/{workload}/public:
    parameters:
      - $ref: "#/components/parameters/tenantID"
      - $ref: "#/components/parameters/workloadName"
    get:
      tags: [tenants, deployments]
      operationId: GetWorkloadPublic
      summary: Read a workload's public-ingress exposure (`tw expose`)
      description: |
        ADR-029. A workload whose `tailworks.jsonc` declares `public` routes is
        served over Funnel from its public node
        (`https://<workload>.<tailnet>.ts.net/`) while `exposed` is true and
        the tenant's `publicIngress` is `allow`. A workload that was never
        toggled is exposed.
      x-tw-role: admin|tenant:read
      responses:
        "200":
          description: The workload's exposure.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkloadPublic" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [tenants, deployments]
      operationId: UpdateWorkloadPublic
      summary: Expose or unexpose a workload's public routes (JSON Merge Patch)
      description: |
        `tw expose on|off` (ADR-029 D1): an operator override that survives
        redeploys. `exposed: false` makes the host close the public node's
        Funnel listener and reset its flows (the node and its certificate
        stay); `true` reopens it. The lease holder is pushed at once.
        `404 unknown_workload` when the tenant has no deployment of the
        workload. Audited (`kind: expose_on` / `expose_off`).
      x-tw-role: admin|tenant:deploy
      x-tw-audit: true
      parameters:
        - $ref: "#/components/parameters/ifMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: "#/components/schemas/WorkloadPublicPatch" }
            examples:
              off:
                value: { exposed: false }
          application/json:
            schema: { $ref: "#/components/schemas/WorkloadPublicPatch" }
      responses:
        "200":
          description: The updated exposure.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkloadPublic" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        default: { $ref: "#/components/responses/Error" }

  /v1/tenants/{id}/public-names:
    parameters:
      - $ref: "#/components/parameters/tenantID"
    get:
      tags: [tenants, deployments]
      operationId: ListPublicNames
      summary: List the public names a tenant owns
      description: |
        ADR-029, red-team H10. A public workload is served at
        `https://<workload>.<tailnet>.ts.net/`, so its name is unique per
        tailnet, not per tenant. The first tenant to deploy public routes
        under a name owns it on that tailnet, across undeploys and
        redeploys, until it releases it (`DELETE …/public-names/{name}`) or
        the tenant is deleted. A deploy (or dry run) by another tenant on the
        same tailnet is refused with `409 public_name_owned`. Ordered by
        `(claimedAt, name)`.
      x-tw-role: admin|tenant:read
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: One page of the tenant's public names, ordered by `(claimedAt, name)`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicNamePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }

  /v1/tenants/{id}/public-names/{name}:
    parameters:
      - $ref: "#/components/parameters/tenantID"
      - $ref: "#/components/parameters/publicName"
    delete:
      tags: [tenants, deployments]
      operationId: ReleasePublicName
      summary: Release a public name the tenant owns
      description: |
        Red-team H10. Gives up the tenant's claim on a public name, so any
        tenant on the tailnet can deploy public routes under it next. Only
        a name nothing serves can be released: `409 public_name_in_use`
        while the workload's latest deployment declares public routes or
        its public node is live (undeploy it, or remove `"public"` from its
        `tailworks.jsonc` and redeploy, first). `404 not_found` when the tenant
        does not own the name. Audited (`kind: public_name_release`).
      x-tw-role: admin|tenant:deploy
      x-tw-audit: true
      responses:
        "204":
          description: Released.
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/Error" }

  /v1/tenants/{id}/workloads/{workload}/secrets:
    parameters:
      - $ref: "#/components/parameters/tenantID"
      - $ref: "#/components/parameters/workloadName"
    get:
      tags: [secrets]
      operationId: ListWorkloadSecrets
      summary: List a workload's secrets (names and times, never values)
      description: |
        `tw secret ls`. No admin operation returns a value; only the lease
        holder gets them (`POST …/secret-grants`). Ordered by name. A
        workload with no secrets (or never deployed) is an empty page.
        `404 unknown_tenant`.
      x-tw-role: admin|tenant:read
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: One page of secrets, ordered by name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }

  /v1/tenants/{id}/workloads/{workload}/secrets/{name}:
    parameters:
      - $ref: "#/components/parameters/tenantID"
      - $ref: "#/components/parameters/workloadName"
      - $ref: "#/components/parameters/secretName"
    put:
      tags: [secrets]
      operationId: PutWorkloadSecret
      summary: Create or replace a workload secret (`tw secret put`)
      description: |
        ADR-034. Stores the value encrypted at rest in mgmt's
        custody (custody name `tw/<tenant>/workloads/<workload>/secrets`).
        The workload need not be deployed yet. The value reaches the
        workload as the text binding `env.<name>` (runtime `node`: the
        environment variable `<name>`) on its **next deploy**; running
        instances keep the value they started with. At most 128 secrets per
        workload and 5 KiB per value. Names are JS identifiers that are also
        environment variable names; `TW_…` and `__TW…` are reserved. The
        value is never logged, audited or returned. Audited
        (`kind: secret_put`, name only).
      x-tw-role: admin|tenant:secrets
      x-tw-audit: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecretPut" }
      responses:
        "200":
          description: Replaced.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Secret" }
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Secret" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [secrets]
      operationId: DeleteWorkloadSecret
      summary: Delete a workload secret (`tw secret rm`)
      description: |
        Takes effect on the workload's next deploy. `404 unknown_secret`
        when the workload has no secret of that name. Audited
        (`kind: secret_delete`).
      x-tw-role: admin|tenant:secrets
      x-tw-audit: true
      responses:
        "204":
          description: Deleted.
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }

  /v1/tenants/{id}/workloads/{workload}/secret-grants:
    parameters:
      - $ref: "#/components/parameters/tenantID"
      - $ref: "#/components/parameters/workloadName"
    post:
      tags: [secrets, credentials]
      operationId: CreateWorkloadSecretGrant
      summary: Release a workload's secret values to the lease holder
      description: |
        hostd calls this when it starts a deployment of the workload. As
        with a volume key grant, the values are released only to the host
        holding the workload's lease at `epoch` (`409 lease_lost`), with
        `Cache-Control: no-store`, and are never logged. A workload with no
        secrets gets an empty map. Audited (`kind: secret_release`, names
        only) when there is at least one secret.
      x-tw-role: host
      x-tw-audit: true
      parameters:
        - $ref: "#/components/parameters/epoch"
      responses:
        "201":
          description: The grant.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretGrant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/LeaseLost" }
        default: { $ref: "#/components/responses/Error" }

  /v1/tenants/{id}/workloads/{workload}/stores:
    parameters:
      - $ref: "#/components/parameters/tenantID"
      - $ref: "#/components/parameters/workloadName"
    get:
      tags: [stores]
      operationId: ListWorkloadStores
      summary: List a workload's stores
      description: |
        Every store of the workload (all kinds), ordered by `(kind, name)`.
        A store exists once something was written to it (a binding's first
        write, or `PUT …/stores/{kind}/{name}`). Sizes are of the journal
        mgmt keeps, after compaction.
      x-tw-role: admin|tenant:read
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
        - name: kind
          in: query
          description: Only stores of this kind.
          schema: { $ref: "#/components/schemas/StoreKind" }
      responses:
        "200":
          description: One page of stores.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }

  /v1/tenants/{id}/workloads/{workload}/stores/{kind}/{name}:
    parameters:
      - $ref: "#/components/parameters/tenantID"
      - $ref: "#/components/parameters/workloadName"
      - $ref: "#/components/parameters/storeKind"
      - $ref: "#/components/parameters/storeName"
    get:
      tags: [stores]
      operationId: GetWorkloadStore
      summary: Get one store
      x-tw-role: admin|tenant:read
      responses:
        "200":
          description: The store.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Store" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
    put:
      tags: [stores]
      operationId: PutWorkloadStore
      summary: Create a store (idempotent)
      description: |
        Creates an empty store (`201`), or answers the existing one
        (`200`). A binding's first write creates its store too, so this is
        only needed to create one before the first deploy. Audited
        (`kind: store_create`) when it creates.
      x-tw-role: admin|tenant:data
      x-tw-audit: true
      responses:
        "200":
          description: The store already existed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Store" }
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Store" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [stores]
      operationId: DeleteWorkloadStore
      summary: Delete a store and its data
      description: |
        Deletes the journal and the store's data key (custody), so the
        sealed entries can't be read again even from a backup of the
        database. A running workload's store object notices on its next
        sync (a new incarnation) and empties itself; a later write starts
        a new, empty store. `404 unknown_store` if there is none. Audited
        (`kind: store_delete`).
      x-tw-role: admin|tenant:data
      x-tw-audit: true
      responses:
        "204":
          description: Deleted.
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }

  /v1/tenants/{id}/workloads/{workload}/stores/{kind}/{name}/journal:
    parameters:
      - $ref: "#/components/parameters/tenantID"
      - $ref: "#/components/parameters/workloadName"
      - $ref: "#/components/parameters/storeKind"
      - $ref: "#/components/parameters/storeName"
    get:
      tags: [stores]
      operationId: ReadStoreJournal
      summary: Read a store's journal after a sequence number
      description: |
        The entries with `seq > after`, in order, for a store object
        catching up (after a restart, on a new host, or when another
        writer appended). Entries superseded by a later entry with the same
        `ckey` are gone (compaction), so `seq` has gaps; the page is still
        a complete catch-up from `after`. An unknown store is an empty page
        with `head` 0 and no `incarnation`.

        A host must give `epoch`: the data is released only to the holder
        of the workload's lease at that epoch (`409 lease_lost`, as for
        secrets). An admin reads without it (`tw kv key get`).
      x-tw-role: admin|host|tenant:data
      parameters:
        - $ref: "#/components/parameters/storeEpoch"
        - name: after
          in: query
          description: Return entries with a larger `seq` (default 0).
          schema: { type: integer, format: int64, minimum: 0 }
        - name: limit
          in: query
          description: At most this many entries (default and maximum 1000; a page also stops at about 4 MiB of data).
          schema: { type: integer, minimum: 1, maximum: 1000 }
      responses:
        "200":
          description: A page of entries.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreJournal" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/LeaseLost" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [stores]
      operationId: AppendStoreJournal
      summary: Append entries to a store's journal (conditional on its head)
      description: |
        The write path of a store object: it appends here **before** it
        applies the change locally, so an acknowledged write is never only
        on one host's disk. The append succeeds only if the journal's head
        is still `after` (and `incarnation` matches when given); otherwise
        `409 store_conflict`, and the writer catches up
        (`GET …/journal?after=`) and retries. That makes the journal
        linearizable across writers (a workload's replicas, an admin's
        `tw kv key put`). An entry with a `ckey` supersedes every earlier
        entry with the same `ckey`, which mgmt deletes in the same
        transaction. The first append creates the store.

        Entries are sealed at rest with the store's data key (AES-256-GCM,
        custody); `ckey` is stored as an HMAC under a key derived from it.

        A host must give `epoch` (lease holder at that epoch, `409
        lease_lost`): a host that lost the workload can't write. Not
        audited per append (stores are high volume); creation is
        (`kind: store_create`). Limits: 128 entries and 4 MiB of data per
        append, 2 MiB per entry, 1 GiB per store (`400 store_limit`).
      x-tw-role: admin|host|tenant:data
      parameters:
        - $ref: "#/components/parameters/storeEpoch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StoreAppend" }
      responses:
        "201":
          description: Appended.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreAppendResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/StoreConflict" }
        default: { $ref: "#/components/responses/Error" }

  /v1/tenants/{id}/workloads/{workload}/stores/kv/{name}/keys:
    parameters:
      - $ref: "#/components/parameters/tenantID"
      - $ref: "#/components/parameters/workloadName"
      - $ref: "#/components/parameters/storeName"
    get:
      tags: [stores]
      operationId: ListKVKeys
      summary: List a KV namespace's keys
      description: |
        Workers KV's `list()` for operators (`tw kv key list`,
        ADR-037): live keys in UTF-8 byte order, with their
        expiration and metadata, `limit` at a time (default and maximum
        1000). Pass the answer's `cursor` to get the next page. mgmt reads
        the namespace's journal (its own copy), so the answer includes
        every acknowledged write. `404 unknown_store` if the namespace
        does not exist.
      x-tw-role: admin|tenant:data
      parameters:
        - name: prefix
          in: query
          description: Only keys that start with this.
          schema: { type: string, maxLength: 512 }
        - name: cursor
          in: query
          description: The `cursor` of the previous page.
          schema: { type: string, maxLength: 1024 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000 }
      responses:
        "200":
          description: One page of keys.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KVKeyPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }

  /v1/tenants/{id}/workloads/{workload}/stores/kv/{name}/value:
    parameters:
      - $ref: "#/components/parameters/tenantID"
      - $ref: "#/components/parameters/workloadName"
      - $ref: "#/components/parameters/storeName"
      - name: key
        in: query
        required: true
        description: The KV key (any UTF-8, 1 to 512 bytes; not `.` or `..`).
        schema: { type: string, minLength: 1, maxLength: 512 }
    get:
      tags: [stores]
      operationId: GetKVValue
      summary: Get one KV value
      description: |
        `tw kv key get`. `404 not_found` if the key does not exist or has
        expired, `404 unknown_store` if the namespace does not.
      x-tw-role: admin|tenant:data
      responses:
        "200":
          description: The value.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KVValue" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
    put:
      tags: [stores]
      operationId: PutKVValue
      summary: Write one KV value
      description: |
        `tw kv key put`: a journal append, like a binding's `put()`, so
        running workloads see it on their next sync (within 60 s, or a
        read's `cacheTtl`). Cloudflare's rules apply: `expirationTtl` and
        `expiration` at least 60 s ahead, metadata at most 1024 bytes of
        JSON, values at most 2 MiB − 4 KiB (`400 bad_request` /
        `400 store_limit`). The namespace must exist (`404
        unknown_store`; `tw kv namespace create`). Audited (`kind:
        kv_put`) with the namespace and who wrote, not the key: key names
        can be sensitive, and mgmt keeps them only sealed and HMACed.
      x-tw-role: admin|tenant:data
      x-tw-audit: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KVPut" }
      responses:
        "200":
          description: Written.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KVKey" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/StoreConflict" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [stores]
      operationId: DeleteKVValue
      summary: Delete one KV value
      description: "`tw kv key delete`. Deleting a key that does not exist succeeds and writes nothing. Audited (`kind: kv_delete`, the namespace only) when it deletes."
      x-tw-role: admin|tenant:data
      x-tw-audit: true
      responses:
        "204":
          description: Deleted (or there was nothing to delete).
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/StoreConflict" }
        default: { $ref: "#/components/responses/Error" }

  /v1/tenants/{id}/workloads/{workload}/d1/{name}/query:
    parameters:
      - $ref: "#/components/parameters/tenantID"
      - $ref: "#/components/parameters/workloadName"
      - $ref: "#/components/parameters/storeName"
    post:
      tags: [stores]
      operationId: QueryD1
      summary: Run SQL on a D1 database (`tw d1 execute`, `tw d1 migrations apply`)
      description: |
        A D1 database (ADR-038) is the workload's platform store of kind
        `d1` named after the binding's `database_name`. Its data is served
        by the store object in the workload's workerd, so mgmt sends the
        statements to the host holding the workload's lease (the mgmt →
        hostd channel, as for logs), which hands them to its platform
        worker. They run as one batch: atomic, after the store object has
        caught up with the journal, and a batch that writes is appended to
        the journal before it is applied, like every write through the
        binding.

        `200` with one result per statement (D1's shape, rows and
        columns). A failing statement fails the whole batch (`400
        d1_error`, with SQLite's message; nothing is applied). `404
        unknown_workload` when the workload isn't running (the database is
        only reachable through a running deployment that binds it); `404
        unknown_store` when its deployment binds no such database. `409
        store_degraded` when the store object could not apply a journal
        entry (ADR-038): it refuses writes until then. A batch
        that changed the database is audited (`kind: d1_write`, with the
        statement count, never the SQL); a read is logged.
      x-tw-role: admin|tenant:data
      x-tw-audit: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/D1Query" }
      responses:
        "200":
          description: One result per statement.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/D1Result" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }

  /v1/tenants/{id}/workloads/{workload}/d1/{name}/export:
    parameters:
      - $ref: "#/components/parameters/tenantID"
      - $ref: "#/components/parameters/workloadName"
      - $ref: "#/components/parameters/storeName"
    get:
      tags: [stores]
      operationId: ExportD1
      summary: Export a D1 database as SQL (`tw d1 export`)
      description: |
        The database's schema and rows as SQL text, in the shape of
        `wrangler d1 export` (`PRAGMA defer_foreign_keys=TRUE;`, each
        table and its `INSERT`s, then indexes, triggers and views), read
        from the store object of the running workload after it has caught
        up with the journal. At most 16 MiB (`400 store_limit` beyond).
        Rows of virtual tables are not exported. A database that could
        not apply a journal entry (degraded) exports what it applied,
        headed by a `-- tailworks: degraded export` comment naming the
        entry. A read: logged, not audited.
      x-tw-role: admin|tenant:data
      responses:
        "200":
          description: The SQL.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            text/plain:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }

  # ----------------------------------------------------------------- queues
  /v1/tenants/{id}/queues:
    parameters:
      - $ref: "#/components/parameters/tenantID"
    get:
      tags: [queues]
      operationId: ListQueues
      summary: List a tenant's queues
      description: |
        Every queue of the tenant, by name, with its backlog. A queue
        exists once something sent to or pulled from it, or after
        `PUT /v1/tenants/{id}/queues/{queue}`.
      x-tw-role: admin|tenant:read
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: One page of queues.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueuePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }

  /v1/tenants/{id}/queues/{queue}:
    parameters:
      - $ref: "#/components/parameters/tenantID"
      - $ref: "#/components/parameters/queueName"
    get:
      tags: [queues]
      operationId: GetQueue
      summary: Get one queue and its backlog
      description: |
        The queue's counters: messages kept (`backlog`), of which claimed by
        a consumer and not settled (`inFlight`) and not yet visible
        (`delayed`), their bytes, and the oldest message's send time. A
        host reads it for a producer binding's `metrics()` (with
        `workload` and `epoch`, as for a send).
      x-tw-role: admin|host|tenant:read
      parameters:
        - $ref: "#/components/parameters/queueWorkload"
        - $ref: "#/components/parameters/queueEpoch"
      responses:
        "200":
          description: The queue.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Queue" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/LeaseLost" }
        default: { $ref: "#/components/responses/Error" }
    put:
      tags: [queues]
      operationId: PutQueue
      summary: Create a queue (idempotent)
      description: |
        Creates an empty queue (`201`) or answers the existing one (`200`).
        A queue is also created by its first send or pull, and a
        dead-letter queue by the first message moved to it. Audited
        (`kind: queue_create`) when it creates.
      x-tw-role: admin|tenant:data
      x-tw-audit: true
      responses:
        "200":
          description: The queue already existed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Queue" }
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Queue" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [queues]
      operationId: DeleteQueue
      summary: Delete a queue and its messages
      description: |
        Deletes every message and the queue's data key (custody), so the
        sealed bodies can't be read again even from a database backup.
        Consumers holding claimed messages find their lease IDs stale. A
        later send creates a new, empty queue. `404 unknown_queue` if there
        is none. Audited (`kind: queue_delete`).
      x-tw-role: admin|tenant:data
      x-tw-audit: true
      responses:
        "204":
          description: Deleted.
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }

  /v1/tenants/{id}/queues/{queue}/purge:
    parameters:
      - $ref: "#/components/parameters/tenantID"
      - $ref: "#/components/parameters/queueName"
    post:
      tags: [queues]
      operationId: PurgeQueue
      summary: Delete every message of a queue, keeping the queue
      description: |
        Deletes all messages, in flight or not. Audited
        (`kind: queue_purge`, with the count).
      x-tw-role: admin|tenant:data
      x-tw-audit: true
      responses:
        "200":
          description: Purged.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueuePurgeResult" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }

  /v1/tenants/{id}/queues/{queue}/messages:
    parameters:
      - $ref: "#/components/parameters/tenantID"
      - $ref: "#/components/parameters/queueName"
    get:
      tags: [queues]
      operationId: PeekQueueMessages
      summary: Read messages without claiming them
      description: |
        The oldest messages, bodies included, without changing them (no
        lease, no attempt counted). This is how an operator inspects a
        dead-letter queue (`tw queues messages <queue>`).
      x-tw-role: admin|tenant:data
      parameters:
        - name: limit
          in: query
          description: At most this many messages (default 20, maximum 100).
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: The messages, oldest first.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueueMessageList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [queues]
      operationId: SendQueueMessages
      summary: Send messages to a queue
      description: |
        A producer's `send()` / `sendBatch()` (through its host), or an
        operator's `tw queues send`. The messages are durable in mgmt's
        database when this answers. Each gets a random ID. A host must give
        `workload` and `epoch` (the lease it holds, `409 lease_lost`), and
        the workload's latest deployment must bind the queue as a producer
        (`403 forbidden` otherwise). Not audited (volume). Limits: 100
        messages and 256 KB per call, 128 KB per message, `delaySeconds` ≤
        43200 (`400 queue_limit`); 1 GiB kept per queue.
      x-tw-role: admin|host|tenant:data
      parameters:
        - $ref: "#/components/parameters/queueWorkload"
        - $ref: "#/components/parameters/queueEpoch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QueueSend" }
      responses:
        "201":
          description: Sent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueueSendResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/LeaseLost" }
        default: { $ref: "#/components/responses/Error" }

  /v1/tenants/{id}/queues/{queue}/messages/pull:
    parameters:
      - $ref: "#/components/parameters/tenantID"
      - $ref: "#/components/parameters/queueName"
    post:
      tags: [queues]
      operationId: PullQueueMessages
      summary: Claim a batch of messages (push consumers and HTTP pull)
      description: |
        Claims up to `batchSize` visible messages, oldest first: each is
        hidden for `visibilityTimeoutMs`, gets a new `leaseId` and counts an
        attempt. Settle them with `…/messages/ack` before the timeout, or
        they become visible again (at-least-once). If none is visible, waits
        up to `waitMs` for one. A message that already failed more than
        `maxRetries` times and whose last lease expired is moved to the
        dead-letter queue (or dropped) instead of being delivered again.

        A host (a push consumer's hostd) must give `workload` and `epoch`;
        the workload's latest deployment must declare a consumer of the
        queue, and its `max_retries` and `dead_letter_queue` apply (the
        body's are ignored). An admin is an HTTP pull consumer and gives
        them in the body.
      x-tw-role: admin|host|tenant:data
      parameters:
        - $ref: "#/components/parameters/queueWorkload"
        - $ref: "#/components/parameters/queueEpoch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QueuePull" }
      responses:
        "200":
          description: The claimed messages (possibly none).
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueuePullResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/LeaseLost" }
        default: { $ref: "#/components/responses/Error" }

  /v1/tenants/{id}/queues/{queue}/messages/ack:
    parameters:
      - $ref: "#/components/parameters/tenantID"
      - $ref: "#/components/parameters/queueName"
    post:
      tags: [queues]
      operationId: AckQueueMessages
      summary: Settle claimed messages (ack, retry, extend)
      description: |
        `acks` deletes messages; `release` hands them back uncounted (the
        consumer never ran them); `retries` makes them visible again after
        `delaySeconds` (default: the consumer's `retry_delay`), or moves
        them to the dead-letter queue (or drops them) once they have been
        delivered more than `maxRetries` times; `extend` keeps them hidden
        for another `visibilityTimeoutMs` (a long handler). A lease ID that
        is no longer current (its timeout passed and the message was
        claimed again, or settled) changes nothing and is counted in
        `stale`. Host rules as for `…/pull`.
      x-tw-role: admin|host|tenant:data
      parameters:
        - $ref: "#/components/parameters/queueWorkload"
        - $ref: "#/components/parameters/queueEpoch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QueueAck" }
      responses:
        "200":
          description: Settled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueueAckResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/LeaseLost" }
        default: { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------------ hosts

  /v1/tenants/{id}/workloads/{workload}/telemetry-grants:
    parameters:
      - $ref: "#/components/parameters/tenantID"
      - $ref: "#/components/parameters/workloadName"
    post:
      tags: [telemetry, credentials]
      operationId: CreateTelemetryGrant
      summary: Release the tenant's OTLP export config to a workload's lease holder
      description: |
        hostd calls this when it starts a workload, and every minute while
        it runs it, to export the workload's logs, metrics and spans
        (ADR-045). As with secrets (ADR-034), the config, header
        values included, is released only to the host holding the
        workload's lease at `epoch` (`409 lease_lost`), with
        `Cache-Control: no-store`, and is never logged. `otlp` is absent
        when the tenant exports nothing. Audited (`kind:
        telemetry_release`, endpoint and header names) the first time a
        host gets each version of the config for a workload (hosts re-read
        it every minute); a refusal always is.
      x-tw-role: host
      x-tw-audit: true
      parameters:
        - $ref: "#/components/parameters/epoch"
      responses:
        "201":
          description: The grant.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TelemetryGrant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/LeaseLost" }
        default: { $ref: "#/components/responses/Error" }

  /v1/tenants/{id}/telemetry:
    parameters:
      - $ref: "#/components/parameters/tenantID"
    get:
      tags: [telemetry]
      operationId: GetTenantTelemetry
      summary: Read the tenant's OTLP export (`tw telemetry`), without header values
      description: |
        ADR-045. Header names only: no admin operation returns a
        header value. A tenant that exports nothing has no `otlp`.
        `404 unknown_tenant`.
      x-tw-role: admin|tenant:read
      responses:
        "200":
          description: The tenant's telemetry config.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TelemetryConfig" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
    put:
      tags: [telemetry]
      operationId: PutTenantTelemetry
      summary: Set the tenant's OTLP export (`tw telemetry set`)
      description: |
        Every workload of the tenant exports its request records (as log
        records), its metrics and its spans with OTLP/HTTP (JSON encoding)
        to `<endpoint>/v1/{logs,metrics,traces}`. The collector is dialed
        **from the workload's own tailnet node**, so it must be a tailnet
        peer the tailnet policy lets that workload reach (a public
        internet endpoint is refused like any other egress). The config
        is stored encrypted in mgmt custody (custody name
        `tw/<tenant>/telemetry`); header values (collector credentials)
        are never logged, audited or returned. Hosts pick a change up
        within a minute. Audited (`kind: telemetry_put`, endpoint and
        header names).
      x-tw-role: admin|tenant:deploy
      x-tw-audit: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TelemetryPut" }
            examples:
              collector:
                value: { otlp: { endpoint: "http://otel-collector:4318", headers: { authorization: "Bearer …" } } }
      responses:
        "200":
          description: The new config (header names only).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TelemetryConfig" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [telemetry]
      operationId: DeleteTenantTelemetry
      summary: Stop the tenant's OTLP export (`tw telemetry rm`)
      description: |
        Hosts stop exporting within a minute. Records stay on the hosts
        (`tw logs`) and in `/metrics`. Idempotent. Audited
        (`kind: telemetry_delete`).
      x-tw-role: admin|tenant:deploy
      x-tw-audit: true
      responses:
        "204":
          description: Deleted (or there was nothing to delete).
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }

  /v1/hosts:
    post:
      tags: [hosts, credentials]
      operationId: CreateHost
      summary: Add a host and mint its single-use join key
      description: |
        `tw host add`: creates the host record (status `pending`), mints a
        **single-use, pre-authorized auth key for `tag:tw-host`** (10 min)
        and a one-time `registrationSecret` (32 random bytes, base64url; only
        its SHA-256 is stored) that the host must present on its first
        `PUT /v1/hosts/{id}`, so the join key alone cannot claim the host ID
        through the operator tenant's credential (its OAuth client, or the
        Headscale API key). `tw-hostd join --token <key>` joins the operator tailnet
        with it as `tw-host-<hostID>`, then `PUT /v1/hosts/{id}` binds that
        node to the record. Calling it again for a host that has not bound a
        node yet mints a fresh key (`200`); a bound host is `409 exists`
        (delete it first). The key is never logged. Audited
        (`kind: host_add`).
      x-tw-role: admin
      x-tw-audit: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HostCreate" }
            example: { hostID: h-mbp, tenantID: tn_tail7906d5 }
      responses:
        "201":
          description: Created; the join key.
          headers:
            Location: { $ref: "#/components/headers/Location" }
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HostJoin" }
        "200":
          description: The pending host exists; a fresh join key.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HostJoin" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Unknown operator tenant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502":
          description: The control plane refused the mint (`bootstrap_failed`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
    get:
      tags: [hosts]
      operationId: ListHosts
      summary: List hosts
      x-tw-role: admin
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
        - name: live
          in: query
          description: Only hosts that heartbeated within the host lease TTL (10 s).
          schema: { type: boolean }
      responses:
        "200":
          description: One page of hosts, ordered by `(createdAt, hostID)`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HostPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/Error" }

  /v1/hosts/{id}:
    parameters:
      - $ref: "#/components/parameters/hostID"
    put:
      tags: [hosts]
      operationId: RegisterHost
      summary: Register or re-register a host (idempotent)
      description: |
        The host's own record. Over the tailnet the WhoIs node (`tag:tw-host`)
        is bound to this `hostID` on first registration, which must carry the
        `registrationSecret` from `POST /v1/hosts` (missing or wrong:
        `403 host_identity_mismatch`; the secret is cleared once the node is
        bound). A `PUT` for a host ID the admin never created is
        `403 host_not_registered` (no implicit creation over the tailnet;
        only the `--local-dev` socket keeps it). A different node using the
        same ID is `403 host_identity_mismatch`. Re-registering with the same
        node needs no secret and replaces capacity, tiers and `push`;
        `auditPubKey` is **pinned on first bind** (a later `PUT` may repeat
        it or omit it; a different key is `403 host_identity_mismatch` and
        rotating it is `tw host rm` + `tw host add`). Hosts re-register on
        every restart.

        A host that was created through `tw host add` exists before its first
        `PUT` (status `pending`); the `PUT` activates it.
      x-tw-role: host
      x-tw-audit: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HostRegistration" }
            example:
              capacityNodes: 200
              tiers: [process]
              auditPubKey: "MCowBQYDK2VwAyEA…"
              push: { port: 7474 }
      responses:
        "200":
          description: Re-registered.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Host" }
        "201":
          description: First registration of this host ID.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Host" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403":
          description: Another node owns this host ID, or the caller is not a `tag:tw-host` node.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: host_identity_mismatch
                message: host h-7f2a is registered to another node
                doc_url: https://github.com/rosskukulinski/tailworks/blob/master/docs/errors.md#host_identity_mismatch
                trace_id: 7f3a…
        default: { $ref: "#/components/responses/Error" }
    get:
      tags: [hosts]
      operationId: GetHost
      summary: Read a host
      x-tw-role: admin|host
      parameters:
        - $ref: "#/components/parameters/ifNoneMatch"
      responses:
        "200":
          description: The host.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Host" }
        "304": { $ref: "#/components/responses/NotModified" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [hosts]
      operationId: DeleteHost
      summary: Drain and remove a host
      description: |
        `409 host_holds_leases` while the host holds any namespace lease,
        unless `drain=true`: then its deployments are marked `draining`, its
        objects are killed (cascade), leases are released and the record goes.
        Pushes to the host stop. The host's tsnet device is deleted through the
        operator credential when mgmt has one; otherwise it is reported in
        `devicesLeft`.
      x-tw-role: admin
      x-tw-audit: true
      parameters:
        - $ref: "#/components/parameters/ifMatch"
        - name: drain
          in: query
          description: Kill the host's objects and release its leases first.
          schema: { type: boolean, default: false }
      responses:
        "202":
          description: Accepted; the drain runs. Poll `GET /v1/hosts/{id}` until `404`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HostDeleteResult" }
        "204":
          description: Removed (it held nothing).
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The host holds leases and `drain` was not set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: host_holds_leases
                message: "host h-7f2a holds 2 leases; pass ?drain=true"
                missing: { leases: ["tn_tail7906d5/agent", "tn_tail7906d5/mcp"] }
                doc_url: https://github.com/rosskukulinski/tailworks/blob/master/docs/errors.md#host_holds_leases
                trace_id: 7f3a…
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        default: { $ref: "#/components/responses/Error" }

  /v1/hosts/{id}/status:
    parameters:
      - $ref: "#/components/parameters/hostID"
    put:
      tags: [hosts]
      operationId: ReportHostStatus
      summary: Heartbeat (replace the host's reported status)
      description: |
        Every 3 s. Renews the host lease (TTL 10 s) and every namespace lease
        in `leases` (TTL 15 s; a renew succeeds while `(holder, epoch)` still
        matches). The reply lists the leases that are no longer held
        (`revoke`) and the objects killed in the last 10 min in namespaces
        this host holds (`revokeObjects`; they repeat until the window passes,
        so the host's kill must be idempotent). Replaces
        `POST /v0/hosts/{id}/heartbeat`. Not audited (3 s cadence).
      x-tw-role: host
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HostStatus" }
      responses:
        "200":
          description: Renewed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HostStatusResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: The host never registered (`host_not_registered`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/hosts/{id}/cordon:
    parameters:
      - $ref: "#/components/parameters/hostID"
    put:
      tags: [hosts]
      operationId: CordonHost
      summary: Cordon a host (no new placements)
      description: |
        The host keeps running what it runs, keeps heartbeating and keeps its leases; placement
        skips it (`cordoned` in a decision). Idempotent; audited `host_cordon`.
      x-tw-role: admin
      x-tw-audit: true
      responses:
        "200":
          description: Cordoned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Host" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [hosts]
      operationId: UncordonHost
      summary: Uncordon a host
      description: Placement may choose the host again. Idempotent; audited `host_uncordon`.
      x-tw-role: admin
      x-tw-audit: true
      responses:
        "200":
          description: Uncordoned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Host" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }

  /v1/hosts/{id}/drain:
    parameters:
      - $ref: "#/components/parameters/hostID"
    post:
      tags: [hosts]
      operationId: DrainHost
      summary: Cordon a host and move its workloads to other hosts
      description: |
        Cordons the host, then re-places each workload assigned to it on another eligible host
        (`tw deploy --replace` with this host excluded; the lease moves at the next epoch):

        - a stateless workload (no Durable Objects) moves;
        - a workload with Durable Objects keeps its storage on this host's disk, so it is refused
          (`refused`, `move_unconfirmed`) unless `allowLocalStateLoss` is set; then it moves
          and its objects start empty on the new host;
        - a workload with no other eligible host is refused (`no_host`, `feature_unavailable`).

        `dryRun` reports what would happen and changes nothing (the host is not cordoned).
        Audited `host_drain`. The host record is kept: `tw host uncordon` takes it back, and
        `DELETE /v1/hosts/{id}` removes it.
      x-tw-role: admin
      x-tw-audit: true
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HostDrainRequest" }
      responses:
        "200":
          description: The drain's outcome per workload.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HostDrainResult" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }

  /v1/hosts/{id}/paths:
    parameters:
      - $ref: "#/components/parameters/hostID"
    put:
      tags: [hosts]
      operationId: ReportHostPaths
      summary: Report measured tailnet paths (smart placement)
      description: |
        Smart placement (ADR-033). The host reports, per tenant, the path
        from that tenant's nodes on this host to each target its workloads
        declare (`placementTargets` in its assignments): `direct` WireGuard,
        `peer-relay`, `derp`, or `unresolved` / `unreachable`, with the RTT.
        Each listed tenant's stored rows for this host are **replaced**.
        `ageMs` is how long ago the host measured (its monotonic clock);
        mgmt stamps `measuredAt` with the store clock, and placement ignores
        measurements older than 5 min. A host may report only for tenants it
        runs a workload of (`403` otherwise). Bounds: 64 tenants, 32 targets
        each. Hosts send it at most once a minute, and only while they have
        targets. Not audited (telemetry); the placement decision it feeds is
        recorded with the deploy.
      x-tw-role: host
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HostPathReport" }
      responses:
        "200":
          description: Stored.
          content:
            application/json:
              schema:
                type: object
                required: [stored]
                properties:
                  stored: { type: integer, description: Targets stored. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: The host never registered (`host_not_registered`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/hosts/{id}/sandbox-deny:
    parameters:
      - $ref: "#/components/parameters/hostID"
    get:
      tags: [hosts]
      operationId: GetHostSandboxDeny
      summary: Every tenant's credential file paths, for the host's sandbox deny list
      description: |
        The paths of every tenant's `apiKeyFile` and `oauthClientFile`
        (sorted, deduplicated), and nothing else: no tenant ID, tailnet or
        name. A process-tier host denies them all to every workload sandbox
        it starts, including the files of tenants that have no deployment
        on it yet. `GET /v1/tenants` shows a host only its own tenants, which
        is not enough: a workload started before another tenant's first
        deploy would otherwise be able to read that tenant's key file. A
        host may read only its own `{id}`.
      x-tw-role: host|admin
      responses:
        "200":
          description: The paths.
          content:
            application/json:
              schema:
                type: object
                required: [paths]
                properties:
                  paths:
                    type: array
                    items: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }

  /v1/hosts/{id}/assignments:
    parameters:
      - $ref: "#/components/parameters/hostID"
    get:
      tags: [hosts, deployments]
      operationId: ListHostAssignments
      summary: List the deployments assigned to a host
      x-tw-role: host|admin
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: One page of assignments, ordered by `(createdAt, deploymentID)`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssignmentPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------ deployments
  /v1/deployments:
    post:
      tags: [deployments]
      operationId: CreateDeployment
      summary: Deploy a workload (async), or preflight it with dryRun
      description: |
        mgmt reads `tailworks.jsonc` from the bundle (a tar, optionally gzipped;
        the shallowest `tailworks.jsonc`): `tailnet.tags` (the `_workload` entry
        node), `tailnet.objects.<Class>.{tags, agent, ttl, node}`,
        `tailnet.spawn.{maxLive ≤ 64, maxDepth ≤ 3}`, `tailnet.connects`,
        `tier`, `runtime`, `placement.{mode, targets, aggregate}` (or
        wrangler's `placement`). A bundle with neither `tailnet.tags` nor
        `tailnet.objects` is `400 bad_bundle`. mgmt also validates
        `wrangler.jsonc` `triggers.crons` (cron triggers: at most 10, no
        duplicates, each a valid five-field UTC expression that can fire); an
        invalid one is `400 bad_bundle`.
        Every tag must match `^tag:[a-zA-Z0-9][a-zA-Z0-9._-]*$`
        (`400 bad_request`), and tailworks' own infrastructure tags (`tag:tw`,
        `tag:tw-mgmt`, `tag:tw-host`) are refused with `400 reserved_tag`;
        both deploy and preflight enforce this.

        **Deploy** (`dryRun` absent or false): picks a host, acquires the
        `(tenant, workload)` lease at `epoch+1`, stores the bundle, pushes
        the assignment to the host and answers `202` with
        `Location: /v1/deployments/{id}`. Poll it until `status` is `active`
        or `failed`.

        **Placement** (ADR-033; the answer's `placement` says why):
        1. Eligible hosts are live, in the tenant's pool, offer the
           workload's tier (`microvm` needs a host with KVM; `503 no_host`
           otherwise), and have free capacity.
        2. `host` pins one (it must still be eligible; a pinned host without
           the tier is `409 tier_unavailable`).
        3. Otherwise the current live lease holder is kept (placement is
           sticky; a better host appearing never moves a running workload).
           A holder without the tier the workload now asks for is
           `409 tier_unavailable` (or, with `replace`, the workload moves).
        4. Otherwise, with smart placement (the default when the workload
           declares `tailnet.connects` or `placement.targets`): the best
           measured path to the targets wins (direct > peer relay > DERP >
           unmeasured, then RTT; `placement.aggregate` "worst" (default) or
           "sum" over several targets). Hosts without a fresh measurement are
           asked to probe (≤ 2 s). Free capacity breaks ties, then host ID.

        `replace: true` (`tw deploy --replace`) re-places a running workload:
        it moves only if an eligible host is clearly better (a better path
        class, or ≥ 2 ms and ≥ 20 % lower RTT), and the lease moves to it at
        `epoch+1` in one conditional write. A stateful workload's move also
        needs `forceTakeover` (`409 move_unconfirmed`): its Durable Object
        storage stays on the old host.

        **Preflight** (`dryRun=true`): the same body and parser, but mgmt
        only checks the policy: every src tag must be in `tagOwners`, and
        each `tailnet.connects` entry that is a tag (or `*`) needs a grant
        with an `ip` part whose `src` matches every src tag. Names are
        reported `unchecked`. Nothing is written, no lease is taken, and the
        answer is `200 PreflightResult`. `503 policy_unavailable` when mgmt
        cannot read the policy (an OAuth client without `policy_file:read`);
        the CLI then prints `preflight skipped` and deploys.
      x-tw-role: admin|tenant:deploy
      x-tw-audit: true
      parameters:
        - name: dryRun
          in: query
          description: Preflight only; see the description.
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeploymentCreate" }
      responses:
        "200":
          description: "`dryRun=true`: the preflight report. Nothing was deployed."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreflightResult" }
        "202":
          description: Accepted; the host is starting the workload.
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deployment" }
        "400":
          description: Bad body or bundle.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                badBundle:
                  value:
                    code: bad_bundle
                    message: "tailworks.jsonc declares neither tailnet.tags nor tailnet.objects"
                    doc_url: https://github.com/rosskukulinski/tailworks/blob/master/docs/errors.md#bad_bundle
                    trace_id: 7f3a…
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Unknown tenant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: unknown_tenant
                message: tenant tn_nope not found
                doc_url: https://github.com/rosskukulinski/tailworks/blob/master/docs/errors.md#unknown_tenant
                trace_id: 7f3a…
        "503":
          description: No live host can take the workload, or the policy cannot be read (dryRun).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                noHost:
                  value:
                    code: no_host
                    message: no live host with tier process
                    doc_url: https://github.com/rosskukulinski/tailworks/blob/master/docs/errors.md#no_host
                    trace_id: 7f3a…
                policyUnavailable:
                  value:
                    code: policy_unavailable
                    message: "tenant tn_tail7906d5's OAuth client can't read the policy (it needs policy_file:read)"
                    doc_url: https://github.com/rosskukulinski/tailworks/blob/master/docs/errors.md#policy_unavailable
                    trace_id: 7f3a…
        default: { $ref: "#/components/responses/Error" }
    get:
      tags: [deployments]
      operationId: ListDeployments
      summary: List deployments
      x-tw-role: admin|tenant:read
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
        - name: tenant
          in: query
          schema: { type: string }
        - name: workload
          in: query
          schema: { type: string }
        - name: host
          in: query
          schema: { type: string }
        - name: latest
          in: query
          description: Only the newest deployment of each `(tenant, workload)` (what `tw ls` shows).
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: One page of deployments, ordered by `(createdAt, deploymentID)`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeploymentPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/Error" }

  /v1/deployments/{id}:
    parameters:
      - $ref: "#/components/parameters/deploymentID"
    get:
      tags: [deployments]
      operationId: GetDeployment
      summary: Read a deployment and its status
      x-tw-role: admin|host|tenant:read
      parameters:
        - $ref: "#/components/parameters/ifNoneMatch"
      responses:
        "200":
          description: The deployment, with the host-reported status and the entry node.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deployment" }
        "304": { $ref: "#/components/responses/NotModified" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [deployments]
      operationId: DeleteDeployment
      summary: Undeploy
      description: |
        Kills every object of the deployment (cascade; pushed to the host, then
        device deletes), releases the `(tenant, workload)` lease, marks the
        deployment `stopped` and audits it (`kind: undeploy`). The record stays
        readable (`status: stopped`) for history; a later deploy of the same
        workload supersedes it. Only the latest deployment of a workload can be
        undeployed (`409 superseded` otherwise).
      x-tw-role: admin|tenant:deploy
      x-tw-audit: true
      parameters:
        - $ref: "#/components/parameters/ifMatch"
        - name: reason
          in: query
          schema: { type: string, maxLength: 200 }
      responses:
        "202":
          description: Accepted; the kills are in flight.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KillResult" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        default: { $ref: "#/components/responses/Error" }

  /v1/deployments/{id}/bundle:
    parameters:
      - $ref: "#/components/parameters/deploymentID"
    get:
      tags: [deployments]
      operationId: GetDeploymentBundle
      summary: Download the raw bundle
      description: Hosts fetch the bundle named by `Assignment.bundleURL`. Only the lease holder (or an admin) may read it.
      x-tw-role: host|admin|tenant:read
      responses:
        "200":
          description: The bundle bytes (tar, optionally gzipped) exactly as uploaded.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/x-tar:
              schema: { type: string, format: binary }
            application/gzip:
              schema: { type: string, format: binary }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }

  # ---------------------------------------------------------------- objects
  /v1/objects:
    post:
      tags: [objects]
      operationId: CreateObject
      summary: Create an object (async mint)
      description: |
        hostd calls this on first `create()`/`spawn()`. The identity is
        `(tenant, workload, namespace = DO class, objectName)`; the object ID
        `<class-slug>-<b32(hmac)[:10]>` is also the node hostname.

        - Idempotent by identity: an existing live object is returned with
          `200`; a new one is `202` with `Location: /v1/objects/{id}` and
          `status: pending`. A killed identity is `410 killed`
          (`TombstoneError`); an ID collision with another identity is
          `409 identity_conflict`.
        - `namespace: "_workload"` is the workload entry node; `workload`
          must equal `objectName` (`400`). An unknown `(workload, class)` is
          `404 unknown_namespace`; without `workload`, several workloads
          declaring the class is `409 namespace_ambiguous`.
        - `parent` makes it a spawn: `caps ⊆ parent` (receiver merge
          semantics over the policy; `403 delegation_invalid` with
          `missing: {src, dst, cap, field}`), every child tag owned by the
          parent's (`tagOwners`), and the spawn budget (`maxLive`,
          `maxDepth`; `429 spawn_budget_exceeded`). A spawn with a `ttl` gets
          an ephemeral key.
        - The mint is queued behind the tenant throttle
          (`registrationsPerMinute`) and quota (`maxObjects`;
          `429 object_quota_exceeded`).
        - `namespace: "_pool"` creates a pre-joined pool node for the class in
          `objectName` (`<Class>/<suffix>`; ADR-031): minted, released and
          made ready like any object, but serving nothing until a create
          names it in `poolObjectID`. Then that create answers
          `status: assigned` and mints nothing.
        Spawn checks are unchanged from v0.
        - A host may create objects only in workloads whose `(tenant,
          workload)` lease it holds (`403 forbidden`).
      x-tw-role: host
      x-tw-audit: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ObjectCreate" }
            examples:
              entryNode:
                value: { tenantID: tn_tail7906d5, workload: agent, namespace: _workload, objectName: agent, actingFor: ross@example.com, traceID: 01J… }
              spawn:
                value:
                  tenantID: tn_tail7906d5
                  workload: agent
                  namespace: SubAgent
                  objectName: researcher-1
                  parent: { objectID: agent-k3j5m7p9qa }
                  caps: { "acme.com/cap/mcp": { tools: [search] } }
                  ttl: 10m
      responses:
        "200":
          description: The object already existed (idempotent create).
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Object" }
        "202":
          description: Accepted; the mint is queued.
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Object" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403":
          description: Delegation refused, or the host does not hold the namespace.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: delegation_invalid
                message: "caps[\"acme.com/cap/mcp\"].tools[1] is not granted to the parent"
                missing: { src: "tag:tw-wl-agent", dst: "tag:mcp", cap: "acme.com/cap/mcp", field: "caps[\"acme.com/cap/mcp\"].tools[1]" }
                doc_url: https://github.com/rosskukulinski/tailworks/blob/master/docs/errors.md#delegation_invalid
                trace_id: 7f3a…
        "404":
          description: Unknown tenant or namespace.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: unknown_namespace
                message: "workload agent declares no class Widget"
                doc_url: https://github.com/rosskukulinski/tailworks/blob/master/docs/errors.md#unknown_namespace
                trace_id: 7f3a…
        "409":
          description: "`identity_conflict` or `namespace_ambiguous`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: namespace_ambiguous
                message: "class Agent is declared by workloads agent and agent2; pass workload"
                doc_url: https://github.com/rosskukulinski/tailworks/blob/master/docs/errors.md#namespace_ambiguous
                trace_id: 7f3a…
        "410": { $ref: "#/components/responses/Gone" }
        "429":
          description: Spawn budget or tenant quota.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                spawnBudget:
                  value:
                    code: spawn_budget_exceeded
                    message: "root agent-k3j5m7p9qa already has 64 live descendants"
                    doc_url: https://github.com/rosskukulinski/tailworks/blob/master/docs/errors.md#spawn_budget_exceeded
                    trace_id: 7f3a…
                quota:
                  value:
                    code: object_quota_exceeded
                    message: "tenant tn_tail7906d5 has 1000 objects (maxObjects)"
                    doc_url: https://github.com/rosskukulinski/tailworks/blob/master/docs/errors.md#object_quota_exceeded
                    trace_id: 7f3a…
        default: { $ref: "#/components/responses/Error" }
    get:
      tags: [objects]
      operationId: ListObjects
      summary: List objects (with lineage)
      x-tw-role: admin|host|tenant:read
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
        - name: tenant
          in: query
          schema: { type: string }
        - name: workload
          in: query
          schema: { type: string }
        - name: namespace
          in: query
          description: DO class name, or `_workload`.
          schema: { type: string }
        - name: state
          in: query
          description: Repeatable. Default is every state, tombstones included.
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/ObjectStatus" }
        - name: parent
          in: query
          description: Direct children of this object ID.
          schema: { type: string }
        - name: root
          in: query
          description: The whole tree under this root object ID.
          schema: { type: string }
      responses:
        "200":
          description: One page of objects, ordered by `(createdAt, objectID)`. Hosts see only objects whose `(tenant, workload)` lease they hold; other objects are filtered out, never listed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObjectPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/Error" }

  /v1/objects/{id}:
    parameters:
      - $ref: "#/components/parameters/objectID"
    get:
      tags: [objects]
      operationId: GetObject
      summary: Read an object (lineage, children, kill record)
      description: A host may read only objects whose lease it holds (`403 forbidden` otherwise); peers verify other nodes through `GET /v1/certificates/{stableNodeID}` instead.
      x-tw-role: admin|host|tenant:read
      parameters:
        - $ref: "#/components/parameters/ifNoneMatch"
      responses:
        "200":
          description: The object.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Object" }
        "304": { $ref: "#/components/responses/NotModified" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/Gone" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [objects]
      operationId: UpdateObject
      summary: Update an object (JSON Merge Patch)
      description: |
        Two callers, two subsets:

        - **host** (lease holder): `{status: "ready", nodeID, stableNodeID,
          magicDNS, epoch}` reports the node joined. `epoch` is **required**
          for the ready group (`400 bad_request` without it) and the commit is
          always fenced on `(lease, caller host, epoch)` (`409 lease_lost`);
          a host that does not hold the object's lease is `403 forbidden`.
          mgmt then signs the **node certificate**
          (`{v, tenant, objectID, stableNodeID, tags, lim?, parent?, root,
          iat, exp}`, 24 h, the tenant's OBO root key) and stores it; the
          `ready` audit detail adds `cert: true` and `lim`. If the object was
          killed during the join the answer is `410 killed` and mgmt deletes
          the device that just appeared (only when the fence held: a caller
          without the lease cannot make mgmt delete devices). Replaces
          `POST /v0/objects/{id}/ready`.
        - **admin**: `{ttl}` sets or clears (`null`) the TTL; the reaper
          applies it.

        Any other field, or a host sending admin fields (and vice versa), is
        `400 immutable_field`.
      x-tw-role: host|admin|tenant:kill
      x-tw-audit: true
      parameters:
        - $ref: "#/components/parameters/ifMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: "#/components/schemas/ObjectPatch" }
            examples:
              ready:
                value: { status: ready, nodeID: "100.101.102.103", stableNodeID: nQ1k…, magicDNS: agent-k3j5m7p9qa.tail7906d5.ts.net, epoch: 3 }
              ttl:
                value: { ttl: 600 }
          application/json:
            schema: { $ref: "#/components/schemas/ObjectPatch" }
      responses:
        "200":
          description: "The updated object (`status: ready` carries `cert`)."
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Object" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ReadyConflict" }
        "410": { $ref: "#/components/responses/Gone" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [objects]
      operationId: DeleteObject
      summary: Kill an object
      description: |
        Marks the object (and with `cascade=true` every descendant) killed,
        pushes the kill to the lease-holding host (tier 1, ≤ 2 s per push;
        the heartbeat's `revokeObjects` is the fallback), then deletes the
        device(s) through the tenant credential (tier 2; deferred by
        `-device-delete-delay` so the host's tombstone answers
        `410 object_killed` while peers still have the node). Audited
        (`kind: kill`, `detail.by`, `pushed`, `deviceDeleteIn`).

        Hosts may kill only objects in namespaces they hold (`403`).
        A later `GET` is `410 Gone` with the kill record. Replaces
        `POST /v0/objects/{id}/kill`.
      x-tw-role: admin|host|tenant:kill
      x-tw-audit: true
      parameters:
        - $ref: "#/components/parameters/ifMatch"
        - name: cascade
          in: query
          description: Also kill the subtree below this object.
          schema: { type: boolean, default: false }
        - name: reason
          in: query
          schema: { type: string, maxLength: 200 }
      responses:
        "202":
          description: Accepted; tier 1 is done or pushed, device deletes are scheduled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KillResult" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/Gone" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        default: { $ref: "#/components/responses/Error" }

  /v1/objects/{id}/credentials:
    parameters:
      - $ref: "#/components/parameters/objectID"
    post:
      tags: [objects, credentials]
      operationId: CreateObjectCredential
      summary: Mint a single-use auth key for the object's node
      description: |
        Creates one single-use, tagged auth key (≤ 5 min) and releases it
        **only** to the host that holds the namespace lease at `epoch`
        (`409 lease_lost` otherwise). Long-polls a pending mint for `wait`
        seconds (default 10, max 30; `503 identity_pending` + `Retry-After: 1`
        after that). An expired unused key is revoked and re-minted
        automatically. `Cache-Control: no-store`.

        `reason=rejoin_rejected` is the **re-mint**: the saved node state was
        rejected by control, so mgmt deletes the old device, clears the node
        certificate and mints again under the same hostname. Replaces
        `GET /v0/objects/{id}/credential` and `POST …/remint`. Audited
        (`kind: mint` / `remint`). The key is never logged.
      x-tw-role: host
      x-tw-audit: true
      parameters:
        - $ref: "#/components/parameters/epoch"
        - name: wait
          in: query
          description: Seconds to wait for a pending mint.
          schema: { type: integer, minimum: 0, maximum: 30, default: 10 }
        - name: reason
          in: query
          description: "`rejoin_rejected` requests a re-mint; omitted for a first join."
          schema: { type: string, enum: [rejoin_rejected] }
      responses:
        "201":
          description: The key. Single use; it expires at `expiresAt`.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Credential" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`lease_lost` (wrong epoch or holder) or `already_joined` (the node exists; rejoin from saved state, or re-mint with `reason`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                leaseLost:
                  value:
                    code: lease_lost
                    message: "the caller does not hold the namespace lease at this epoch (want 4, have 3)"
                    doc_url: https://github.com/rosskukulinski/tailworks/blob/master/docs/errors.md#lease_lost
                    trace_id: 7f3a…
                alreadyJoined:
                  value:
                    code: already_joined
                    message: "agent-k3j5m7p9qa already has node nQ1k…; rejoin from saved state or pass ?reason=rejoin_rejected"
                    doc_url: https://github.com/rosskukulinski/tailworks/blob/master/docs/errors.md#already_joined
                    trace_id: 7f3a…
        "410": { $ref: "#/components/responses/Gone" }
        "502":
          description: The control plane refused the mint (`bootstrap_failed`); the object is `failed`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: bootstrap_failed
                message: "mint via OAuth client failed: 403 tag:tw-wl-agent not owned by tag:tw"
                doc_url: https://github.com/rosskukulinski/tailworks/blob/master/docs/errors.md#bootstrap_failed
                trace_id: 7f3a…
        "503":
          description: Still minting (`identity_pending`).
          headers:
            Retry-After:
              schema: { type: integer, const: 1 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: identity_pending
                message: "agent-k3j5m7p9qa is queued behind the tenant throttle"
                doc_url: https://github.com/rosskukulinski/tailworks/blob/master/docs/errors.md#identity_pending
                trace_id: 7f3a…
        default: { $ref: "#/components/responses/Error" }

  /v1/objects/{id}/certificate:
    parameters:
      - $ref: "#/components/parameters/objectID"
    get:
      tags: [objects, credentials]
      operationId: GetObjectCertificate
      summary: Read the object's node certificate
      description: |
        The certificate mgmt signed at `ready` (re-issued on fetch when missing
        or within 1 h of expiry). The receiving netd verifies it against the
        tenant's `oboPublicKey` and narrows the caller's caps to `cert.lim`;
        a certificate that fails verification, names another node or cannot
        be fetched makes netd withhold the caller's caps. `410 killed` for
        tombstones. Replaces `GET /v0/certs/{nodeID}`; see also
        `GET /v1/certificates/{stableNodeID}` for lookup by node.
      x-tw-role: host|admin
      responses:
        "200":
          description: The certificate.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeCertificate" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The object has no node yet (`not_ready`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410": { $ref: "#/components/responses/Gone" }
        default: { $ref: "#/components/responses/Error" }

  /v1/certificates/{stableNodeID}:
    get:
      tags: [credentials]
      operationId: GetCertificate
      summary: Look up a node certificate by stable node ID
      description: |
        The receiver-side lookup: "is the peer that just connected a tailworks
        object, and what is its `lim`?" `404 not_found` when no live object
        of the tenant has that node (the receiver then applies the WhoIs caps
        unchanged: the peer is not a tailworks object); `410 killed` for a tombstone.
      x-tw-role: host|admin
      parameters:
        - name: stableNodeID
          in: path
          required: true
          schema: { type: string }
        - name: tenant
          in: query
          required: true
          description: The receiving object's tenant (certificates are per tenant).
          schema: { type: string }
      responses:
        "200":
          description: The certificate.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeCertificate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/Gone" }
        default: { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------------ audit
  /v1/audit:
    post:
      tags: [audit]
      operationId: AppendAudit
      summary: Append a batch of host audit records
      description: |
        Append-only. Each host has its own chain `host:<hostID>`; every
        record carries `prevHash`, `hash` and `hostSig`
        (`hash = hex(sha256(canonical body without hash/hostSig))`,
        `hostSig = base64(ed25519.Sign(hostKey, utf8(hash)))`, verified
        against the registered `auditPubKey`). `kind` and `hash` are required
        on every record. Provenance (RT-02): `source: tenant` is allowed only
        with `kind: tenant_note` and vice versa; `source: mgmt` is refused;
        a missing source means `host`. The store refuses UPDATE/DELETE on
        audit rows. Mutating by nature; it *is* the audit.
      x-tw-role: host
      x-tw-audit: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuditBatch" }
      responses:
        "201":
          description: Appended; the chain status after the append.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditAppendResult" }
        "400":
          description: A record is malformed, breaks the chain, or claims a forbidden source.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: bad_request
                message: "record 3: source \"tenant\" requires kind tenant_note"
                doc_url: https://github.com/rosskukulinski/tailworks/blob/master/docs/errors.md#bad_request
                trace_id: 7f3a…
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/Error" }
    get:
      tags: [audit]
      operationId: ListAudit
      summary: Query audit records
      x-tw-role: admin|tenant:read
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
        - name: object
          in: query
          description: Records about this object ID.
          schema: { type: string }
        - name: human
          in: query
          description: Records whose `actingFor` is this principal (the human at the head of a chain).
          schema: { type: string }
        - name: trace
          in: query
          schema: { type: string }
        - name: tenant
          in: query
          schema: { type: string }
        - name: chain
          in: query
          description: "`mgmt` or `host:<hostID>`."
          schema: { type: string }
        - name: kind
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/AuditKind" }
        - name: since
          in: query
          description: Records at or after this time (RFC 3339 or unix ms).
          schema: { type: string }
        - name: until
          in: query
          schema: { type: string }
        - name: order
          in: query
          description: |
            `asc` (default): oldest first. `desc`: newest first, as the admin
            UI shows activity. A cursor continues in the order of the page
            that returned it, so repeat `order` with the cursor.
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
      responses:
        "200":
          description: One page, ordered by `(ts, chain, seq)` (reversed with `order=desc`), with per-chain verification of the records returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/Error" }

  /v1/audit/verification:
    get:
      tags: [audit]
      operationId: GetAuditVerification
      summary: Verify every audit chain
      description: Recomputes every hash and link of every chain and checks each chain head; detects modified, removed, reordered and truncated records.
      x-tw-role: admin
      responses:
        "200":
          description: The verification report (`ok` is the AND over chains).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditVerification" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/Error" }

  # ---------------------------------------------------------------- volumes
  /v1/volumes/{id}/keys:
    parameters:
      - $ref: "#/components/parameters/volumeID"
    post:
      tags: [volumes, credentials]
      operationId: CreateVolumeKeyGrant
      summary: Release a volume's dm-crypt data key to the lease holder
      description: |
        Creates a key grant: the 256-bit data key of the `(tenant, workload)`
        DO volume (custody name `tw/<tenant>/volumes/<workload>/dek`,
        created on first use) is released only to the host holding the
        workload's lease at `epoch` (`409 lease_lost`). Audited
        (`kind: volume_key`). `Cache-Control: no-store`. The key is never
        logged. Replaces `GET /v0/volumes/key`.
      x-tw-role: host
      x-tw-audit: true
      parameters:
        - $ref: "#/components/parameters/epoch"
      responses:
        "201":
          description: The grant.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VolumeKeyGrant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/LeaseLost" }
        default: { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------- containers
  /v1/container-reservations:
    post:
      tags: [containers]
      operationId: CreateContainerReservation
      summary: Reserve quota for a container before it starts
      description: |
        hostd calls this synchronously at `ctx.container.start()`, after its
        own capacity check (`503 capacity_exhausted` is hostd's, never
        mgmt's) and before it boots the container's VM. Only the host holding
        the workload's lease at `epoch` may reserve (`409 lease_lost`).

        The key is `(tenantID, workload, class, object)`: one container per
        DO instance (ADR-032 D2). Reserving a key that already holds a
        reservation is **idempotent** (`200`, the same `reservationID`; a
        larger container re-checks the quota for the difference), so a
        restart never needs new headroom, and a host that took the workload
        over adopts the key. A new key is checked atomically, in the store,
        against the tenant's `maxContainers` (running), `maxContainerMemMiB`
        and `maxContainerVCPU`, and the class's `max_instances` from the
        deployment: over any of them is `429 container_quota_exceeded`
        (`missing: {quota, limit, used, requested}`). Containers are not
        objects: they count against neither `maxObjects` nor a host's
        `capacityNodes`.

        hostd **fails closed** when mgmt is unreachable: no reservation, no
        start, except a restart of a container whose reservation it already
        holds. Released by `DELETE` on stop; a reservation that no heartbeat
        reports (`HostStatus.containers`) for 30 s after its creation is
        released by mgmt, and one whose host stopped reporting it for 2 min no
        longer counts, both on the store clock. Audited
        (`kind: container_reserve`).
      x-tw-role: host
      x-tw-audit: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContainerReservationCreate" }
            example:
              tenantID: tn_tail7906d5
              workload: agent
              class: Sandbox
              object: my-sandbox
              epoch: 3
              resources: { vcpu: 0.0625, memMiB: 256, diskMiB: 2000 }
      responses:
        "201":
          description: Reserved.
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContainerReservation" }
        "200":
          description: The key already held a reservation (restart, or a takeover by the lease holder); it is returned, renewed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContainerReservation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Unknown tenant (`unknown_tenant`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409": { $ref: "#/components/responses/LeaseLost" }
        "429":
          description: Over a container quota (`container_quota_exceeded`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: container_quota_exceeded
                message: "tenant tn_tail7906d5 runs 10 containers (maxContainers 10)"
                missing: { quota: maxContainers, limit: 10, used: 10, requested: 1 }
                doc_url: https://github.com/rosskukulinski/tailworks/blob/master/docs/errors.md#container_quota_exceeded
                trace_id: 7f3a…
        default: { $ref: "#/components/responses/Error" }
    get:
      tags: [containers]
      operationId: ListContainerReservations
      summary: List container reservations
      description: Hosts see their own reservations only.
      x-tw-role: admin|host
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
        - name: tenant
          in: query
          schema: { type: string }
        - name: host
          in: query
          schema: { type: string }
      responses:
        "200":
          description: One page of reservations, ordered by `(createdAt, reservationID)`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContainerReservationPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/Error" }

  /v1/container-reservations/{id}:
    parameters:
      - $ref: "#/components/parameters/reservationID"
    delete:
      tags: [containers]
      operationId: DeleteContainerReservation
      summary: Release a container reservation (the container stopped)
      description: |
        Only the holding host (or an admin) may release it (`403 forbidden`).
        Idempotent from the host's side: `404` means it is already gone.
        Audited (`kind: container_release`).
      x-tw-role: host|admin
      x-tw-audit: true
      responses:
        "204":
          description: Released.
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------- images
  /v1/images/public:
    get:
      tags: [images]
      operationId: ListPublicImages
      summary: List public base images
      description: |
        Operator-marked public bases (ADR-032 D3): images every tenant's deploy may pin without a
        per-tenant mirror, and every host caches once for all tenants (hostd's `public` cache
        scope). Everything else is cached per tenant, so a cache hit never tells one tenant which
        images another uses.
      x-tw-role: admin|host|tenant:read
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: One page of public images, ordered by `(createdAt, id)`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicImagePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [images]
      operationId: CreatePublicImage
      summary: Mark an image as a public base (mirrors it now)
      description: |
        `tw image public add <ref>`. An upstream ref (`docker.io/cloudflare/sandbox:0.12.14`) is
        mirrored now through mgmt's egress into `public/<registry>/<repository>` and pinned by digest
        for each arch (default: every linux amd64/arm64 image it has); a `tw.local/<name>` ref names
        an image already pushed to `public/<name>` (`tw image push`). Re-adding refreshes the
        digest; deployments already pinned keep theirs. Audited (`kind: image_public`).
      x-tw-role: admin
      x-tw-audit: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublicImageCreate" }
            example: { ref: "docker.io/cloudflare/sandbox:0.12.14", arches: [amd64] }
      responses:
        "201":
          description: Marked; one entry per arch.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicImageList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: This mgmt has no registry, or does not mirror (`registry_unavailable`, `mirror_disabled`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: The upstream image could not be mirrored (`image_unavailable`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/images/public/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Public image entry ID (`pi_…`).
        schema: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$" }
    delete:
      tags: [images]
      operationId: DeletePublicImage
      summary: Unmark a public base image
      description: "New deploys then mirror the ref into each tenant's namespace; pinned deployments keep pulling what they pinned. Audited (`kind: image_public`)."
      x-tw-role: admin
      x-tw-audit: true
      responses:
        "204":
          description: Unmarked.
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
  /v1/images/aliases:
    get:
      tags: [images]
      operationId: ListImageAliases
      summary: The image alias map
      description: |
        Upstream refs swapped for another image on one arch (ADR-032 D3: Cloudflare publishes
        `cloudflare/sandbox` for linux/amd64 only; arm64 hosts get tailworks' rebuild from the Apache-2.0
        source, in `public/`). Deploys apply it when pinning; `tw deploy` applies it as BuildKit named
        contexts when it builds a Dockerfile, so app source never changes.
      x-tw-role: admin|host|tenant:read
      responses:
        "200":
          description: The aliases.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageAliasList" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------ mcp (Model Context Protocol, external spec)
  /mcp:
    post:
      tags: [mcp]
      operationId: MCPRequest
      summary: One MCP JSON-RPC request (initialize, ping, tools/list, tools/call) or notification
      description: |
        The body is one JSON-RPC 2.0 message (no batches). A request is answered `200` with the
        JSON-RPC response; a notification (no `id`) with `202` and no body. A tool the caller isn't
        granted is a tool result with `isError: true` and the tailworks error `cap_missing`, whose
        `snippet` is the grant (or the `tw mcp --allow` flag) that adds it. `kill`, `undeploy` and
        `deploy` are audited like the `/v1` operations they run, with the caller as the actor.
      x-tw-role: admin|mcp
      x-tw-audit: true
      parameters:
        - name: Tw-MCP-Tools
          in: header
          description: Comma-separated tools this request may use (narrows; see the tag description).
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: "A JSON-RPC 2.0 request or notification." }
      responses:
        "200":
          description: The JSON-RPC response.
          content:
            application/json:
              schema: { type: object }
        "202": { description: A notification was accepted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    get:
      tags: [mcp]
      operationId: MCPStream
      summary: Not supported (stateless server; no server-to-client stream)
      x-tw-role: admin|mcp
      responses:
        "405": { description: Use POST. }

  # ------------------------------------------------------------ registry (OCI distribution, external spec)
  /v2/:
    get:
      tags: [registry]
      operationId: RegistryBase
      summary: OCI API version check
      description: "`200 {}` with `Docker-Distribution-API-Version: registry/2.0` (clients probe it before pushing or pulling). Authentication is WhoIs on the connection: there is no token challenge."
      x-tw-role: admin|host|tenant:read
      responses:
        "200": { description: The registry speaks the distribution API and admits the caller. }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v2/{name}/manifests/{reference}:
    parameters:
      - $ref: "#/components/parameters/repositoryName"
      - name: reference
        in: path
        required: true
        description: A tag or a `sha256:` digest.
        schema: { type: string }
    get:
      tags: [registry]
      operationId: RegistryGetManifest
      summary: Pull a manifest or index (by tag or digest)
      description: "`Content-Type` is the manifest's media type; `Docker-Content-Digest` its digest. `HEAD` answers the same headers without the body."
      x-tw-role: admin|host|tenant:read
      responses:
        "200": { description: "The manifest bytes, exactly as pushed." }
        "403": { description: "`DENIED`: a host pulling a tenant namespace it serves no deployment of." }
        "404": { description: "`MANIFEST_UNKNOWN`." }
    head:
      tags: [registry]
      operationId: RegistryHeadManifest
      summary: Check a manifest exists (and resolve a tag to its digest)
      x-tw-role: admin|host|tenant:read
      responses:
        "200": { description: Exists; `Docker-Content-Digest` names it. }
        "404": { description: "`MANIFEST_UNKNOWN`." }
    put:
      tags: [registry]
      operationId: RegistryPutManifest
      summary: Push a manifest or index (by tag or digest)
      description: |
        Image manifests (OCI and Docker v2 schema 2) and indexes (multi-arch). Every blob (config,
        layers) or child manifest it references must already be in **this** repository
        (`400 MANIFEST_BLOB_UNKNOWN`). A digest reference must match the body's digest. Audited
        (`kind: image_push`).
      x-tw-role: admin|tenant:deploy
      x-tw-audit: true
      responses:
        "201": { description: "Stored; `Location` and `Docker-Content-Digest` name it." }
        "400": { description: "`MANIFEST_INVALID`, `MANIFEST_BLOB_UNKNOWN`, `DIGEST_INVALID`, `TAG_INVALID`." }
        "403": { description: "`DENIED` (hosts never push)." }
  /v2/{name}/blobs/{digest}:
    parameters:
      - $ref: "#/components/parameters/repositoryName"
      - name: digest
        in: path
        required: true
        schema: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
    get:
      tags: [registry]
      operationId: RegistryGetBlob
      summary: Pull a blob (Range supported)
      x-tw-role: admin|host|tenant:read
      responses:
        "200": { description: The content; it hashes to `digest`. }
        "403": { description: "`DENIED`." }
        "404": { description: "`BLOB_UNKNOWN`: not in this repository (whether or not another namespace has it)." }
    head:
      tags: [registry]
      operationId: RegistryHeadBlob
      summary: Check a blob exists in this repository
      x-tw-role: admin|host|tenant:read
      responses:
        "200": { description: Exists; `Content-Length` is its size. }
        "404": { description: "`BLOB_UNKNOWN`." }
  /v2/{name}/blobs/uploads/:
    parameters:
      - $ref: "#/components/parameters/repositoryName"
    post:
      tags: [registry]
      operationId: RegistryStartUpload
      summary: Start a blob upload (or a monolithic upload, or a mount)
      description: |
        `202` with `Location: /v2/{name}/blobs/uploads/{uuid}`. With `?digest=` and a body: a
        monolithic upload (`201`). With `?mount=<digest>&from=<repo>`: links the blob from `from`
        (`201`) only when `from` is in the same namespace and has it; otherwise a fresh upload
        (`202`), so another tenant's content is never borrowed. Upload sessions are files under
        mgmt's registry dir (any replica sharing it can continue one).
      x-tw-role: admin|tenant:deploy
      parameters:
        - { name: digest, in: query, schema: { type: string } }
        - { name: mount, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string } }
      responses:
        "201": { description: Monolithic upload or mount done. }
        "202": { description: "Upload started; `Location`, `Docker-Upload-UUID`, `Range: 0-0`." }
        "403": { description: "`DENIED`." }
  /v2/{name}/blobs/uploads/{uuid}:
    parameters:
      - $ref: "#/components/parameters/repositoryName"
      - name: uuid
        in: path
        required: true
        schema: { type: string, pattern: "^[a-f0-9]{32}$" }
    get:
      tags: [registry]
      operationId: RegistryUploadStatus
      summary: Upload progress
      x-tw-role: admin|tenant:deploy
      responses:
        "204": { description: "`Range: 0-<last byte>`." }
        "404": { description: "`BLOB_UPLOAD_UNKNOWN` (also for another repository's session)." }
    patch:
      tags: [registry]
      operationId: RegistryUploadChunk
      summary: Upload a chunk
      description: "`Content-Range: <start>-<end>` is optional; when given, `start` must equal the bytes received so far (`416` otherwise)."
      x-tw-role: admin|tenant:deploy
      responses:
        "202": { description: "Accepted; `Range: 0-<last byte>`." }
        "416": { description: "`BLOB_UPLOAD_INVALID`: out-of-order chunk." }
    put:
      tags: [registry]
      operationId: RegistryFinishUpload
      summary: Finish an upload (`?digest=` required; optional final chunk as the body)
      description: The whole upload must hash to `digest` (`400 DIGEST_INVALID`, and nothing is linked).
      x-tw-role: admin|tenant:deploy
      parameters:
        - { name: digest, in: query, required: true, schema: { type: string, pattern: "^sha256:[a-f0-9]{64}$" } }
      responses:
        "201": { description: "Stored and linked into the repository; `Location`, `Docker-Content-Digest`." }
        "400": { description: "`DIGEST_INVALID`." }
    delete:
      tags: [registry]
      operationId: RegistryCancelUpload
      summary: Cancel an upload
      x-tw-role: admin|tenant:deploy
      responses:
        "204": { description: Cancelled. }
  /v2/{name}/tags/list:
    parameters:
      - $ref: "#/components/parameters/repositoryName"
    get:
      tags: [registry]
      operationId: RegistryListTags
      summary: List a repository's tags (`?n=` / `?last=` paging)
      x-tw-role: admin|host|tenant:read
      parameters:
        - { name: n, in: query, schema: { type: integer, minimum: 0 } }
        - { name: last, in: query, schema: { type: string } }
      responses:
        "200": { description: "`{name, tags}`." }

  # ------------------------------------------------------------ operational
  /v1/healthz:
    get:
      tags: [operational]
      operationId: GetHealthz
      summary: Liveness
      description: Any authenticated principal (hosts included). On the local-dev socket the host token is still required (fail closed).
      x-tw-role: any
      responses:
        "200":
          description: Alive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/Error" }

  /v1/releases:
    get:
      tags: [upgrades]
      operationId: ListReleases
      summary: The release catalog
      description: |
        Every release this tw-mgmt knows: the ones built into it (its own and every earlier
        release) and imported ones (`POST /v1/releases`), ascending by version, with each one's
        notes, contract migrations, protocols and workerd pin. `current` is this replica's version.
      x-tw-role: admin
      responses:
        "200":
          description: The catalog.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReleaseCatalog" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [upgrades]
      operationId: ImportReleases
      summary: Import catalog entries (from a release's share/tailworks/catalog.json)
      description: |
        Adds or replaces imported entries. Entries built into this tw-mgmt are never replaced.
        `tw release import <tarball>` reads the tarball's `share/tailworks/catalog.json`, posts it here,
        then uploads the tarball (`PUT /v1/releases/{version}/artifacts/{name}`). Audited
        `release_import`.
      x-tw-role: admin
      x-tw-audit: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReleaseImport" }
      responses:
        "200":
          description: The catalog after the import.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReleaseCatalog" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/Error" }

  /v1/releases/{version}/artifacts/{name}:
    parameters:
      - name: version
        in: path
        required: true
        schema: { type: string, pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$" }
      - name: name
        in: path
        required: true
        description: "`tailworks-<version>-<os>-<arch>.tar.gz` or `SHA256SUMS`."
        schema: { type: string, pattern: "^(SHA256SUMS|tailworks-[0-9]+\\.[0-9]+\\.[0-9]+-(darwin|linux)-(amd64|arm64)\\.tar\\.gz)$" }
    put:
      tags: [upgrades]
      operationId: PutReleaseArtifact
      summary: Upload a release tarball (or its SHA256SUMS)
      description: |
        Upload `SHA256SUMS` first: a tarball is accepted only if its SHA-256 matches its line there.
        Stored in tw-mgmt's release directory (`-release-dir`, default `<state-dir>/releases`);
        replicas that don't share that directory each need the upload. Audited `release_artifact`.
      x-tw-role: admin
      x-tw-audit: true
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReleaseArtifact" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/Error" }
    get:
      tags: [upgrades]
      operationId: GetReleaseArtifact
      summary: Download a release tarball (hosts upgrading themselves)
      x-tw-role: admin|host
      responses:
        "200":
          description: The file.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }

  /v1/status:
    get:
      tags: [operational]
      operationId: GetStatus
      summary: mgmt status
      x-tw-role: admin
      responses:
        "200":
          description: Counters and the transport mgmt is serving on.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/Error" }

  /v1/upgrades:
    get:
      tags: [upgrades]
      operationId: ListUpgrades
      summary: Upgrade runs, newest first
      x-tw-role: admin
      responses:
        "200":
          description: The runs.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/UpgradeRun" } }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [upgrades]
      operationId: CreateUpgrade
      summary: Plan an upgrade, or start an upgrade run
      description: |
        Plans the upgrade to `to` from the release catalog and the fleet's reported versions and
        features. With `dryRun` the plan is returned and nothing is stored. Otherwise a durable
        upgrade run is created (`201`) and driven by whichever replica holds its lease: wait for
        every mgmt replica to report `to`, apply deferred contract migrations, then each host in
        turn (canary first, then a soak): cordon, drain what can move, push the upgrade to the host
        (it downloads its tarball from `GET /v1/releases/{version}/artifacts/{name}`, installs it
        and restarts), wait for it to re-register at `to` and settle, uncordon. A failed gate
        pauses the run. Only one run may be active (`409 exists`). Audited `upgrade_start`.
      x-tw-role: admin
      x-tw-audit: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpgradeRequest" }
      responses:
        "200":
          description: The plan (`dryRun`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpgradePlan" }
        "201":
          description: The run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpgradeRun" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/Error" }

  /v1/upgrades/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [upgrades]
      operationId: GetUpgrade
      summary: One upgrade run
      x-tw-role: admin
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpgradeRun" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }

  /v1/upgrades/{id}/actions:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [upgrades]
      operationId: ActOnUpgrade
      summary: Pause, resume or abort an upgrade run
      description: |
        `pause` stops before the next step; `resume` continues a paused run (after the operator
        fixed what paused it); `abort` ends it (hosts already upgraded stay upgraded; a cordoned
        host in progress is uncordoned). Audited `upgrade_pause`, `upgrade_resume`, `upgrade_abort`.
      x-tw-role: admin
      x-tw-audit: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [pause, resume, abort] }
              additionalProperties: false
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpgradeRun" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/Error" }

  /v1/whoami:
    get:
      tags: [operational]
      operationId: WhoAmI
      summary: Who the caller is, as mgmt sees it
      description: "`tw link` uses it to learn the endpoint and refuse non-admins early. Any authenticated principal, hosts included."
      x-tw-role: any
      responses:
        "200":
          description: The caller's principal and mgmt's self-description.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhoAmI" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/Error" }

  /v1/device-delete-runs:
    post:
      tags: [operational]
      operationId: CreateDeviceDeleteRun
      summary: Run the scheduled device deletes now
      description: |
        Kill tier 2 is deferred by `-device-delete-delay`; this creates a run
        that executes every pending delete immediately (what `tw down` does
        before stopping mgmt). Each delete is audited (`kind: device_delete`).
        Replaces `POST /v0/flush`.
      x-tw-role: admin
      x-tw-audit: true
      responses:
        "201":
          description: The run's outcome.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceDeleteRun" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/Error" }

# =========================================================================
components:
  securitySchemes:
    tailnetWhoIs:
      type: mutualTLS
      description: |
        **Not a token.** The caller's identity is the Tailscale node behind the
        connection, resolved by WhoIs on mgmt's tsnet listener. No header is
        sent. Roles: `host` = the peer carries `tag:tw-host` (bound to a
        hostID at registration); `admin` = the peer's WhoIs CapMap holds
        `github.com/rosskukulinski/tailworks/cap/admin` toward `tag:tw-mgmt`. `mutualTLS` is the closest
        OpenAPI scheme type (identity comes from the transport, not from a
        credential in the request); the actual mechanism is WireGuard node
        identity + WhoIs, and the `:80` listener is tailnet-only plaintext.
      x-tw-mechanism: tailscale-whois
    localHostToken:
      type: apiKey
      in: header
      name: Tw-Host-Token
      description: |
        `--local-dev` only (`tw dev`, hermetic tests): the unix socket
        `~/.tailworks/run/mgmt.sock` with the 256-bit token from
        `~/.tailworks/hostd/mgmt.token` (RT-03). Every request needs it, `/v1/healthz`
        included; a mgmt without a token answers `503 host_token_unconfigured`.
        The host names itself with `Tw-Host-ID`; admins may set `Tw-Actor`.
        Never used in normal operation; `tw doctor` flags it.

  parameters:
    limit:
      name: limit
      in: query
      description: Page size, 1–500 (default 50). Out-of-range values are `400 bad_request`.
      schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
    cursor:
      name: cursor
      in: query
      description: Opaque page cursor from the previous page's `nextCursor`. Filters must be repeated unchanged.
      schema: { type: string, maxLength: 512 }
    ifMatch:
      name: If-Match
      in: header
      description: Only apply if the resource's current `ETag` matches; otherwise `412 precondition_failed`.
      schema: { type: string }
    ifNoneMatch:
      name: If-None-Match
      in: header
      description: Answer `304` when the `ETag` still matches.
      schema: { type: string }
    epoch:
      name: epoch
      in: query
      required: true
      description: The namespace lease epoch the caller believes it holds. Fenced in the store (`409 lease_lost`).
      schema: { type: integer, format: int64, minimum: 1 }
    workloadName:
      name: workload
      in: path
      required: true
      description: Workload name (a DNS label).
      schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
    publicName:
      name: name
      in: path
      required: true
      description: A public name (the workload name of a public workload; a DNS label).
      schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
    secretName:
      name: name
      in: path
      required: true
      description: "Secret name: a JS identifier that is also an environment variable name; `TW_…` and `__TW…` are reserved."
      schema: { type: string, pattern: "^[A-Za-z_][A-Za-z0-9_]{0,127}$" }
    storeKind:
      name: kind
      in: path
      required: true
      description: The store kind (the binding type, e.g. `kv`).
      schema: { $ref: "#/components/schemas/StoreKind" }
    storeName:
      name: name
      in: path
      required: true
      description: "The store's name within the workload and kind: for KV, the binding's `id` (or the binding name when it has none)."
      schema: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$" }
    storeEpoch:
      name: epoch
      in: query
      description: "Hosts: the workload's lease epoch the caller holds (required; `409 lease_lost`). Admins leave it out."
      schema: { type: integer, format: int64, minimum: 1 }
    queueName:
      name: queue
      in: path
      required: true
      description: "The queue's name: lowercase letters, digits and dashes, at most 63 (Cloudflare's rule)."
      schema: { type: string, pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$" }
    queueWorkload:
      name: workload
      in: query
      description: "Hosts: the workload the call acts for (its producer binding or consumer). Admins leave it out."
      schema: { type: string, pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$" }
    queueEpoch:
      name: epoch
      in: query
      description: "Hosts: the workload's lease epoch the caller holds (required with `workload`; `409 lease_lost`)."
      schema: { type: integer, format: int64, minimum: 1 }
    tenantID:
      name: id
      in: path
      required: true
      description: Tenant ID (`tn_…` when generated; one safe path element).
      schema: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$" }
    hostID:
      name: id
      in: path
      required: true
      description: Host ID (one safe path element).
      schema: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,62}$" }
    deploymentID:
      name: id
      in: path
      required: true
      description: Deployment ID (`dp_…`).
      schema: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$" }
    objectID:
      name: id
      in: path
      required: true
      description: Object ID (`<class-slug>-<b32(hmac)[:10]>`, also the node hostname).
      schema: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$" }
    volumeID:
      name: id
      in: path
      required: true
      description: "Volume ID `<tenantID>:<workload>` (one volume per workload; `:` is a legal path character)."
      schema: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}:[a-z0-9][a-z0-9-]{0,62}$" }
      example: "tn_tail7906d5:agent"
    repositoryName:
      name: name
      in: path
      required: true
      description: "A repository: `<tenantID>/<path>` or `public/<path>` (OCI name grammar; may contain `/`)."
      schema: { type: string }
    reservationID:
      name: id
      in: path
      required: true
      description: Container reservation ID (`cr_…`).
      schema: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$" }

  headers:
    ETag:
      description: Strong validator of the representation; send it back in `If-Match` / `If-None-Match`.
      schema: { type: string }
    Location:
      description: URL of the created (or accepted) resource to poll.
      schema: { type: string, format: uri-reference }

  responses:
    Error:
      description: Unexpected error. The body is always the typed catalog shape; `Tw-Error` carries the code.
      headers:
        Tw-Error: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            code: internal
            message: "store: database is locked"
            doc_url: https://github.com/rosskukulinski/tailworks/blob/master/docs/errors.md#internal
            trace_id: 7f3a…
    BadRequest:
      description: Malformed request, body, filter or cursor.
      headers:
        Tw-Error: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            badRequest:
              value:
                code: bad_request
                message: "mintMode oauth needs oauthClientFile"
                doc_url: https://github.com/rosskukulinski/tailworks/blob/master/docs/errors.md#bad_request
                trace_id: 7f3a…
            badCursor:
              value:
                code: bad_cursor
                message: "cursor does not decode; start again without it"
                doc_url: https://github.com/rosskukulinski/tailworks/blob/master/docs/errors.md#bad_cursor
                trace_id: 7f3a…
            immutableField:
              value:
                code: immutable_field
                message: "tailnet cannot be changed; create a new tenant"
                missing: { field: tailnet }
                doc_url: https://github.com/rosskukulinski/tailworks/blob/master/docs/errors.md#immutable_field
                trace_id: 7f3a…
    Forbidden:
      description: The caller is authenticated but lacks the role, or a host acts outside its own records/namespaces.
      headers:
        Tw-Error: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            notAdmin:
              summary: A tailnet caller without the admin cap gets the exact grant to add.
              value:
                code: not_admin
                message: "ross@example.com is not a tailworks admin on this tailnet"
                missing: { src: "ross@example.com", dst: "tag:tw-mgmt", cap: "github.com/rosskukulinski/tailworks/cap/admin" }
                snippet: "{\"src\": [\"ross@example.com\"], \"dst\": [\"tag:tw-mgmt\"], \"ip\": [\"tcp:443\",\"tcp:80\"], \"app\": {\"github.com/rosskukulinski/tailworks/cap/admin\": [{}]}}"
                doc_url: https://github.com/rosskukulinski/tailworks/blob/master/docs/errors.md#not_admin
                trace_id: 7f3a…
            forbidden:
              value:
                code: forbidden
                message: "host h-7f2a does not hold tn_tail7906d5/agent"
                doc_url: https://github.com/rosskukulinski/tailworks/blob/master/docs/errors.md#forbidden
                trace_id: 7f3a…
            hostNotRegistered:
              value:
                code: host_not_registered
                message: "node nQ1k… (tag:tw-host) has not registered; PUT /v1/hosts/{id} first"
                doc_url: https://github.com/rosskukulinski/tailworks/blob/master/docs/errors.md#host_not_registered
                trace_id: 7f3a…
    Unauthorized:
      description: No identity on the connection (WhoIs failed), or the local-dev socket was used without `Tw-Host-Token`.
      headers:
        Tw-Error: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            noIdentity:
              value:
                code: no_identity
                message: "WhoIs failed for 100.64.0.9: no such peer"
                doc_url: https://github.com/rosskukulinski/tailworks/blob/master/docs/errors.md#no_identity
                trace_id: 7f3a…
            hostTokenRequired:
              value:
                code: host_token_required
                message: "Tw-Host-Token header required on the local-dev socket"
                doc_url: https://github.com/rosskukulinski/tailworks/blob/master/docs/errors.md#host_token_required
                trace_id: 7f3a…
    NotFound:
      description: No such resource (or none the caller may see).
      headers:
        Tw-Error: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            code: not_found
            message: "object agent-k3j5m7p9qa not found"
            doc_url: https://github.com/rosskukulinski/tailworks/blob/master/docs/errors.md#not_found
            trace_id: 7f3a…
    NotModified:
      description: The `If-None-Match` validator still matches. No body.
      headers:
        ETag: { $ref: "#/components/headers/ETag" }
    Conflict:
      description: The request conflicts with the resource's current state.
      headers:
        Tw-Error: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            exists:
              value:
                code: exists
                message: "tenant tn_tail7906d5 already exists"
                doc_url: https://github.com/rosskukulinski/tailworks/blob/master/docs/errors.md#exists
                trace_id: 7f3a…
            superseded:
              value:
                code: superseded
                message: "dep_01j… was superseded by dep_01k…; undeploy the latest deployment"
                doc_url: https://github.com/rosskukulinski/tailworks/blob/master/docs/errors.md#superseded
                trace_id: 7f3a…
    ReadyConflict:
      description: "`lease_lost` (the caller does not hold the namespace lease at this epoch) or `identity_conflict` (an `assigned` object reported ready on another node than the pool node it was given)."
      headers:
        Tw-Error: { schema: { type: string, enum: [lease_lost, identity_conflict] } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    LeaseLost:
      description: The caller does not hold the namespace lease at this epoch.
      headers:
        Tw-Error: { schema: { type: string, const: lease_lost } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            code: lease_lost
            message: "the caller does not hold the namespace lease at this epoch (want 4, have 3)"
            doc_url: https://github.com/rosskukulinski/tailworks/blob/master/docs/errors.md#lease_lost
            trace_id: 7f3a…
    StoreConflict:
      description: "`lease_lost`: the host does not hold the workload's lease at this epoch. `store_conflict`: the journal's head (or incarnation) is not the one the writer gave; catch up and retry."
      headers:
        Tw-Error: { schema: { type: string, enum: [lease_lost, store_conflict] } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Gone:
      description: The object was killed. The body is the typed error plus the kill record; it stays until purged.
      headers:
        Tw-Error: { schema: { type: string, const: killed } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/TombstoneError" }
          example:
            code: killed
            message: "agent-k3j5m7p9qa was killed (cascade from agent-root1234ab)"
            doc_url: https://github.com/rosskukulinski/tailworks/blob/master/docs/errors.md#killed
            trace_id: 7f3a…
            tombstone:
              objectID: agent-k3j5m7p9qa
              tenantID: tn_tail7906d5
              workload: agent
              namespace: SubAgent
              objectName: researcher-1
              killedAt: 1762633200000
              reason: operator kill
              by: ross@example.com
              cascade: true
              root: agent-root1234ab
              deviceDeleted: true
    PreconditionFailed:
      description: "`If-Match` did not match the current `ETag`."
      headers:
        Tw-Error: { schema: { type: string, const: precondition_failed } }
        ETag: { $ref: "#/components/headers/ETag" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            code: precondition_failed
            message: "If-Match \"3f9a…\" does not match the current ETag \"8c21…\""
            doc_url: https://github.com/rosskukulinski/tailworks/blob/master/docs/errors.md#precondition_failed
            trace_id: 7f3a…

  schemas:
    # ------------------------------------------------------------ errors
    Error:
      type: object
      description: |
        The typed error catalog (docs/errors.md) shape. `code` is stable and machine-readable;
        `missing` names what is absent (grant, cap, field, quota); `snippet`
        is policy HuJSON to paste when a grant is missing; `doc_url` is
        `https://github.com/rosskukulinski/tailworks/blob/master/docs/errors.md#<code>` (the
        code's heading in the typed error catalog); `trace_id` correlates with audit.
      required: [code, message, doc_url, trace_id]
      properties:
        code: { $ref: "#/components/schemas/ErrorCode" }
        message: { type: string }
        missing:
          type: object
          additionalProperties: true
          description: What is missing. Shape depends on `code` (e.g. `{src, dst, cap, field}` for `delegation_invalid`).
        snippet:
          type: string
          description: Policy HuJSON to add (a grant or tagOwners entry).
        doc_url: { type: string, format: uri }
        trace_id: { type: string }
    ErrorCode:
      type: string
      description: |
        The catalog. Status in parentheses.

        | code | status | when |
        |---|---|---|
        | `bad_request` | 400 | malformed body, parameter or filter |
        | `bad_cursor` | 400 | `cursor` does not decode |
        | `bad_bundle` | 400 | bundle has no `tailworks.jsonc`, neither `tailnet.tags` nor `tailnet.objects`, or invalid `triggers.crons` |
        | `reserved_tag` | 400 | a bundle or namespace asks for one of tailworks' own tags (`tag:tw`, `tag:tw-mgmt`, `tag:tw-host`) |
        | `immutable_field` | 400 | PATCH touches a field the caller may not change |
        | `mint_mode_removed` | 400 | a create or PATCH names the removed `apikey` or `wif` mint mode, or a tenant stored in one tries to mint (switch it to `oauth`) |
        | `too_many_secrets` | 400 | a workload already has 128 secrets |
        | `d1_error` | 400 | a D1 statement failed (SQLite's message, or a D1 limit); nothing of its batch was applied |
        | `no_identity` | 401 | WhoIs failed for the connection |
        | `host_token_required` | 401 | local-dev socket without `Tw-Host-Token` |
        | `host_token_invalid` | 403 | local-dev socket, wrong token |
        | `not_admin` | 403 | tailnet caller without `github.com/rosskukulinski/tailworks/cap/admin` (`snippet` given) |
        | `tag_not_owned` | 400 | a tenant with its own owner tag asks for a tag its owner tag doesn't own, or that another tenant's on the tailnet owns (`snippet` given) |
        | `shared_owner_tag` | 409 | a second tenant on a tailnet where either tenant uses `tag:tw`, or both the same owner tag |
        | `name_prefix_required` | 409 | a second tenant on a tailnet without a distinct `namePrefix` |
        | `tenant_forbidden` | 403 | a tenant admin's `github.com/rosskukulinski/tailworks/cap/tenant-admin` grants don't name the tenant with the action, or the route is admin-only (`snippet` given) |
        | `cap_missing` | 403 | an approval the caller's `github.com/rosskukulinski/tailworks/cap/approve` grants do not cover (`snippet` given) |
        | `forbidden` | 403 | role ok, but outside the caller's records / namespaces |
        | `host_not_registered` | 403 | `tag:tw-host` node that never did `PUT /v1/hosts/{id}`, or a `PUT` for a host ID the admin never created |
        | `host_identity_mismatch` | 403 | host ID bound to another node; `registrationSecret` missing or wrong; `auditPubKey` differs from the pinned one |
        | `delegation_invalid` | 403 | child tag not owned by the parent's, parent unknown (404) or dead (410) |
        | `delegation_exceeds_parent` | 403 | spawn caps ⊄ parent (`missing: {src, dst, cap, field}`) |
        | `policy_missing_tag_owners` | 403 | the control plane refused to mint a key for tailworks' own tags (`snippet` gives the tagOwners to add) |
        | `not_found` | 404 | — |
        | `unknown_tenant` | 404 | — |
        | `unknown_namespace` | 404 | `(workload, class)` not declared |
        | `no_logs` | 404 | the workload's host has no log file for it yet |
        | `unknown_secret` | 404 | the workload has no secret of that name |
        | `unknown_store` | 404 | the workload has no store of that kind and name |
        | `unknown_queue` | 404 | the tenant has no queue of that name |
        | `exists` | 409 | create of an existing ID |
        | `lease_lost` | 409 | epoch/holder fence failed |
        | `lease_held` | 409 | another host holds the lease |
        | `store_conflict` | 409 | a store journal append's `after` (or `incarnation`) is not the journal's head: catch up and retry |
        | `store_degraded` | 409 | the store object on the workload's host could not apply a journal entry: it stopped its replay there, serves reads from what it applied and refuses writes (`tw d1 export`, then recreate the database) |
        | `store_limit` | 400 | a store append exceeds an entry, append or store size limit |
        | `queue_limit` | 400 | a send exceeds a message, batch, delay or queue size limit |
        | `store_unavailable` | 503 | the store is unreachable, restarting or contended (a row-lock or idle-transaction timeout); retry after `Retry-After` |
        | `tier_unavailable` | 409 | the chosen host (`--host`, or the workload's current host) does not offer the deployment's tier, or `containers` (for the image's `arch`) when the bundle declares containers |
        | `replica_conflict` | 409 | a deploy names a replica (`<workload>--r<n>`) instead of its workload, or a replica name is taken by a separate workload |
        | `preview_conflict` | 409 | a preview's name (`<workload>--preview-<alias>`) is taken by a workload that is not a preview of this one |
        | `preview_failed` | 409 | promote of a preview its host reported `failed` |
        | `preview_unsupported` | 400 | `preview` for a bundle with queue bindings (queues are tenant-wide), or of a workload that is itself a preview or replica |
        | `unknown_preview` | 404 | promote of a preview that doesn't exist or is stopped |
        | `service_conflict` | 409 | `tailnet.service` names a Service that exists and isn't managed by tailworks for this tenant and workload |
        | `service_api_failed` | 502 | mgmt can't read or create the Service definition (an OAuth client needs Services › Write) |
        | `profile_unsupported` | 400 | the tenant's control-plane profile can't serve the request: on the Headscale profile (ADR-015), `tailnet.service` (no Tailscale Services), public routes or `publicIngress: allow` (no Funnel) |
        | `public_name_owned` | 409 | a deploy declares public routes under a workload name another tenant on the same tailnet owns as its public name (red-team H10) |
        | `public_name_in_use` | 409 | release of a public name the workload still serves: its latest deployment declares public routes, or its public node is live |
        | `move_unconfirmed` | 409 | `replace` would move a stateful workload off its live host, leaving its DO storage behind; confirm with `forceTakeover` |
        | `lease_changed` | 409 | the workload's lease changed while `replace` was moving it (a concurrent deploy); retry |
        | `takeover_unconfirmed` | 409 | the workload has Durable Objects and its host stopped heartbeating but is still registered: it may still be serving them. `tw host rm <host> --drain`, or redeploy with `--force-takeover` |
        | `already_joined` | 409 | credential for an object that has a node |
        | `identity_conflict` | 409 | object ID collision across identities |
        | `namespace_ambiguous` | 409 | class declared by several workloads, `workload` missing |
        | `not_ready` | 409 | certificate requested before `ready` |
        | `superseded` | 409 | undeploy of a non-latest deployment |
        | `tenant_has_live_objects` | 409 | tenant delete without `force` |
        | `host_holds_leases` | 409 | host delete without `drain` |
        | `version_skew` | 409 | a host (or CLI, or mgmt replica) outside the version window: a host newer than mgmt, or more than one release line behind it; or a store a newer tw-mgmt contracted (ADR-041 §7) |
        | `upgrade_blocked` | 409 | an upgrade run can't start: its plan has blockers (`message` lists them; `POST /v1/upgrades` with `dryRun` shows the plan) |
        | `upgrade_state` | 409 | pause, resume or abort of a run that isn't running (pause), paused (resume), or active (abort) |
        | `feature_unavailable` | 409 | the deployment needs a host feature (`kv`, `r2`, `d1`, …) that no eligible host, or the workload's current host, advertises: upgrade the hosts |
        | `killed` | 410 | tombstone (`TombstoneError`) |
        | `precondition_failed` | 412 | `If-Match` mismatch |
        | `misdirected_request` | 421 | a tailnet request whose `Host` is not one of mgmt's own names or an IP literal (DNS-rebinding guard) |
        | `object_quota_exceeded` | 429 | tenant `maxObjects` |
        | `spawn_budget_exceeded` | 429 | `maxLive` / `maxDepth` |
        | `container_quota_exceeded` | 429 | tenant `maxContainers` / `maxContainerMemMiB` / `maxContainerVCPU`, or the class's `max_instances` (`missing: {quota, limit, used, requested}`) |
        | `image_unavailable` | 502 | a container image could not be pinned at deploy (not in tailworks' registry, no image for any of the pool's arches, or the upstream mirror failed) |
        | `registry_unavailable` | 409 | this tw-mgmt serves no OCI registry (`-registry-dir off`) |
        | `mirror_disabled` | 409 | this tw-mgmt does not mirror external images (`-no-mirror`) |
        | `bootstrap_failed` | 502 | control plane refused the mint |
        | `host_unavailable` | 502 | the host holding the workload's lease did not answer mgmt (logs, approvals) |
        | `host_token_unconfigured` | 503 | local-dev mgmt without a token (fail closed) |
        | `identity_pending` | 503 | mint still queued (`Retry-After: 1`) |
        | `no_host` | 503 | no live host for the deployment (in the tenant's pool, offering its tier, and `containers` for the image's `arch` when it declares containers, with a free node and, for the microVM tier or containers, a free VM in its capacity vector) |
        | `policy_unavailable` | 503 | mgmt cannot read the tenant policy |
        | `approval_not_pending` | 409 | no approval of that Workflow instance is waiting (decided, timed out, or never asked) |
        | `internal` | 500 | — |
      enum:
        - bad_request
        - bad_cursor
        - bad_bundle
        - reserved_tag
        - immutable_field
        - mint_mode_removed
        - too_many_secrets
        - d1_error
