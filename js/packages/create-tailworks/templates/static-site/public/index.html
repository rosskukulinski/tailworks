<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>static-site on tailworks</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <h1>Hello from a static site</h1>
    <p id="greeting">Asking the Worker who you are…</p>
    <p>
      This page, <code>style.css</code> and <code>app.js</code> are files in
      <code>public/</code>. The greeting comes from the Worker
      (<code>GET /api/whoami</code>), which knows your tailnet identity.
    </p>
    <ul>
      <li><a href="/team/">/team/</a>: files only people (not tagged nodes) may read</li>
      <li><a href="/missing">/missing</a>: no such file, so <code>404.html</code></li>
    </ul>
  </main>
  <script src="/app.js" type="module"></script>
</body>
</html>
