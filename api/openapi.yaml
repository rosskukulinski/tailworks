    Approver:
      type: object
      description: The verified tailnet identity that decided an approval (WireGuard, never the request body).
      required: [node, nodeId, tags, via]
      properties:
        user: { type: string, description: "Login (untagged nodes)." }
        node: { type: string, description: MagicDNS name. }
        nodeId: { type: string, description: Stable node ID. }
        tags: { type: array, items: { type: string } }
        via:
          type: string
          enum: [tailnet, mgmt]
          description: "`tailnet`: sent to the workload's (or object's) own node; `mgmt`: `tw approve` or the admin UI."
    Approval:
      type: object
      description: One approval wait of one Workflow instance, as the host running it records it.
      required: [tenantID, workload, workflow, instance, step, type, status, requestedAt]
      properties:
        tenantID: { type: string }
        workload: { type: string }
        workflow: { type: string }
        instance: { type: string }
        step: { type: string, description: "The `waitForEvent` step name (`wait-for-approval` for `waitForApproval`)." }
        type: { type: string, description: "The event type waited for: `approval` or `approval-*`." }
        timeout: { type: string, description: The wait's timeout as the Workflow gave it. }
        facts:
          type: object
          additionalProperties: { type: number, format: double }
          description: The instance's numeric params, which grant `limits` are checked against.
        status:
          type: string
          enum: [pending, approved, rejected, timeout]
        requestedAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time }
        approver: { $ref: "#/components/schemas/Approver" }
        comment: { type: string }
        host: { type: string, description: The host that runs the instance (set by mgmt). }
    ApprovalList:
      type: object
      required: [approvals]
      properties:
        approvals:
          type: array
          items: { $ref: "#/components/schemas/Approval" }
        unreachable:
          type: array
          items: { type: string }
          description: Hosts that did not answer (their approvals are missing).
    ApprovalDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, reject]
        comment: { type: string, maxLength: 1024, description: "Shown to the Workflow (`comment`; a rejection's `reason`) and audited." }
        step: { type: string, description: "Which wait, when the instance waits for several." }
        metadata:
          type: object
          additionalProperties: true
          description: "Extra fields for the Workflow (`waitForApproval` returns them). An `approver` key is replaced by tailworks'."
    ApprovalDecisionResponse:
      type: object
      required: [approval]
      properties:
        approval: { $ref: "#/components/schemas/Approval" }
    NotificationEventKind:
      type: string
      description: |
        `approval_requested` (a Workflow instance started waiting for an approval),
        `test` (`tw notify test`; never subscribed to).
      enum:
        - approval_requested
        - test
    WebhookView:
      type: object
      description: A tenant's notification webhook, without its secrets.
      required: [origin, headerNames, events]
      properties:
        origin: { type: string, description: "The URL's scheme and host (`https://hooks.slack.com`); its path and query are never returned." }
        headerNames: { type: array, items: { type: string } }
        events: { type: array, items: { $ref: "#/components/schemas/NotificationEventKind" } }
    NotificationConfig:
      type: object
      required: [tenantID]
      properties:
        tenantID: { type: string }
        webhook: { $ref: "#/components/schemas/WebhookView" }
        updatedAt: { type: integer, format: int64 }
        updatedBy: { type: string }
    WebhookPut:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri, maxLength: 2048, description: "http:// or https:// URL (no user info or fragment). Treated as a secret: a chat webhook's path is its credential.", writeOnly: true }
        headers:
          type: object
          description: "Headers sent with every notification (at most 16; values at most 4 KiB). Never logged, audited or returned."
          maxProperties: 16
          additionalProperties: { type: string, maxLength: 4096, format: password, writeOnly: true }
        events:
          type: array
          description: What to send. Default `[approval_requested]`.
          items: { $ref: "#/components/schemas/NotificationEventKind" }
      additionalProperties: false
    NotificationsPut:
      type: object
      required: [webhook]
      properties:
        webhook: { $ref: "#/components/schemas/WebhookPut" }
      additionalProperties: false
      x-tw-secret: true
    NotificationEvent:
      type: object
      description: |
        The JSON body mgmt POSTs to a tenant's webhook. `text` is one line
        for chat tools that read it (Slack, Mattermost, Google Chat
        incoming webhooks). `link` opens the row in the admin UI's
        approvals page; whoever opens it still decides with their own
        tailnet identity and grants.
      required: [event, tenantID, text, sentAt]
      properties:
        event: { $ref: "#/components/schemas/NotificationEventKind" }
        tenantID: { type: string }
        text: { type: string }
        link: { type: string, description: "`https://<mgmt>/ui/approvals?tenant=<tenant>#<instance>`" }
        cli: { type: string, description: "The `tw approve` command line." }
        workload: { type: string }
        workflow: { type: string }
        instance: { type: string }
        step: { type: string }
        facts:
          type: object
          additionalProperties: { type: number }
        sentAt: { type: string, format: date-time }
    NotificationTestResult:
      type: object
      required: [delivered]
      properties:
        delivered: { type: boolean }
        status: { type: integer, description: "The webhook's HTTP status, when it answered." }
        error: { type: string }
    TombstoneError:
      description: "`410 Gone`: the error plus the kill record. `tombstone` is absent only when the 410 is `delegation_invalid` for a spawn whose parent is dead (the parent's record is then at `GET /v1/objects/{parent}`)."
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          properties:
            tombstone: { $ref: "#/components/schemas/Tombstone" }
    Tombstone:
      type: object
      description: The kill record of an object. Kept until the tenant's terminal objects are purged.
      required: [objectID, tenantID, workload, namespace, objectName, killedAt, by, cascade, root, deviceDeleted]
      properties:
        objectID: { type: string }
        tenantID: { type: string }
        workload: { type: string }
        namespace: { type: string }
        objectName: { type: string }
        killedAt: { type: integer, format: int64, description: unix ms }
        reason: { type: string }
        by: { type: string, description: The actor (see Conventions). }
        cascade: { type: boolean, description: True when this object died as part of a cascade. }
        root: { type: string, description: The object the kill was issued on. }
        deviceDeleted: { type: boolean, description: Tier 2 done (false while the delete is still scheduled). }
        deviceDeleteAt: { type: integer, format: int64, description: unix ms when the scheduled device delete runs; absent once done. }

    # ---------------------------------------------------------- pagination
    Page:
      type: object
      description: |
        The generic page envelope (`Page<T>`); every concrete `*Page` schema
        below is this shape with a typed `items`. `nextCursor` is `null` on
        the last page.
      required: [items, nextCursor]
      properties:
        items: { type: array, items: {} }
        nextCursor:
          type: [string, "null"]
          description: Pass as `?cursor=` for the next page; `null` when there is none.
    TenantPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/Tenant" } }
    HostPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/Host" } }
    AssignmentPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/Assignment" } }
    DeploymentPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/Deployment" } }
    DeploymentHistoryPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [bundleRetention]
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/DeploymentRecord" } }
            bundleRetention:
              type: integer
              description: How many of each workload's newest bundles mgmt keeps (0 = every bundle).
    ContainerReservationPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/ContainerReservation" } }
    SecretPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/Secret" } }
    ObjectPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/Object" } }
    AuditPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [chains, verified]
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/AuditRecord" } }
            chains:
              type: array
              description: Verification status of every chain that contributed to this page.
              items: { $ref: "#/components/schemas/ChainStatus" }
            verified: { type: boolean, description: "AND over `chains[].ok`." }

    # ------------------------------------------------------------- tenants
    MintMode:
      type: string
      description: "`oauth`: a Tailscale OAuth client (scope `auth_keys`, tag `tag:tw`; optionally `devices:core` and `policy_file:read`) whose secret stays in a 0600 file on the mgmt host: the only mint mode for Tailscale tailnets. `headscale`: the Headscale profile (ADR-015): a Headscale server at `controlURL` mints tagged pre-auth keys with the Headscale API key in `apiKeyFile` (`HEADSCALE_API_KEY=…`); no Tailscale Services, no Funnel (public routes), no posture. `static`: fakemgmt only (testcontrol accepts any key). `apikey` and `wif` were removed (ADR-042): mgmt refuses to set them (`400 mint_mode_removed`); a tenant an older tailworks created in one still reports it here, but can't mint until it is switched to `oauth`."
      enum:
        - oauth
        - headscale
        - static
        # Removed (ADR-042): reported only for tenants an
        # older tailworks created; mgmt refuses to set them (mint_mode_removed).
        - apikey
        - wif
    Tier:
      type: string
      enum: [process, microvm]
    Tenant:
      type: object
      required: [tenantID, tailnet, mintMode, registrationsPerMinute, maxObjects, createdAt, updatedAt]
      properties:
        tenantID: { type: string, examples: [tn_tail7906d5] }
        tailnet: { type: string, description: "MagicDNS suffix of the customer tailnet., examples: [tail7906d5.ts.net]" }
        controlURL: { type: string, format: uri, description: "Non-default control plane (testcontrol, headscale)." }
        mintMode: { $ref: "#/components/schemas/MintMode" }
        apiKeyFile:
          type: string
          description: "`headscale` mode: absolute path of the Headscale API key file, read at use; the key is never stored or returned."
        oauthClientID:
          type: string
          description: "`oauth` mode: the OAuth client's public ID (`TS_OAUTH_CLIENT_ID`). The secret is never stored or returned."
        oauthClientFile:
          type: string
          description: "`oauth` mode: absolute path of the 0600 file with `TS_OAUTH_CLIENT_ID=…` / `TS_OAUTH_CLIENT_SECRET=tskey-client-…`, read at use on the mgmt host (a looser mode is refused)."
        registrationsPerMinute: { type: integer, minimum: 1, default: 200 }
        maxObjects: { type: integer, minimum: 1, default: 1000 }
        maxContainers: { type: integer, minimum: 1, default: 10, description: "Running containers (ADR-032), across the tenant's workloads. Not objects: they don't count against `maxObjects`." }
        maxContainerMemMiB: { type: integer, minimum: 1, default: 16384, description: Total guest memory of the tenant's running containers. }
        maxContainerVCPU: { type: number, exclusiveMinimum: 0, default: 8, description: "Total vCPUs of the tenant's running containers (fractional: `lite` is 1/16)." }
        pool:
          type: string
          description: Host pool the tenant's deployments are placed on (hosts with a matching `pool`; empty = any host).
        tier: { $ref: "#/components/schemas/Tier" }
        publicIngress: { $ref: "#/components/schemas/PublicIngress" }
        ownerTag:
          type: string
          description: |
            The tag that owns this tenant's workload and object tags, and that its
            OAuth client is scoped to. Default `tag:tw`. Two tenants on one
            tailnet need their own, so neither's client can mint the other's tags
            (`409 shared_owner_tag`). See docs/teams.md (ADR-043).
        namePrefix:
          type: string
          description: |
            Goes in front of every tailnet name tailworks generates for this tenant (object
            and workload nodes, Services, public names): `<prefix>-<name>`. Up to 11
            of a-z, 0-9 and inner hyphens. On a tailnet with several tenants, at most
            one may go without (`409 name_prefix_required`). Fixed once the tenant
            has deployed.
        oboPublicKey: { type: string, description: base64 Ed25519 key that verifies this tenant's node certificates; hostd pins it. }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
    TenantCreate:
      type: object
      required: [tailnet, mintMode]
      properties:
        tenantID: { type: string, description: Optional; generated (`tn_…`) when absent. }
        tailnet: { type: string }
        controlURL: { type: string, format: uri }
        mintMode: { $ref: "#/components/schemas/MintMode" }
        apiKeyFile: { type: string }
        oauthClientID: { type: string }
        oauthClientFile: { type: string }
        registrationsPerMinute: { type: integer, minimum: 1 }
        maxObjects: { type: integer, minimum: 1 }
        maxContainers: { type: integer, minimum: 1 }
        maxContainerMemMiB: { type: integer, minimum: 1 }
        maxContainerVCPU: { type: number, exclusiveMinimum: 0 }
        pool: { type: string }
        tier: { $ref: "#/components/schemas/Tier" }
        publicIngress: { $ref: "#/components/schemas/PublicIngress" }
        ownerTag: { type: string, description: "Default `tag:tw` (see `Tenant.ownerTag`)." }
        namePrefix: { type: string, description: "Default none (see `Tenant.namePrefix`)." }
      additionalProperties: false
    TenantPatch:
      type: object
      description: JSON Merge Patch over the updatable fields. `null` clears an optional field.
      properties:
        mintMode: { $ref: "#/components/schemas/MintMode" }
        apiKeyFile: { type: [string, "null"] }
        oauthClientID: { type: [string, "null"] }
        oauthClientFile: { type: [string, "null"] }
        registrationsPerMinute: { type: integer, minimum: 1 }
        maxObjects: { type: integer, minimum: 1 }
        maxContainers: { type: integer, minimum: 1 }
        maxContainerMemMiB: { type: integer, minimum: 1 }
        maxContainerVCPU: { type: number, exclusiveMinimum: 0 }
        pool: { type: [string, "null"] }
        tier: { $ref: "#/components/schemas/Tier" }
        publicIngress:
          description: "The ADR-029 gate: `allow` or `deny` (anything else is `400 bad_request`); `null` clears it (= `deny`)."
          type: [string, "null"]
        ownerTag:
          description: "Move the tenant to its own owner tag (`null` = back to `tag:tw`). Existing nodes keep their tags; set `oauthClientFile` to a client scoped to the new tag in the same patch."
          type: [string, "null"]
        namePrefix:
          description: "Only before the tenant's first deploy (`400 immutable_field` after)."
          type: [string, "null"]
      additionalProperties: false
    PublicIngress:
      type: string
      description: |
        Operator gate for public (Funnel) ingress (ADR-029 D1). `allow`: the
        tenant's `tailworks.jsonc` `public` routes take effect. `deny` (or absent):
        a deploy that declares them is refused `403 public_ingress_not_allowed`,
        and setting `deny` later makes hosts close every public listener.
        `tw up` (single-tenant) creates its tenant with `allow`.
      enum: [allow, deny]
    WorkloadPublic:
      type: object
      required: [tenantID, workload, exposed]
      properties:
        tenantID: { type: string }
        workload: { type: string }
        exposed: { type: boolean, description: "`tw expose on` (true, the default) or `off`." }
        updatedAt: { type: integer, format: int64 }
        updatedBy: { type: string, description: The actor who last toggled it (see Conventions). }
    WorkloadPublicPatch:
      type: object
      required: [exposed]
      properties:
        exposed: { type: boolean }
      additionalProperties: false
    PublicNameClaim:
      type: object
      description: "A tenant's claim on a public name on its tailnet (red-team H10): `https://<name>.<tailnet>/` serves only this tenant."
      required: [tailnet, name, tenantID, claimedAt]
      properties:
        tailnet: { type: string, description: "The tenant's tailnet, lower-cased, without a trailing dot." }
        name: { type: string }
        tenantID: { type: string }
        claimedAt: { type: integer, format: int64 }
        claimedBy: { type: string, description: "The actor whose deploy claimed it (see Conventions); `legacy` for a name a pre-upgrade deployment already served." }
    PublicNamePage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/PublicNameClaim" } }
    PublicLimits:
      type: object
      description: netd's limits on a public listener (ADR-029 D5); defaults filled in.
      properties:
        rps: { type: number, description: "Requests per second, per workload." }
        burst: { type: integer }
        ipRps: { type: number, description: "Requests per second, per client IP." }
        ipBurst: { type: integer }
        maxBodyBytes: { type: integer, format: int64 }
        maxHeaderBytes: { type: integer }
        timeoutSeconds: { type: integer }
        maxConns: { type: integer }
        maxConnsPerIp: { type: integer, description: "Concurrent connections per client address (an IPv6 client counts per /64)." }
        upgradeLifetimeSeconds: { type: integer, description: "Longest an upgraded (WebSocket) connection stays open." }
    PublicAssignment:
      type: object
      description: |
        A workload's public ingress (ADR-029). The host runs one extra node
        for it (namespace `_public`, object name = the workload, hostname =
        the workload name, `tags`) whose Funnel listener serves `routes`
        while `exposed`.
      required: [routes, limits, tags, exposed]
      properties:
        routes: { type: array, items: { type: string }, examples: [["/webhooks/*", "/oauth/callback"]] }
        upgrade: { type: array, items: { type: string }, description: Routes on which WebSocket/SSE upgrades are allowed. }
        limits: { $ref: "#/components/schemas/PublicLimits" }
        tags: { type: array, items: { type: string }, examples: [["tag:tw-public"]] }
        exposed: { type: boolean }
    DeploymentPublic:
      type: object
      description: The deployment's public routes (ADR-029); absent when tailnet-only.
      required: [url, routes, exposed, allowed]
      properties:
        url: { type: string, format: uri, examples: ["https://support.tail7906d5.ts.net/"] }
        routes: { type: array, items: { type: string } }
        exposed: { type: boolean, description: "`tw expose` setting." }
        allowed: { type: boolean, description: "The tenant's `publicIngress` is `allow`; false: declared but not served." }
    TenantDeleteResult:
      type: object
      required: [tenantID, killed]
      properties:
        tenantID: { type: string }
        killed: { type: array, items: { type: string } }
        purged: { type: array, items: { type: string } }
        deploymentsStopped: { type: array, items: { type: string } }
        devicesDeleting: { type: array, items: { type: string } }
        removed:
          type: object
          description: What the delete removed, by kind (rows, custody entries, hosts to purge).
          additionalProperties: { type: integer, format: int64 }
    PurgeResult:
      type: object
      required: [purged]
      properties:
        purged: { type: array, items: { type: string }, description: Object IDs forgotten. }
        warmKeysRevoked: { type: integer, description: "The tenant's unused pooled keys revoked with the purge." }
    # --------------------------------------------------------------- hosts
    HostStatusEnum:
      type: string
      description: "`pending`: created by `tw host add`, never registered. `live`: heartbeated within 10 s. `stale`: registered, no recent heartbeat. `draining`: being deleted."
      enum: [pending, live, stale, draining]
    HostPush:
      type: object
      description: |
        Where mgmt pushes kills and assignment changes. Over the tailnet,
        `port` names hostd's push listener on **its own tsnet node** (the
        WhoIs node; mgmt never pushes anywhere else). `url` is accepted only
        on the local-dev socket and only as `unix:///…`.
      properties:
        port: { type: integer, minimum: 1, maximum: 65535 }
        url: { type: string, description: "`unix:///path/hostd.sock` (local-dev only), or `inproc://` for the host embedded in the mgmt process (single-process `tw up`; accepted only from the in-process transport)." }
    HostTier:
      type: string
      description: "What a host offers: the isolation tiers (`process`, `microvm`) and `containers` (ADR-032: it can run containers and code sandboxes, one microVM each, for images of its `arch`)."
      enum: [process, microvm, containers]
    Arch:
      type: string
      description: A Go GOARCH. Container images must match their host's.
      enum: [amd64, arm64]
    HostCapacity:
      type: object
      description: |
        The capacity vector a host registers (ADR-032 D9). `nodes` is
        tailnet nodes (= `capacityNodes`); the rest bound microVMs (DO
        instances and containers alike): their count, guest memory (all, and
        the part backed by 2 MiB huge pages), vCPUs (times `vcpuOvercommit`
        for scheduling) and scratch disk. A host without a microVM backend
        reports 0 for every VM dimension.
      required: [nodes, vms, vmMemMiB, hugeMemMiB, vcpus, vcpuOvercommit, scratchMiB]
      properties:
        nodes: { type: integer, minimum: 0 }
        vms: { type: integer, minimum: 0 }
        vmMemMiB: { type: integer, minimum: 0 }
        hugeMemMiB: { type: integer, minimum: 0 }
        vcpus: { type: integer, minimum: 0 }
        vcpuOvercommit: { type: number, minimum: 0 }
        scratchMiB: { type: integer, minimum: 0 }
      additionalProperties: false
    HostUsage:
      type: object
      description: Live usage against `HostCapacity`, reported with every heartbeat. `containers` is the running containers (a subset of `vms`).
      required: [nodes, vms, vmMemMiB, hugeMemMiB, vcpus, scratchMiB, containers]
      properties:
        nodes: { type: integer, minimum: 0 }
        vms: { type: integer, minimum: 0 }
        vmMemMiB: { type: integer, minimum: 0 }
        hugeMemMiB: { type: integer, minimum: 0 }
        vcpus: { type: number, minimum: 0 }
        scratchMiB: { type: integer, minimum: 0 }
        containers: { type: integer, minimum: 0 }
      additionalProperties: false
    Host:
      type: object
      required: [hostID, status, capacityNodes, tiers, liveNodes, lastSeen, createdAt, updatedAt]
      properties:
        hostID: { type: string }
        status: { $ref: "#/components/schemas/HostStatusEnum" }
        capacityNodes: { type: integer }
        tiers: { type: array, items: { $ref: "#/components/schemas/HostTier" } }
        arch: { $ref: "#/components/schemas/Arch" }
        capacity: { $ref: "#/components/schemas/HostCapacity" }
        usage: { $ref: "#/components/schemas/HostUsage" }
        pool: { type: string }
        nodeID: { type: string, description: "Stable node ID of the host's `tag:tw-host` tsnet node (bound at registration)." }
        dnsName: { type: string, description: "`tw-host-<hostID>.<tailnet>`." }
        auditPubKey: { type: string, description: base64 ed25519; verifies `hostSig`. }
        push: { $ref: "#/components/schemas/HostPush" }
        liveNodes: { type: integer }
        leases: { type: array, items: { $ref: "#/components/schemas/Lease" }, description: Namespace leases the host currently holds. }
        lastSeen: { type: integer, format: int64, description: unix ms of the last heartbeat }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
        version: { type: string, description: "The host's tw version, from its last registration (absent: a hostd from before version reporting, 0.1.x)." }
        os: { type: string }
        protocols: { $ref: "#/components/schemas/Protocols" }
        features: { type: array, items: { type: string }, description: "Host features it offers (`kv`, `r2`, `d1`, `telemetry`, …); placement needs every one a bundle uses." }
        skew: { type: string, description: Why the host is outside the version window (placement skips it); absent when it is within. }
        cordonedAt: { type: integer, format: int64, description: unix ms; absent when not cordoned. }
        cordonedBy: { type: string }
    HostCreate:
      type: object
      required: [hostID]
      properties:
        hostID: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,62}$" }
        tenantID:
          type: string
          description: "The operator tenant whose credential mints the key (default: the tenant whose tailnet is mgmt's own)."
        pool: { type: string }
        tiers: { type: array, items: { $ref: "#/components/schemas/HostTier" } }
      additionalProperties: false
    HostJoin:
      type: object
      description: A single-use join key for a host's `tag:tw-host` node. Never logged.
      required: [host, authKey, registrationSecret, expiresAt, tags, hostname]
      properties:
        host: { $ref: "#/components/schemas/Host" }
        authKey: { type: string, format: password }
        registrationSecret:
          type: string
          format: password
          description: One-time secret (32 random bytes, base64url) the host presents in its first `PUT /v1/hosts/{id}`; mgmt stores only its SHA-256 and clears it once the node is bound.
        expiresAt: { type: integer, format: int64, description: unix ms }
        tags: { type: array, items: { type: string } }
        hostname: { type: string, description: "`tw-host-<hostID>`" }
        controlURL: { type: string, format: uri }
        tailnet: { type: string }
      x-tw-secret: true
    HostRegistration:
      type: object
      required: [capacityNodes, tiers]
      properties:
        capacityNodes: { type: integer, minimum: 0 }
        tiers: { type: array, items: { $ref: "#/components/schemas/HostTier" }, minItems: 1 }
        arch: { $ref: "#/components/schemas/Arch" }
        capacity: { $ref: "#/components/schemas/HostCapacity" }
        pool: { type: string }
        auditPubKey: { type: string, description: Pinned on first bind; a later registration may only repeat it. }
        push: { $ref: "#/components/schemas/HostPush" }
        registrationSecret:
          type: string
          format: password
          description: Required on the first registration of a host created by `POST /v1/hosts` (the `registrationSecret` from that answer); ignored once the node is bound.
        version: { type: string, description: "The host's tw version. A host outside the version window is refused: `409 version_skew`." }
        os: { type: string, enum: [darwin, linux], description: GOOS (which release tarball the host runs). }
        protocols: { $ref: "#/components/schemas/Protocols" }
        features: { type: array, items: { type: string }, maxItems: 64 }
      additionalProperties: false
    HostDrainRequest:
      type: object
      properties:
        allowLocalStateLoss: { type: boolean, description: "Move workloads with Durable Objects too; their storage stays behind on this host." }
        dryRun: { type: boolean }
      additionalProperties: false
    HostDrainResult:
      type: object
      required: [hostID, cordoned, moved, refused]
      properties:
        hostID: { type: string }
        cordoned: { type: boolean }
        dryRun: { type: boolean }
        moved:
          type: array
          items:
            type: object
            required: [tenantID, workload, to]
            properties:
              tenantID: { type: string }
              workload: { type: string }
              to: { type: string, description: The host it moved (or would move) to. }
              deploymentID: { type: string }
        refused:
          type: array
          items:
            type: object
            required: [tenantID, workload, code, message]
            properties:
              tenantID: { type: string }
              workload: { type: string }
              code: { $ref: "#/components/schemas/ErrorCode" }
              message: { type: string }
    ReleaseNote:
      type: object
      required: [kind, text]
      properties:
        kind: { type: string, enum: [feature, fix, breaking, security] }
        upgrade: { type: array, items: { type: string } }
        source: { type: string }
        text: { type: string }
    ReleaseEntry:
      type: object
      required: [version, notes]
      properties:
        version: { type: string }
        date: { type: string }
        workerd: { type: string }
        schema: { type: string }
        contractMigrations: { type: array, items: { type: string } }
        protocols: { $ref: "#/components/schemas/Protocols" }
        upgrade: { type: array, items: { type: string } }
        notes: { type: array, items: { $ref: "#/components/schemas/ReleaseNote" } }
        source: { type: string, enum: [builtin, imported] }
        artifacts: { type: array, items: { type: string }, description: Artifacts stored on this replica. }
    ReleaseCatalog:
      type: object
      required: [current, items]
      properties:
        current: { type: string }
        items: { type: array, items: { $ref: "#/components/schemas/ReleaseEntry" } }
    ReleaseImport:
      type: object
      required: [entries]
      properties:
        entries: { type: array, items: { $ref: "#/components/schemas/ReleaseEntry" }, maxItems: 1000 }
      additionalProperties: false
    ReleaseArtifact:
      type: object
      required: [version, name, sha256, size]
      properties:
        version: { type: string }
        name: { type: string }
        sha256: { type: string }
        size: { type: integer, format: int64 }
    UpgradeRequest:
      type: object
      required: [to]
      properties:
        to: { type: string, description: The target release version (it must be in the catalog). }
        dryRun: { type: boolean }
        hosts: { type: array, items: { type: string }, description: "Upgrade only these hosts (default: every host below `to`)." }
        canary: { type: string, description: "The canary host (default: the first host in order)." }
        soakSeconds: { type: integer, minimum: 0, maximum: 86400, description: How long to watch the canary before the rest (default 300). }
        settleSeconds: { type: integer, minimum: 10, maximum: 3600, description: How long a host may take to re-register and settle (default 300). }
      additionalProperties: false
    UpgradePlan:
      type: object
      required: [from, to, steps, breaking, blockers, warnings]
      properties:
        from:
          type: object
          required: [mgmt, hosts]
          properties:
            mgmt: { type: array, items: { type: string } }
            hosts: { type: object, additionalProperties: { type: string }, description: Host ID to version. }
        to: { type: string }
        path: { type: array, items: { type: string }, description: Every release between the oldest running version and `to` that has a contract migration (each must be passed through). }
        steps: { type: array, items: { $ref: "#/components/schemas/UpgradeStep" } }
        breaking: { type: array, items: { $ref: "#/components/schemas/ReleaseNote" } }
        actions: { type: array, items: { $ref: "#/components/schemas/ReleaseNote" }, description: Notes that need an operator action. }
        blockers: { type: array, items: { type: string }, description: Why the run can't start; empty when it can. }
        warnings: { type: array, items: { type: string } }
    UpgradeStep:
      type: object
      required: [kind, status]
      properties:
        kind: { type: string, enum: [backup, mgmt, contract, host] }
        host: { type: string }
        canary: { type: boolean }
        method: { type: string, enum: [drain, bounce], description: "Hosts: `drain` moves its workloads off first; `bounce` restarts in place (workloads with host-local state, or nowhere to move)." }
        status: { type: string, enum: [pending, running, waiting, done, skipped, failed] }
        detail: { type: string }
        needsOperator: { type: string, description: A command the operator must run before this step can finish. }
        startedAt: { type: integer, format: int64 }
        finishedAt: { type: integer, format: int64 }
    UpgradeRun:
      type: object
      required: [id, to, state, steps, createdAt, updatedAt]
      properties:
        id: { type: string }
        to: { type: string }
        state: { type: string, enum: [running, paused, done, aborted, failed] }
        reason: { type: string, description: "Why the run is paused, failed or aborted." }
        step: { type: integer, description: Index of the current step. }
        steps: { type: array, items: { $ref: "#/components/schemas/UpgradeStep" } }
        plan: { $ref: "#/components/schemas/UpgradePlan" }
        createdBy: { type: string }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
    Lease:
      type: object
      required: [namespace, epoch]
      properties:
        namespace: { type: string, description: "Lease name `<tenantID>/<workload>` (a workload or DO class name is also accepted on input)." }
        epoch: { type: integer, format: int64 }
        expiresAt: { type: integer, format: int64 }
    HostPathReport:
      type: object
      required: [tenants]
      properties:
        tenants:
          type: array
          maxItems: 64
          items: { $ref: "#/components/schemas/PathReport" }
      additionalProperties: false
    PathReport:
      type: object
      required: [tenantID, targets]
      properties:
        tenantID: { type: string }
        targets:
          type: array
          maxItems: 32
          items: { $ref: "#/components/schemas/PathSample" }
      additionalProperties: false
    PathSample:
      type: object
      required: [target, path, ageMs]
      properties:
        target: { type: string, maxLength: 255, description: "A `tailnet.connects` entry: a tag or a peer name." }
        peer: { type: string, maxLength: 255, description: The netmap peer measured (the best one when a tag matches several). }
        path: { $ref: "#/components/schemas/PathClass" }
        rttMs: { type: number, minimum: 0 }
        derpRegion: { type: string, maxLength: 64 }
        ageMs: { type: integer, format: int64, minimum: 0 }
      additionalProperties: false
    PathClass:
      type: string
      enum: [direct, peer-relay, derp, unresolved, unreachable, unmeasured]
      description: >-
        How a host reaches a target: direct WireGuard, a Tailscale peer relay, or DERP; `unresolved` (no
        netmap peer matches the target), `unreachable` (no ping answered), `unmeasured` (no fresh
        measurement; placement only).
    PlacementDecision:
      type: object
      description: Why a deployment is on its host (smart placement, ADR-033).
      required: [host, reason, mode, summary]
      properties:
        host: { type: string }
        reason:
          type: string
          enum: [pinned, sticky, smart, capacity]
          description: >-
            pinned: `host` was given; sticky: kept on the current lease holder; smart: the best measured
            path; capacity: no measured path decided, so the most free capacity.
        mode: { type: string, enum: [smart, "off"] }
        targets: { type: array, items: { type: string } }
        aggregate: { type: string, enum: [worst, sum] }
        summary: { type: string, examples: ["placed on h2: tag:db direct 1.8 ms (h1: relayed 24 ms, h3: unmeasured)"] }
        hosts:
          type: array
          maxItems: 8
          description: The candidates, eligible ones best first.
          items:
            type: object
            required: [host, eligible, free]
            properties:
              host: { type: string }
              eligible: { type: boolean }
              why: { type: string, description: Why the host is not eligible. }
              free: { type: integer }
              path: { $ref: "#/components/schemas/PathClass" }
              rttMs: { type: number }
              targets:
                type: array
                items:
                  type: object
                  required: [target, path]
                  properties:
                    target: { type: string }
                    path: { $ref: "#/components/schemas/PathClass" }
                    detail: { type: string }
                    rttMs: { type: number }
                    peer: { type: string }
                    derpRegion: { type: string }
                    ageSeconds: { type: integer, format: int64 }
    DeploymentReport:
      type: object
      required: [deploymentID, status]
      properties:
        deploymentID: { type: string }
        status: { $ref: "#/components/schemas/DeploymentStatus" }
        error: { type: string }
    HostStatus:
      type: object
      description: The heartbeat body.
      required: [liveNodes, leases]
      properties:
        liveNodes: { type: integer, minimum: 0 }
        leases: { type: array, items: { $ref: "#/components/schemas/Lease" } }
        deployments: { type: array, items: { $ref: "#/components/schemas/DeploymentReport" } }
        usage: { $ref: "#/components/schemas/HostUsage" }
        containers:
          type: array
          description: |
            Every container running on this host (reservation reconciliation,
            ADR-032 D9): a reported reservation is renewed; a host's
            reservation left out for 30 s after its creation is released; a
            reported container with no reservation is adopted if this host
            holds the workload's lease (it runs; mgmt records it, over quota
            or not, audited `container_reserve` with `adopted`), else ignored.
          items: { $ref: "#/components/schemas/RunningContainer" }
        purgedTenants:
          type: array
          description: Deleted tenants (from `purgeTenants`) whose local state this host has removed.
          items: { type: string }
      additionalProperties: false
    HostStatusResponse:
      type: object
      required: [revoke, revokeObjects]
      properties:
        revoke: { type: array, items: { type: string }, description: Lease entries that are no longer held. }
        revokeObjects: { type: array, items: { type: string }, description: Object IDs killed in the last 10 min in namespaces this host holds; kill idempotently. }
        assignmentsChanged: { type: boolean, description: A hint to re-list assignments (set when a push could not be delivered). }
        purgeTenants:
          type: array
          description: |
            Deleted tenants whose local state this host must remove
            (`tenants/<id>/`, R2 blobs); repeated until the host reports them
            in `purgedTenants`.
          items: { type: string }
    HostDeleteResult:
      type: object
      required: [hostID, killed, leasesReleased]
      properties:
        hostID: { type: string }
        killed: { type: array, items: { type: string } }
        leasesReleased: { type: array, items: { type: string } }
        devicesLeft: { type: array, items: { type: string }, description: Devices mgmt could not delete (no operator credential); delete them in the console. }

    # --------------------------------------------------------- deployments
    DeploymentStatus:
      type: string
      description: |
        - `assigned`: mgmt placed it; the host has not reported yet.
        - `starting`: the host is starting it.
        - `active`: serving.
        - `crashloop`: it served, then its workerd kept exiting; the host
          keeps restarting it with exponential backoff (200 ms doubling to
          5 min) and reports `active` again once it answers. `error` holds
          the attempt count, the next delay and the last log lines.
        - `draining`: being replaced or undeployed.
        - `stopped`: stopped (undeployed, fenced or unassigned).
        - `failed`: the deploy failed (bad bundle or config, or it never
          became healthy); the host does not retry it. `error` says why.
        - `superseded`: a newer deployment of the workload replaced it.
      enum:
        - assigned
        - starting
        - active
        - crashloop
        - draining
        - stopped
        - failed
        - superseded
    ClassConfig:
      type: object
      description: One DO namespace from `tailworks.jsonc` `tailnet.objects`.
      required: [class, tags]
      properties:
        class: { type: string }
        tags: { type: array, items: { type: string } }
        agent: { type: boolean }
        ttl: { type: string, description: "`10m`-style duration or seconds." }
        service:
          type: string
          pattern: "^svc:[a-z0-9][a-z0-9-]{0,62}$"
          description: >-
            `_workload` only: the Tailscale Service the workload entry node hosts (`tailworks.jsonc`
            `tailnet.service`).
        replicaOf:
          type: string
          description: >-
            `_workload` only, replicas 2..N: the workload this deployment is a replica of (`tailworks.jsonc`
            `replicas`). Replica i is deployed as the workload `<workload>--r<i>`.
        replicas: { type: integer, minimum: 2, description: "`_workload` only, the workload itself: its replica count when > 1." }
        previewOf:
          type: string
          description: >-
            `_workload` only, previews: the workload this deployment is a preview of (ADR-048),
            deployed as the workload `<workload>--preview-<alias>`.
    ReplicaRef:
      type: object
      description: One replica of a workload with `tailworks.jsonc` `replicas` > 1.
      required: [workload, deploymentID, host]
      properties:
        workload: { type: string, examples: [web--r2] }
        deploymentID: { type: string }
        host: { type: string }
        status: { $ref: "#/components/schemas/DeploymentStatus" }
    ServiceEndpoint:
      type: object
      description: >-
        A workload's Tailscale Service: a stable name and VIPs that survive the workload node being
        re-minted or moving host. Callers need a grant to the `svc:` name; control routes it to the
        workload node only when policy `autoApprovers.services` lets the workload tags host it.
      required: [name, magicDNS]
      properties:
        name: { type: string, examples: ["svc:support"] }
        magicDNS: { type: string, examples: [support.tail1234.ts.net] }
        addrs: { type: array, items: { type: string }, description: The Service VIPs (on create). }
    Endpoint:
      type: object
      description: The workload entry node (`_workload` object).
      required: [node, magicDNS, status]
      properties:
        objectID: { type: string }
        node: { type: string, description: hostname }
        magicDNS: { type: string }
        status: { $ref: "#/components/schemas/ObjectStatus" }
        service: { $ref: "#/components/schemas/ServiceEndpoint" }
    Deployment:
      type: object
      required: [deploymentID, tenantID, workload, host, epoch, status, namespaces, endpoint, createdAt]
      properties:
        deploymentID: { type: string, examples: [dp_3f9a1c2b7d8e4f50] }
        tenantID: { type: string }
        workload: { type: string }
        host: { type: string }
        epoch: { type: integer, format: int64 }
        status: { $ref: "#/components/schemas/DeploymentStatus" }
        error: { type: string }
        tier: { $ref: "#/components/schemas/Tier" }
        namespaces: { type: array, items: { $ref: "#/components/schemas/ClassConfig" } }
        workloadTags: { type: array, items: { type: string } }
        maxLive: { type: integer }
        maxDepth: { type: integer }
        endpoint: { $ref: "#/components/schemas/Endpoint" }
        public: { $ref: "#/components/schemas/DeploymentPublic" }
        replicas:
          type: array
          description: >-
            A workload with `tailworks.jsonc` `replicas` > 1 (stateless only): every copy, this deployment first,
            each on a distinct host. Undeploying the workload undeploys its replicas.
          items: { $ref: "#/components/schemas/ReplicaRef" }
        deployedBy: { type: string, description: The actor who deployed (see Conventions). }
        containers:
          type: array
          description: "The bundle's container classes with the images pinned at deploy (ADR-032 D3): what hosts pull, by digest."
          items: { $ref: "#/components/schemas/ContainerClass" }
        placement: { $ref: "#/components/schemas/PlacementDecision" }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
    DeploymentCreate:
      type: object
      required: [tenantID, workload, bundle]
      properties:
        tenantID: { type: string }
        workload: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
        bundle: { type: string, contentEncoding: base64, description: tar (optionally gzipped) of the built worker + `tailworks.jsonc` + `wrangler.jsonc`. }
        host: { type: string, description: Pin a host. }
        forceTakeover:
          type: boolean
          description: >-
            Confirm that the workload's current host, which has stopped heartbeating, is gone for good, so a
            stateful workload may move off it (ADR-028 §3). Without it such a move is refused with
            `takeover_unconfirmed`. Audited (`takeoverFrom`, `forced`). With `replace`, it also confirms
            moving a stateful workload off a live host (its DO storage stays there).
        replace:
          type: boolean
          description: >-
            Re-place a running workload (smart placement, ADR-033): move it to a clearly better eligible
            host, or to `host` when pinned. Audited (`movedFrom`, `replace`).
        preview:
          type: boolean
          description: >-
            Deploy as a preview (`tw deploy --preview`, ADR-048): a workload of its own,
            `<workload>--preview-<alias>`, with the same tags, its own lease, Durable Object storage and stores,
            the workload's secrets, and no Tailscale Service, public routes or replicas. The workload itself is
            not touched. A bundle with queue bindings is `400 preview_unsupported`.
        previewAlias:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,19}$"
          description: >-
            The preview's alias (implies `preview`). Default: the first 8 hex digits of the bundle's
            SHA-256, so the same bundle is the same preview.
        namespaces:
          type: array
          description: Override the classes read from `tailworks.jsonc` (tests).
          items: { $ref: "#/components/schemas/ClassConfig" }
        containerImages: { $ref: "#/components/schemas/ContainerImages" }
      additionalProperties: false
    DeploymentRecord:
      type: object
      description: One entry of a workload's deployment history (ADR-046).
      required: [deploymentID, workload, host, epoch, status, createdAt, bundleSHA256, bundleRetained]
      properties:
        deploymentID: { type: string, examples: [dp_3f9a1c2b7d8e4f50] }
        workload: { type: string }
        host: { type: string }
        epoch: { type: integer, format: int64 }
        status: { $ref: "#/components/schemas/DeploymentStatus" }
        error: { type: string, description: The host's last error for this deployment. }
        hostStatus:
          type: string
          description: >-
            The last status the host reported (or mgmt set) for this deployment, kept after it is superseded:
            `active` means it was serving when it was replaced.
        deployedBy: { type: string, description: The actor who deployed (see Conventions). }
        createdAt: { type: integer, format: int64 }
        activeAt:
          type: integer
          format: int64
          description: When the host first reported it `active` (unix ms). Absent if it never was, or the record predates history.
        bundleSHA256: { type: string, description: "Hex SHA-256 of the bundle as uploaded (empty: deployed without a bundle)." }
        bundleBytes: { type: integer, format: int64, description: Size of the retained bundle (0 once pruned). }
        bundleRetained: { type: boolean, description: "mgmt still holds the bundle, so it can be rolled back to." }
        rollbackOf: { type: string, description: "Set on a rollback: the deployment whose bundle it redeployed." }
    RollbackCreate:
      type: object
      properties:
        deploymentID:
          type: string
          description: The deployment to roll back to. Default the previous good one (see `CreateRollback`).
        host: { type: string, description: "Pin a host, as for a deploy." }
        replace: { type: boolean, description: "Re-place the workload, as `POST /v1/deployments` `replace`." }
        forceTakeover: { type: boolean, description: "As `POST /v1/deployments` `forceTakeover`." }
      additionalProperties: false
    Rollback:
      type: object
      description: A started rollback.
      required: [rollbackOf, target, deployment]
      properties:
        rollbackOf: { type: string, description: The deployment whose bundle was redeployed. }
        target: { $ref: "#/components/schemas/DeploymentRecord" }
        deployment: { $ref: "#/components/schemas/Deployment" }
    Preview:
      type: object
      description: One running preview of a workload (ADR-048).
      required: [workload, alias, previewOf, deployment]
      properties:
        workload: { type: string, description: "The preview's own workload name.", examples: [web--preview-3f9a1c2b] }
        alias: { type: string, examples: [3f9a1c2b] }
        previewOf: { type: string, examples: [web] }
        bundleSHA256: { type: string, description: Hex SHA-256 of the preview's bundle. }
        deployment: { $ref: "#/components/schemas/Deployment" }
    PreviewList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Preview" } }
    PromotionCreate:
      type: object
      required: [preview]
      properties:
        preview:
          type: string
          description: The preview to promote, by alias (`3f9a1c2b`) or by its workload name (`web--preview-3f9a1c2b`).
        host: { type: string, description: "Pin a host, as for a deploy." }
        replace: { type: boolean, description: "Re-place the workload, as `POST /v1/deployments` `replace`." }
        forceTakeover: { type: boolean, description: "As `POST /v1/deployments` `forceTakeover`." }
        keepPreview: { type: boolean, description: "Leave the preview running after the promotion (default: undeploy it)." }
      additionalProperties: false
    Promotion:
      type: object
      description: A started promotion.
      required: [preview, promotedFrom, deployment, previewStopped]
      properties:
        preview: { type: string, description: "The preview's workload name." }
        promotedFrom: { type: string, description: The preview deployment whose bundle was deployed. }
        deployment: { $ref: "#/components/schemas/Deployment" }
        previewStopped: { type: boolean, description: The preview was undeployed. }
    Assignment:
      type: object
      description: What a host must run; `bundleURL` is `GET /v1/deployments/{id}/bundle`.
      required: [deploymentID, tenantID, workload, bundleURL, namespaces, epoch, lease, tailnet, createdAt]
      properties:
        deploymentID: { type: string }
        tenantID: { type: string }
        workload: { type: string }
        bundleURL: { type: string, format: uri-reference }
        namespaces: { type: array, items: { $ref: "#/components/schemas/ClassConfig" } }
        workloadTags: { type: array, items: { type: string } }
        service:
          type: string
          description: >-
            The Tailscale Service the workload entry node advertises while the deployment is active and
            healthy; the host withdraws it on drain, undeploy, fencing, kill, or failed health checks.
        fence:
          type: boolean
          description: >-
            Stop serving this workload when no heartbeat to mgmt has succeeded for the host's fence window (30 s):
            it has Durable Objects that must not run on two hosts (ADR-028 §3). Stateless workloads and
            `"fence": "never"` classes are false and keep serving. Hosts treat a missing field as true.
        epoch: { type: integer, format: int64 }
        lease: { type: string }
        tailnet: { type: string }
        controlURL: { type: string, format: uri }
        tier: { $ref: "#/components/schemas/Tier" }
        placementTargets:
          type: array
          maxItems: 16
          description: Smart placement targets the host should measure paths to (`PUT /v1/hosts/{id}/paths`).
          items: { type: string }
        maxLive: { type: integer }
        maxDepth: { type: integer }
        public: { $ref: "#/components/schemas/PublicAssignment" }
        createdAt: { type: integer, format: int64 }
        containers:
          type: array
          description: |
            The workload's container classes as mgmt resolved them at deploy (ADR-032 D3): the image
            refs `ctx.container` sees and their per-arch pins. hostd starts a container only from the
            pin for its own arch, pulled by digest from tailworks' registry.
          items: { $ref: "#/components/schemas/ContainerClass" }
    PreflightMissing:
      type: object
      required: [src, dst, snippet]
      properties:
        src: { type: string }
        dst: { type: string }
        snippet: { type: string, description: The grant to add (HuJSON). }
    PreflightResult:
      type: object
      required: [ok, missing, missingTagOwners]
      properties:
        ok: { type: boolean }
        srcTags: { type: array, items: { type: string }, description: The tags checked (workload + object tags from the bundle). }
        missing: { type: array, items: { $ref: "#/components/schemas/PreflightMissing" } }
        missingTagOwners: { type: array, items: { type: string } }
        tagOwnersSnippet: { type: string }
        unchecked: { type: array, items: { type: string }, description: "`tailnet.connects` entries that are names, not tags." }
        service: { type: string, description: "The Tailscale Service the workload node would host (`tailnet.service`)." }
        serviceUnapproved:
          type: boolean
          description: >-
            The policy's `autoApprovers.services` doesn't let the workload tags host `service`: the node would
            advertise it but control would never route it. `ok` is false.
        serviceSnippet: { type: string, description: The `autoApprovers` entry to add (HuJSON). }
        missingNodeAttrs:
          type: array
          items: { type: string }
          description: Missing policy `nodeAttrs` (ADR-029 D6), e.g. `funnel on tag:tw-public` for a workload with public routes.
        nodeAttrsSnippet: { type: string, description: The `tagOwners` + `nodeAttrs` policy to add (HuJSON). }
        publicURL: { type: string, format: uri, description: Where the workload's public routes will be served. }
        tagOwnerProblems:
          type: array
          items: { type: string }
          description: For a tenant with its own `ownerTag`, the tags its owner tag doesn't own, or that another tenant's owner tag on the tailnet owns. Makes `ok` false.
        accessWarnings:
          type: array
          items: { type: string }
          description: >-
            Grants to `tag:tw-mgmt` that don't do what they look like: values on `github.com/rosskukulinski/tailworks/cap/admin` (they don't narrow it),
            invalid `github.com/rosskukulinski/tailworks/cap/tenant-admin` values or unknown tenant IDs in them, and, on a tailnet with several tenants,
            `github.com/rosskukulinski/tailworks/cap/mcp` or `github.com/rosskukulinski/tailworks/cap/approve` grants (they apply to every tenant). Never make `ok` false.

    # ------------------------------------------------------------- objects
    ObjectStatus:
      type: string
      description: |
        `pending` → `minted` → `ready`; or, for an object given a pre-joined
        pool node (`ObjectCreate.poolObjectID`, ADR-031), `assigned` → `ready`
        (never minted). Terminal: `killed` (tombstone, `410`), `failed`, and
        `transferred` (a `_pool` node whose node went to an object).
      enum: [pending, minted, assigned, ready, killed, failed, transferred]
    ObjectRef:
      type: object
      required: [objectID]
      properties:
        objectID: { type: string }
    Caps:
      type: object
      description: "`{capName: value | [values]}`; see `caps ⊆ parent` semantics in `CreateObject`."
      additionalProperties: true
    Object:
      type: object
      required: [objectID, tenantID, workload, namespace, objectName, hostname, deploymentID, lease, tags, root, depth, ephemeral, status, lineage, createdAt, updatedAt]
      properties:
        objectID: { type: string, examples: [agent-k3j5m7p9qa] }
        tenantID: { type: string }
        workload: { type: string }
        namespace: { type: string, description: "DO class name, or `_workload`." }
        objectName: { type: string }
        hostname: { type: string, description: The node hostname (hostd may prepend its `-hostname-prefix`). }
        deploymentID: { type: string }
        lease: { type: string }
        host: { type: string, description: The lease holder when known. }
        tags: { type: array, items: { type: string } }
        caps: { $ref: "#/components/schemas/Caps" }
        parent: { type: string, description: Parent object ID (spawn). }
        root: { type: string, description: Root of the spawn tree (itself for a root). }
        depth: { type: integer }
        lineage: { type: array, items: { type: string }, description: Object IDs from the root down to this object (inclusive). }
        children: { type: array, items: { type: string } }
        ttl: { type: integer, format: int64, description: seconds }
        ephemeral: { type: boolean }
        status: { $ref: "#/components/schemas/ObjectStatus" }
        nodeID: { type: string }
        stableNodeID: { type: string }
        magicDNS: { type: string }
        cert: { type: string, description: "The node certificate `<b64url payload>.<b64url sig>` once ready." }
        actingFor: { type: string, description: "The human principal at the head of the chain, when known." }
        killReason: { type: string }
        tombstone: { $ref: "#/components/schemas/Tombstone" }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
    ObjectCreate:
      type: object
      required: [tenantID, namespace, objectName]
      properties:
        tenantID: { type: string }
        workload: { type: string, description: Always sent by hostd; see resolution rules in `CreateObject`. }
        namespace: { type: string, description: "DO class name, `_workload`, or `_pool` (a pre-joined pool node; then `objectName` is `<Class>/<suffix>` and `workload` is required)." }
        objectName: { type: string }
        parent: { $ref: "#/components/schemas/ObjectRef" }
        poolObjectID:
          type: string
          description: |
            A ready `_pool` node of this tenant, workload and class with exactly
            the class's tags, offered for a new, non-ephemeral object. If every
            condition holds, the object is created `assigned` to that node (no
            mint) and the pool node becomes `transferred`, in one transaction;
            the host renames the node and sends `ready` with the same
            `stableNodeID`. Otherwise it is ignored and the object is minted.
        caps: { $ref: "#/components/schemas/Caps" }
        ttl:
          description: "`10m`-style duration or seconds. Defaults to the class `ttl`."
          oneOf:
            - { type: string }
            - { type: integer, minimum: 1 }
        hostname: { type: string, description: The hostname hostd proposes; mgmt answers with the one to use. }
        actingFor: { type: string, description: The principal this object acts for (feeds audit). }
        traceID: { type: string }
        epoch:
          type: integer
          format: int64
          minimum: 1
          description: |
            The lease epoch the calling host holds for the workload. hostd
            always sends it. A host may only create objects on leases it
            holds: the create is fenced on the lease's holder (and, when
            `epoch` is given, its epoch) in the insert transaction;
            otherwise `409 lease_lost`.
      additionalProperties: false
    ObjectPatch:
      type: object
      description: JSON Merge Patch. Hosts send the `ready` group; admins send `ttl`.
      properties:
        status: { type: string, enum: [ready] }
        nodeID: { type: string }
        stableNodeID: { type: string }
        magicDNS: { type: string }
        epoch: { type: integer, format: int64, minimum: 1, description: "Fences the ready commit. hostd always sends it; with or without it, a host may only report ready on objects whose lease it holds (`409 lease_lost`)." }
        ttl:
          type: [integer, "null"]
          format: int64
          minimum: 1
          description: Admin. Seconds; `null` clears.
      additionalProperties: false
    KillResult:
      type: object
      required: [killed, devicesDeleted]
      properties:
        killed: { type: array, items: { type: string } }
        pushed: { type: array, items: { type: string }, description: Objects whose host acknowledged the tier-1 push. }
        pushMs: { type: number }
        devicesDeleted: { type: array, items: { type: string } }
        devicesDeleting: { type: array, items: { type: string }, description: Device deletes scheduled (`-device-delete-delay`). }
        errors: { type: object, additionalProperties: { type: string } }
        warnings:
          type: array
          description: Non-fatal findings. The kill itself succeeded (tier 1 push, killed status, tombstone).
          items: { $ref: "#/components/schemas/KillWarning" }
    KillWarning:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [device_delete_unavailable]
          description: "`device_delete_unavailable`: the tenant's credential may not delete devices (an OAuth client without `devices:core`); the killed node is unreachable but its device stays in the admin console until removed."
        message: { type: string }
        objects: { type: array, items: { type: string } }
        fix: { type: string, description: How to add the missing scope. }

    # --------------------------------------------------------- credentials
    Credential:
      type: object
      description: A single-use auth key. Never logged; `String()` redacts it in Go.
      required: [authKey, expiresAt, tags, hostname, ephemeral]
      properties:
        authKey: { type: string, format: password, description: "`tskey-auth-…`, single use." }
        expiresAt: { type: integer, format: int64, description: unix ms }
        tags: { type: array, items: { type: string } }
        hostname: { type: string }
        ephemeral: { type: boolean }
        controlURL: { type: string, format: uri }
        reminted: { type: boolean, description: True when `reason=rejoin_rejected` deleted the old device and re-minted. }
      x-tw-secret: true
    NodeCertificatePayload:
      type: object
      description: "`internal/nodecert.Payload`; signed with the tenant's OBO root key (Ed25519)."
      required: [v, tenant, objectID, stableNodeID, tags, root, iat, exp]
      properties:
        v: { type: integer, const: 1 }
        tenant: { type: string }
        objectID: { type: string }
        stableNodeID: { type: string }
        tags: { type: array, items: { type: string } }
        lim: { $ref: "#/components/schemas/Caps" }
        parent: { type: string }
        root: { type: string }
        iat: { type: integer, format: int64, description: unix seconds }
        exp: { type: integer, format: int64, description: unix seconds (24 h after iat) }
    NodeCertificate:
      type: object
      required: [tenantID, objectID, stableNodeID, status, cert, payload, oboPublicKey]
      properties:
        tenantID: { type: string }
        objectID: { type: string }
        stableNodeID: { type: string }
        status: { $ref: "#/components/schemas/ObjectStatus" }
        cert: { type: string, description: "`<b64url payload>.<b64url sig>`" }
        payload: { $ref: "#/components/schemas/NodeCertificatePayload" }
        oboPublicKey: { type: string, description: base64 Ed25519 }

    # --------------------------------------------------------------- audit
    # One kind per line in both the description and the enum, so parallel
    # branches that add kinds touch different lines (see AGENTS.md).
    AuditKind:
      type: string
      description: |
        Host chain (netd/hostd):
        `allow`,
        `deny`,
        `egress`,
        `spawn`,
        `kill`,
        `principal`,
        `tenant_note` (source `tenant`, unverified),
        `container_start` (an object's container, ADR-032),
        `container_stop` (an object's container, ADR-032),
        `audit_dropped` (records refused before they were chained, e.g. tenant notes over their rate during a flood; `detail.n` and `detail.byReason` count them, so the gap is visible and the chain still verifies).
        mgmt chain:
        `tenant_create`,
        `tenant_update`,
        `tenant_delete`,
        `tenant_purge_host` (a host removed a deleted tenant's files),
        `host_register`,
        `host_delete`,
        `host_cordon`,
        `host_uncordon`,
        `host_drain`,
        `release_import`,
        `release_artifact`,
        `upgrade_start`,
        `upgrade_step`,
        `upgrade_pause`,
        `upgrade_resume`,
        `upgrade_abort`,
        `deploy`,
        `undeploy`,
        `rollback` (a deploy of an earlier deployment's stored bundle, ADR-046),
        `create`,
        `mint`,
        `remint`,
        `ready`,
        `kill`,
        `device_delete`,
        `purge`,
        `volume_key`,
        `secret_put` (a workload secret set; name only),
        `secret_delete`,
        `secret_release` (a workload's secrets released to its lease holder; names only),
        `store_create` (a platform store created, by its first write or an admin),
        `store_delete` (a platform store and its data key deleted),
        `queue_create` (a queue created, by its first use or an admin),
        `queue_delete` (a queue, its messages and its data key deleted),
        `queue_purge` (every message of a queue deleted),
        `d1_write` (an operator's SQL changed a D1 database; statement count only),
        `kv_put` (an admin wrote a Workers KV key; the namespace only, never the key),
        `kv_delete` (an admin deleted a Workers KV key; the namespace only),
        `telemetry_put` (the tenant's OTLP export set; endpoint and header names only),
        `telemetry_delete`,
        `telemetry_release` (the OTLP export config released to a workload's lease holder; once per host, workload and version),
        `notification_put` (the tenant's notification webhook set; its host and header names only),
        `notification_delete`,
        `notification_failed` (a notification was not delivered; the webhook's host and the error),
        `notification_test` (`tw notify test`; the origin and the outcome),
        `reap`,
        `preflight` (optional; dryRun deploys),
        `host_add`,
        `credential`,
        `obo_root`,
        `object_update`,
        `container_reserve`,
        `container_release`,
        `image_push` (a manifest pushed to the registry),
        `image_pin` (a deploy resolved its container images to digests, mirroring external ones),
        `image_public` (a public base image added or removed),
        `transfer` (a `_pool` node went to an object, ADR-031),
        `revoke` (an unused pooled key revoked).
        Public ingress (ADR-029), host chain:
        `public_request` (one per public request),
        `public_rejected` (per-minute summary of requests the limits refused, and of `not_public`/`bad_request` path refusals),
        `public_object_created` (a name admitted for a public create).
        Public ingress, mgmt chain:
        `public_name_claim` (a tenant took a public name on its tailnet, red-team H10),
        `public_name_release` (a tenant gave a public name up).
        Workflow approvals (ADR-040), host chain:
        `approval_requested` (a Workflow instance waits for an approval),
        `approval_decision` (approved or rejected, with the approver's identity),
        `approval_denied` (a decision refused, e.g. `cap_missing`),
        `approval_timeout` (the wait timed out: rejected by default).
        Both chains:
        `expose_on` / `expose_off` (mgmt: the operator's change; host: the listener opened/closed).
      enum:
        - allow
        - deny
        - egress
        - spawn
        - kill
        - principal
        - tenant_note
        - container_start
        - container_stop
        - audit_dropped
        - tenant_create
        - tenant_update
        - tenant_delete
        - tenant_purge_host
        - host_register
        - host_delete
        - host_cordon
        - host_uncordon
        - host_drain
        - release_import
        - release_artifact
        - upgrade_start
        - upgrade_step
        - upgrade_pause
        - upgrade_resume
        - upgrade_abort
        - deploy
        - undeploy
        - rollback
        - create
        - mint
        - remint
        - ready
        - device_delete
        - purge
        - volume_key
        - secret_put
        - secret_delete
        - secret_release
        - store_create
        - store_delete
        - queue_create
        - queue_delete
        - queue_purge
        - d1_write
        - kv_put
        - kv_delete
        - telemetry_put
        - telemetry_delete
        - telemetry_release
        - notification_put
        - notification_delete
        - notification_failed
        - notification_test
        - reap
        - preflight
        - host_add
        - credential
        - obo_root
        - object_update
        - container_reserve
        - container_release
        - image_push
        - image_pin
        - image_public
        - transfer
        - revoke
        - public_request
        - public_rejected
        - public_object_created
        - public_name_claim
        - public_name_release
        - approval_requested
        - approval_decision
        - approval_denied
        - approval_timeout
        - expose_on
        - expose_off
    AuditSource:
      type: string
      description: "`mgmt` for the mgmt chain; `host` for netd/hostd security records; `tenant` for a `tenant_note` written by tenant code (unverified content)."
      enum: [mgmt, host, tenant]
    AuditRecord:
      type: object
      description: |
        One hash-chained record. Hash input is the record without `hash` and
        `hostSig`, keys sorted at every level, no whitespace, numbers as
        written, no HTML escaping. `seq` and `chain` are assigned by mgmt.
      required: [ts, kind, prevHash, hash]
      properties:
        seq: { type: integer, format: int64, readOnly: true }
        chain: { type: string, readOnly: true, description: "`mgmt` or `host:<hostID>`." }
        ts: { type: string, format: date-time }
        tenantID: { type: string }
        objectID: { type: string }
        kind: { $ref: "#/components/schemas/AuditKind" }
        source: { $ref: "#/components/schemas/AuditSource" }
        dst: { type: string }
        grant: { type: string }
        code: { type: string }
        traceID: { type: string }
        actingFor: { type: string }
        detail:
          description: Structured detail (mgmt records) or free text (host `tenant_note`s).
          oneOf:
            - { type: object, additionalProperties: true }
            - { type: string }
        prevHash: { type: string, description: "`\"\"` for the first record of a chain." }
        hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        hostSig: { type: string, description: base64 ed25519 over utf8(hash); host chains only. }
    AuditBatch:
      type: object
      required: [records]
      properties:
        records: { type: array, items: { $ref: "#/components/schemas/AuditRecord" }, minItems: 1, maxItems: 1000 }
    ChainStatus:
      type: object
      required: [chain, ok, records]
      properties:
        chain: { type: string }
        ok: { type: boolean }
        records: { type: integer }
        brokenAt: { type: integer, format: int64, description: seq of the first bad record }
        error: { type: string }
    AuditAppendResult:
      type: object
      required: [accepted, chain]
      properties:
        accepted: { type: integer }
        chain: { $ref: "#/components/schemas/ChainStatus" }
    AuditVerification:
      type: object
      required: [ok, chains, verifiedAt]
      properties:
        ok: { type: boolean }
        chains: { type: array, items: { $ref: "#/components/schemas/ChainStatus" } }
        verifiedAt: { type: integer, format: int64 }

    # ------------------------------------------------------------- volumes
    Secret:
      type: object
      description: A workload secret's metadata. The value is never part of it.
      required: [tenantID, workload, name, createdAt, updatedAt]
      properties:
        tenantID: { type: string }
        workload: { type: string }
        name: { type: string }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
        updatedBy: { type: string, description: The actor who last set it (see Conventions). }
    SecretPut:
      type: object
      required: [value]
      properties:
        value: { type: string, maxLength: 5120, format: password, writeOnly: true, description: "The secret value (UTF-8, at most 5 KiB)." }
      additionalProperties: false
      x-tw-secret: true
    SecretGrant:
      type: object
      description: A fenced release of a workload's secret values. Never logged.
      required: [tenantID, workload, epoch, secrets]
      properties:
        tenantID: { type: string }
        workload: { type: string }
        epoch: { type: integer, format: int64 }
        secrets:
          type: object
          description: Name to value.
          additionalProperties: { type: string, format: password }
        grantedAt: { type: integer, format: int64 }
      x-tw-secret: true
    TelemetrySignal:
      type: string
      description: An OTLP signal.
      enum:
        - logs
        - metrics
        - traces
    OTLPExport:
      type: object
      description: A tenant's OTLP export, without header values.
      required: [endpoint, headerNames, signals]
      properties:
        endpoint: { type: string, format: uri, description: "OTLP/HTTP base URL; signals go to `<endpoint>/v1/<signal>`." }
        headerNames: { type: array, items: { type: string }, description: Names of the headers sent with every export (values are never returned). }
        signals: { type: array, items: { $ref: "#/components/schemas/TelemetrySignal" } }
    TelemetryConfig:
      type: object
      required: [tenantID]
      properties:
        tenantID: { type: string }
        otlp: { $ref: "#/components/schemas/OTLPExport" }
        updatedAt: { type: integer, format: int64 }
        updatedBy: { type: string }
    OTLPExportPut:
      type: object
      required: [endpoint]
      properties:
        endpoint: { type: string, format: uri, maxLength: 2048, description: "http:// or https:// base URL of an OTLP/HTTP receiver on the tailnet (no user info, query or fragment)." }
        headers:
          type: object
          description: "Headers sent with every export, typically the collector's credentials (at most 16; values at most 4 KiB). Never logged, audited or returned."
          maxProperties: 16
          additionalProperties: { type: string, maxLength: 4096, format: password, writeOnly: true }
        signals:
          type: array
          description: What to export (default all three).
          items: { $ref: "#/components/schemas/TelemetrySignal" }
      additionalProperties: false
    TelemetryPut:
      type: object
      required: [otlp]
      properties:
        otlp: { $ref: "#/components/schemas/OTLPExportPut" }
      additionalProperties: false
      x-tw-secret: true
    OTLPGrant:
      type: object
      required: [endpoint, signals]
      properties:
        endpoint: { type: string }
        headers:
          type: object
          additionalProperties: { type: string, format: password }
        signals: { type: array, items: { $ref: "#/components/schemas/TelemetrySignal" } }
    TelemetryGrant:
      type: object
      description: A fenced release of the tenant's OTLP export config. Never logged.
      required: [tenantID, workload, epoch]
      properties:
        tenantID: { type: string }
        workload: { type: string }
        epoch: { type: integer, format: int64 }
        otlp: { $ref: "#/components/schemas/OTLPGrant" }
        grantedAt: { type: integer, format: int64 }
      x-tw-secret: true
    RequestRecord:
      type: object
      description: |
        One line of a workload's request log (`tw logs --json`,
        ADR-045): a request through hostd's ingress (`kind:
        request`), joined with its workerd invocation, or an invocation
        with no ingress half (`kind: invocation`: a DO called from the
        Worker, an alarm, a cron run), or a note that records were dropped
        by the workload's rate limit (`kind: dropped`). Never holds bodies,
        query strings, request headers or secret values.
      required: [time, kind]
      properties:
        time: { type: string, format: date-time }
        kind: { type: string, enum: [request, invocation, dropped] }
        host: { type: string }
        tenant: { type: string }
        workload: { type: string }
        deployment: { type: string }
        object: { type: string, description: The tailworks object ID. }
        class: { type: string }
        name: { type: string }
        durableObjectId: { type: string, description: "workerd's ID of a plain-DO object whose name the invocation does not carry." }
        caller:
          type: object
          description: The verified caller (netd's WhoIs), never from tenant code.
          properties:
            node: { type: string }
            nodeId: { type: string }
            user: { type: string }
            tags: { type: array, items: { type: string } }
            object: { type: string }
            public: { type: boolean }
            ip: { type: string }
        method: { type: string }
        path: { type: string, description: The URL path (never the query string). }
        status: { type: integer }
        durationMs: { type: number }
        event: { type: string, description: "fetch, alarm, rpc, scheduled, websocket." }
        entrypoint: { type: string }
        outcome: { type: string }
        traceId: { type: string }
        spanId: { type: string }
        parentSpanId: { type: string }
        auditTraceId: { type: string }
        logs:
          type: array
          items:
            type: object
            properties:
              time: { type: string, format: date-time }
              level: { type: string }
              message: { type: string }
        exceptions:
          type: array
          items:
            type: object
            properties:
              time: { type: string, format: date-time }
              name: { type: string }
              message: { type: string }
              stack: { type: string }
        truncated: { type: boolean }
        dropped: { type: integer }
    VolumeKeyGrant:
      type: object
      description: A fenced release of a volume's data key. Never logged.
      required: [volumeID, tenantID, workload, epoch, key]
      properties:
        volumeID: { type: string }
        tenantID: { type: string }
        workload: { type: string }
        epoch: { type: integer, format: int64 }
        key: { type: string, contentEncoding: base64, format: password, description: 32 bytes. }
        grantedAt: { type: integer, format: int64 }
      x-tw-secret: true

    # -------------------------------------------------------------- stores
    StoreKind:
      type: string
      pattern: "^[a-z][a-z0-9]{0,15}$"
      description: A storage binding type (`kv`, `r2`, `d1`; later `queue`, …).
    Store:
      type: object
      description: A platform storage object of a workload (ADR-044).
      required: [tenantID, workload, kind, name, incarnation, head, entries, bytes, createdAt, updatedAt]
      properties:
        tenantID: { type: string }
        workload: { type: string }
        kind: { $ref: "#/components/schemas/StoreKind" }
        name: { type: string }
        incarnation: { type: string, description: "Random per creation: a store deleted and created again has a new one, so a store object holding the old data empties itself." }
        head: { type: integer, format: int64, description: The last sequence number appended. }
        entries: { type: integer, format: int64, description: Journal entries kept (after compaction). }
        bytes: { type: integer, format: int64, description: Plaintext bytes of the kept entries. }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
    StorePage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/Store" } }
    StoreEntryIn:
      type: object
      required: [data]
      properties:
        ckey: { type: string, maxLength: 1024, description: "Compaction key: this entry supersedes every earlier entry with the same `ckey` (for KV, the key). Empty: never compacted." }
        data: { type: string, format: byte, description: "The entry, opaque to mgmt (its kind's encoding), at most 2 MiB." }
      additionalProperties: false
    StoreAppend:
      type: object
      required: [after, entries]
      properties:
        after: { type: integer, format: int64, minimum: 0, description: The journal head the writer has applied; the append fails with `store_conflict` unless it is still the head. }
        incarnation: { type: string, description: "The incarnation the writer has applied (empty for a new store). A mismatch is a `store_conflict`." }
        entries:
          type: array
          minItems: 1
          maxItems: 128
          items: { $ref: "#/components/schemas/StoreEntryIn" }
      additionalProperties: false
    StoreAppendResult:
      type: object
      required: [incarnation, head]
      properties:
        incarnation: { type: string }
        head: { type: integer, format: int64, description: "The new head: the entries got `after+1 … head`, in order." }
    StoreEntry:
      type: object
      required: [seq, data]
      properties:
        seq: { type: integer, format: int64 }
        data: { type: string, format: byte }
    StoreJournal:
      type: object
      required: [head, entries, more]
      properties:
        incarnation: { type: string, description: Empty when the store does not exist. }
        head: { type: integer, format: int64 }
        entries: { type: array, items: { $ref: "#/components/schemas/StoreEntry" } }
        more: { type: boolean, description: "True if entries after the last one returned remain: read again with `after` = its `seq`." }
    KVKey:
      type: object
      description: A Workers KV key as `list()` returns it (ADR-037).
      required: [name]
      properties:
        name: { type: string }
        expiration: { type: integer, format: int64, description: "Unix seconds when the key expires (absent: never)." }
        metadata: { description: "The key's metadata (any JSON; absent: none)." }
    KVKeyPage:
      type: object
      required: [keys, listComplete]
      properties:
        keys: { type: array, items: { $ref: "#/components/schemas/KVKey" } }
        listComplete: { type: boolean }
        cursor: { type: string, description: "Pass as `cursor` for the next page (absent when `listComplete`)." }
    KVValue:
      type: object
      required: [name, value]
      properties:
        name: { type: string }
        value: { type: string, format: byte, description: The value's bytes. }
        expiration: { type: integer, format: int64 }
        metadata: {}
    KVPut:
      type: object
      required: [value]
      properties:
        value: { type: string, format: byte, description: "The value's bytes (at most 2 MiB − 4 KiB)." }
        expiration: { type: integer, format: int64, description: "Unix seconds; at least 60 s ahead." }
        expirationTtl: { type: integer, format: int64, description: "Seconds from now (at least 60). Wins over `expiration`." }
        metadata: { description: "Any JSON, at most 1024 bytes serialized." }
      additionalProperties: false

    D1Query:
      type: object
      required: [queries]
      properties:
        queries:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: object
            required: [sql]
            properties:
              sql: { type: string, maxLength: 100000, description: "One statement (or several separated by `;`; parameters bind to the last)." }
              params:
                type: array
                maxItems: 100
                description: "Positional parameters: null, numbers, strings, booleans (bound as 1/0), or a BLOB as an array of byte values."
                items: {}
            additionalProperties: false
      additionalProperties: false
    D1Result:
      type: object
      description: One statement's result, as D1's wire protocol has it.
      required: [success]
      properties:
        success: { type: boolean }
        results:
          type: object
          properties:
            columns: { type: array, items: { type: string } }
            rows: { type: array, items: { type: array, items: {} }, description: "Values: null, numbers, strings, and BLOBs as arrays of byte values." }
        meta:
          type: object
          description: "`changes`, `last_row_id`, `changed_db`, `rows_read`, `rows_written`, `size_after`, `duration` (ms), `served_by`."
          additionalProperties: true
        error: { type: string }


    # -------------------------------------------------------------- queues
    QueueContentType:
      type: string
      enum: [json, text, bytes, v8]
      description: "How the body is encoded: `json` (UTF-8 JSON), `text` (UTF-8), `bytes` (raw), `v8` (V8 structured clone, decoded by workerd in the consumer)."
    Queue:
      type: object
      description: A tenant's queue (ADR-039).
      required: [tenantID, name, incarnation, backlog, bytes, inFlight, delayed, createdAt, updatedAt]
      properties:
        tenantID: { type: string }
        name: { type: string }
        incarnation: { type: string, description: "Random per creation." }
        backlog: { type: integer, format: int64, description: "Messages kept: not yet acked, in flight or delayed included." }
        bytes: { type: integer, format: int64, description: "Body bytes of the kept messages." }
        inFlight: { type: integer, format: int64, description: "Claimed by a consumer and not settled (lease not expired)." }
        delayed: { type: integer, format: int64, description: "Not yet visible (a delay or a retry delay)." }
        oldestAt: { type: integer, format: int64, description: "Send time (unix ms) of the oldest message; absent when empty." }
        consumer: { type: string, description: "The workload (or `admin`) that last claimed messages." }
        consumedAt: { type: integer, format: int64, description: "unix ms of the last claim." }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
    QueuePage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/Queue" } }
    QueueMessageIn:
      type: object
      required: [body]
      properties:
        body: { type: string, format: byte, description: "The encoded body (see `contentType`), at most 128 KB." }
        contentType: { $ref: "#/components/schemas/QueueContentType" }
        delaySeconds: { type: integer, minimum: 0, maximum: 43200, description: "Hide the message this long (default: the call's `delaySeconds`)." }
      additionalProperties: false
    QueueSend:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/QueueMessageIn" }
        delaySeconds: { type: integer, minimum: 0, maximum: 43200, description: "The default delay of the messages." }
      additionalProperties: false
    QueueSendResult:
      type: object
      required: [ids, backlog, bytes]
      properties:
        ids: { type: array, items: { type: string }, description: "The new messages' IDs, in order." }
        backlog: { type: integer, format: int64 }
        bytes: { type: integer, format: int64 }
        oldestAt: { type: integer, format: int64 }
    QueuePull:
      type: object
      properties:
        batchSize: { type: integer, minimum: 1, maximum: 100, description: "At most this many messages (default 10)." }
        visibilityTimeoutMs: { type: integer, minimum: 1000, maximum: 43200000, description: "How long claimed messages stay hidden (default 30000)." }
        waitMs: { type: integer, minimum: 0, maximum: 20000, description: "If nothing is visible, wait this long for a message (default 0)." }
        maxRetries: { type: integer, minimum: 0, maximum: 100, description: "Admin pull consumers: deliveries beyond the first before a message is dead-lettered (default 3)." }
        deadLetterQueue: { type: string, pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$", description: "Admin pull consumers: where messages go after `maxRetries` (absent: dropped)." }
      additionalProperties: false
    QueueMessage:
      type: object
      required: [id, body, contentType, attempts, timestamp]
      properties:
        id: { type: string }
        leaseId: { type: string, description: "Settle the message with this (pull only)." }
        body: { type: string, format: byte }
        contentType: { $ref: "#/components/schemas/QueueContentType" }
        attempts: { type: integer, description: "Deliveries so far, this one included (pull); 0 for a message never delivered." }
        timestamp: { type: integer, format: int64, description: "Send time (unix ms)." }
        visibleAt: { type: integer, format: int64, description: "When the message is (or was) visible (unix ms)." }
    QueuePullResult:
      type: object
      required: [messages]
      properties:
        messages: { type: array, items: { $ref: "#/components/schemas/QueueMessage" } }
        deadLettered: { type: integer, description: "Expired messages moved to the dead-letter queue (or dropped) by this claim." }
    QueueMessageList:
      type: object
      required: [messages]
      properties:
        messages: { type: array, items: { $ref: "#/components/schemas/QueueMessage" } }
    QueueRetry:
      type: object
      required: [leaseId]
      properties:
        leaseId: { type: string }
        delaySeconds: { type: integer, minimum: 0, maximum: 43200 }
      additionalProperties: false
    QueueAck:
      type: object
      properties:
        acks: { type: array, maxItems: 100, items: { type: string }, description: "Lease IDs to delete." }
        retries: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/QueueRetry" } }
        extend: { type: array, maxItems: 100, items: { type: string }, description: "Lease IDs to keep hidden for `visibilityTimeoutMs` more." }
        release: { type: array, maxItems: 100, items: { type: string }, description: "Lease IDs to hand back, visible again at once, without counting the attempt (the consumer never ran them: its instance was restarting or went away)." }
        visibilityTimeoutMs: { type: integer, minimum: 1000, maximum: 43200000, description: "For `extend` (default 30000)." }
        retryDelaySeconds: { type: integer, minimum: 0, maximum: 43200, description: "Admin pull consumers: the default retry delay." }
        maxRetries: { type: integer, minimum: 0, maximum: 100, description: "Admin pull consumers, as for pull." }
        deadLetterQueue: { type: string, pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$" }
      additionalProperties: false
    QueueAckResult:
      type: object
      required: [acked, retried, deadLettered, extended, released, stale]
      properties:
        acked: { type: integer }
        retried: { type: integer }
        released: { type: integer }
        deadLettered: { type: integer, description: "Retries that went to the dead-letter queue (or were dropped) instead." }
        extended: { type: integer }
        stale: { type: integer, description: "Lease IDs that were no longer current." }
    QueuePurgeResult:
      type: object
      required: [purged]
      properties:
        purged: { type: integer, format: int64 }

    # ---------------------------------------------------------- containers
    ContainerResources:
      type: object
      description: "What one container reserves: vCPUs (fractional; Cloudflare's `lite` is 0.0625), guest memory and scratch disk (from its class's `instance_type`)."
      required: [vcpu, memMiB, diskMiB]
      properties:
        vcpu: { type: number, exclusiveMinimum: 0, maximum: 64 }
        memMiB: { type: integer, minimum: 1 }
        diskMiB: { type: integer, minimum: 0 }
      additionalProperties: false
    ContainerReservationCreate:
      type: object
      required: [tenantID, workload, class, object, epoch, resources]
      properties:
        tenantID: { type: string }
        workload: { type: string }
        class: { type: string, description: "The DO class (a wrangler `containers[].class_name`)." }
        object: { type: string, minLength: 1, maxLength: 256, description: "The DO instance (its name or hex ID): one container per instance." }
        epoch: { type: integer, format: int64, minimum: 1, description: The workload's lease epoch the host holds. }
        resources: { $ref: "#/components/schemas/ContainerResources" }
      additionalProperties: false
    ContainerReservation:
      type: object
      required: [reservationID, tenantID, workload, class, object, host, resources, createdAt, renewedAt]
      properties:
        reservationID: { type: string, examples: [cr_5k2m9q] }
        tenantID: { type: string }
        workload: { type: string }
        class: { type: string }
        object: { type: string }
        host: { type: string }
        resources: { $ref: "#/components/schemas/ContainerResources" }
        createdAt: { type: integer, format: int64, description: unix ms (store clock) }
        renewedAt: { type: integer, format: int64, description: unix ms of the last reserve or heartbeat that reported it (store clock) }
    RunningContainer:
      type: object
      description: One running container in a heartbeat.
      required: [tenantID, workload, class, object, resources]
      properties:
        reservationID: { type: string, description: "The reservation it runs under (absent: started without one, e.g. a restart while mgmt was unreachable)." }
        tenantID: { type: string }
        workload: { type: string }
        class: { type: string }
        object: { type: string, minLength: 1, maxLength: 256 }
        resources: { $ref: "#/components/schemas/ContainerResources" }
      additionalProperties: false

    ContainerImagePin:
      type: object
      description: |
        One image reference of a container class, resolved once at deploy for one arch (ADR-032 D3):
        hosts pull exactly `repository@digest` from tailworks' registry and nothing else. Retagging the
        upstream ref later changes nothing until the next deploy.
      required: [ref, arch, repository, digest]
      properties:
        name: { type: string, description: "The class's image name (wrangler `images` key); absent for the default image." }
        ref: { type: string, description: "The reference as `ctx.container` sees it (the wrangler image, or the `tw.local/<tenant>/…@sha256:…` ref `tw deploy` built)." }
        arch: { type: string, enum: [amd64, arm64] }
        repository: { type: string, description: "`<tenantID>/…` (the tenant's builds and mirrors) or `public/…` (public bases, alias targets)." }
        digest: { type: string, pattern: "^sha256:[a-f0-9]{64}$", description: The linux/`arch` image manifest (never an index). }
        from: { type: string, description: "What was resolved: `<upstream ref>@<digest>` (mirrored), `alias <ref>`, `public <ref>`, or the tw.local ref." }
      additionalProperties: false
    ContainerClass:
      type: object
      description: A container class of a deployment (a wrangler `containers` entry plus tailworks.jsonc overrides) and its pinned images.
      required: [class]
      properties:
        class: { type: string }
        source: { type: string, description: "The wrangler `image` as written (a ref, or a Dockerfile path)." }
        image: { type: string, description: The default image reference `start()` runs. }
        images: { type: object, additionalProperties: { type: string }, description: "Named images (`ctx.container.images`): name → reference." }
        imageSources: { type: object, additionalProperties: { type: string }, description: "Named images tw deploy builds: name → the wrangler Dockerfile, as written." }
        instanceType: { type: string }
        custom: { $ref: "#/components/schemas/ContainerResources" }
        maxInstances: { type: integer, minimum: 0 }
        arch: { type: string, enum: [amd64, arm64] }
        pins: { type: array, items: { $ref: "#/components/schemas/ContainerImagePin" } }
    ContainerImages:
      type: object
      description: |
        Images `tw deploy` built and pushed, by class: `{"<Class>": {"image": ref, "images": {name: ref}}}`
        with `tw.local/<tenantID>/<repo>@sha256:…` refs (an index when built for several arches). They
        replace the class's Dockerfile `image` / `images` entries; every ref is then pinned like any other.
      additionalProperties:
        type: object
        properties:
          image: { type: string }
          images: { type: object, additionalProperties: { type: string } }
        additionalProperties: false
    PublicImage:
      type: object
      required: [id, ref, arch, repository, digest, sourceDigest, createdAt]
      properties:
        id: { type: string, examples: [pi_3f9a1c2b7d8e4f50] }
        ref: { type: string, description: The normalised upstream ref (or tw.local ref) deploys match. }
        arch: { type: string, enum: [amd64, arm64] }
        repository: { type: string, description: "`public/…`" }
        digest: { type: string, pattern: "^sha256:[a-f0-9]{64}$", description: The linux/`arch` image manifest. }
        sourceDigest: { type: string, description: The upstream top-level digest (index or manifest) at add time. }
        createdBy: { type: string }
        createdAt: { type: integer, format: int64 }
    PublicImageCreate:
      type: object
      required: [ref]
      properties:
        ref: { type: string, minLength: 1 }
        arches: { type: array, items: { type: string, enum: [amd64, arm64] }, description: Default every linux amd64/arm64 image the ref has. }
      additionalProperties: false
    PublicImageList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/PublicImage" } }
    PublicImagePage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/PublicImage" } }
    ImageAlias:
      type: object
      required: [from, to]
      properties:
        from: { type: string }
        to: { type: string }
        arch: { type: string, description: '"" = every arch.' }
    ImageAliasList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ImageAlias" } }

    # --------------------------------------------------------- operational
    Health:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean, const: true }
    Transport:
      type: string
      description: "`tsnet` in normal operation; `local-dev` when the unix socket is serving."
      enum: [tsnet, local-dev]
    Status:
      type: object
      required: [ok, transport, pendingDeviceDeletes, hosts, tenants, objects]
      properties:
        ok: { type: boolean }
        transport: { $ref: "#/components/schemas/Transport" }
        listeners: { type: array, items: { type: string }, description: "e.g. `tsnet:80`, `tsnet:443`, `funnel:443`, `unix:~/.tailworks/run/mgmt.sock`." }
        pendingDeviceDeletes: { type: integer }
        hosts: { type: object, required: [total, live], properties: { total: { type: integer }, live: { type: integer } } }
        tenants: { type: integer }
        objects: { type: object, additionalProperties: { type: integer }, description: Count per `ObjectStatus`. }
        version: { type: string }
        clock: { $ref: "#/components/schemas/StatusClock" }
        replicas: { $ref: "#/components/schemas/StatusReplicas" }
        versions: { $ref: "#/components/schemas/StatusVersions" }
    StatusVersions:
      type: object
      description: What runs where (ADR-041 §7).
      required: [mgmt, hosts]
      properties:
        mgmt: { type: object, additionalProperties: { type: string }, description: "Each live replica's version, by replica ID." }
        hosts: { type: object, additionalProperties: { type: integer }, description: 'Host count by reported version ("" = none reported).' }
        skewed: { type: array, items: { type: string }, description: Hosts outside the version window. }
        schema: { $ref: "#/components/schemas/SchemaStatus" }
    SchemaStatus:
      type: object
      required: [latest, applied]
      properties:
        latest: { type: string, description: The newest migration this replica knows. }
        applied: { type: string, description: The newest migration applied to the store. }
        pending: { type: array, items: { type: string } }
        pendingContract: { type: array, items: { type: string }, description: Contract migrations deferred until every replica runs this version. }
        ahead: { type: array, items: { type: string }, description: Applied migrations this replica doesn't know (a newer replica ran them). }
        minBinary: { type: string, description: The oldest tw-mgmt that may open the store. }
        restoreGeneration: { type: integer, format: int64 }
    Protocols:
      type: object
      description: "Protocol versions a component speaks: `push`, `guest`, `helper`, `vz`, `rest`, `cliJSON`."
      additionalProperties: { type: integer }
    StatusReplicas:
      type: object
      description: >-
        The mgmt replica registry (replicas sharing this store). `ok` is false (and the top-level `ok` with it)
        when this replica conflicts with another live one: file custody shared between replicas, or replicas
        with different custody. A replica refuses to start in that state; a conflict that appears later (a
        replica started with an older version, or a registry row edited) is reported here and logged.
      required: [id, live, ok]
      properties:
        id: { type: string, description: "This replica's stable ID (`<state-dir>/replica.id`)." }
        live: { type: integer, description: "Replicas seen within the last 30 s, this one included." }
        ok: { type: boolean }
        message: { type: string }
    StatusClock:
      type: object
      description: >-
        The shared clock this replica uses for leases, host liveness and expiries (ADR-028): the store's clock.
        `ok` is false (and the top-level `ok` with it) when this replica's wall clock is more than 2 s from the
        store clock, or the store clock has not been sampled for 30 s. Ownership decisions do not use the wall
        clock, so this is a warning, not a refusal; local-clock users (throttles) may misbehave.
      required: [source, ok, offsetMs, syncAgeMs]
      properties:
        source: { type: string, enum: [postgres, local], description: "`postgres`: the server clock, sampled every 5 s; `local`: SQLite, one replica." }
        ok: { type: boolean }
        offsetMs: { type: integer, description: Store clock minus this replica's wall clock at the last sample. }
        syncAgeMs: { type: integer, description: Milliseconds since the last successful sample (0 for `local`). }
        message: { type: string }
    SelfInfo:
      type: object
      required: [https]
      properties:
        dnsName: { type: string, description: "`tw-mgmt.<tailnet>`" }
        tailnet: { type: string }
        https: { type: boolean }
        transport: { $ref: "#/components/schemas/Transport" }
    WhoAmI:
      type: object
      required: [kind, admin, actor, mgmt]
      properties:
        kind: { type: string, enum: [user, node, host, local] }
        login: { type: string }
        nodeID: { type: string }
        tags: { type: array, items: { type: string } }
        tailnet:
          type: string
          description: The caller's own tailnet (the MagicDNS suffix of its node, from WhoIs). Absent for the local operator and hosts.
        tenants:
          type: array
          description: |
            The tenants the caller can act in without knowing their IDs:
            those whose `tailnet` is the caller's own tailnet. The local
            operator gets every tenant; hosts get none. The admin UI's
            approvals page and `tw approvals` / `tw approve` default to
            these. A tailnet admin can still list every tenant
            (`GET /v1/tenants`).
          items: { $ref: "#/components/schemas/WhoAmITenant" }
        approveGrants:
          type: array
          description: |
            The values of the caller's `github.com/rosskukulinski/tailworks/cap/approve` grants toward
            `tag:tw-mgmt` (docs/approvals.md): what it may decide through
            `tw approve` and the admin UI. Empty when it holds none.
          items: { $ref: "#/components/schemas/ApproveGrant" }
        hostID: { type: string }
        admin: { type: boolean }
        actor: { type: string }
        mgmt: { $ref: "#/components/schemas/SelfInfo" }
        caps:
          type: array
          items: { type: string }
          description: The `github.com/rosskukulinski/tailworks/cap/*` capabilities the caller holds toward mgmt (WhoIs CapMap), sorted. Empty for the local operator and hosts.
        approver:
          type: boolean
          description: The caller holds `github.com/rosskukulinski/tailworks/cap/approve` and may decide Workflow approvals its grants cover (`tw approve`). Always false for the local operator, which has no personal identity.
        mcpTools:
          type: array
          items: { type: string }
          description: The MCP tools `/mcp` lets the caller use without a `Tw-MCP-Tools` header, in `tools/list` order.
        tenantGrants:
          type: array
          description: |
            The caller's valid `github.com/rosskukulinski/tailworks/cap/tenant-admin` values: the tenants
            it may act in, and how. Empty when it holds none. An admin's
            values are listed too but don't narrow it.
          items: { $ref: "#/components/schemas/TenantGrant" }
        invalidTenantGrants:
          type: array
          items: { type: string }
          description: The caller's `github.com/rosskukulinski/tailworks/cap/tenant-admin` values that grant nothing, each with the reason (missing `tenants` or `actions`, an unknown action, a wildcard).
    TenantGrant:
      type: object
      description: One valid `github.com/rosskukulinski/tailworks/cap/tenant-admin` value. Allows each action in each tenant it names.
      required: [tenants, actions]
      properties:
        tenants: { type: array, items: { type: string } }
        actions:
          type: array
          items: { type: string, enum: [data, deploy, kill, read, secrets] }
        mcp:
          type: object
          description: Admits the caller to `/mcp` for these tenants. The read tools need `read`; each write or destructive tool must be named here and its action held in `actions`.
          required: [tools]
          properties:
            tools: { type: array, items: { type: string } }
        approve:
          type: array
          description: '`github.com/rosskukulinski/tailworks/cap/approve` values that apply only to approvals in these tenants (docs/approvals.md).'
          items: { $ref: "#/components/schemas/ApproveGrant" }
    WhoAmITenant:
      type: object
      required: [tenantID, tailnet]
      properties:
        tenantID: { type: string }
        tailnet: { type: string }
    ApproveGrant:
      type: object
      description: One value of a `github.com/rosskukulinski/tailworks/cap/approve` grant. A missing field does not narrow; `"*"` in a list matches anything.
      properties:
        workloads: { type: array, items: { type: string } }
        workflows: { type: array, items: { type: string } }
        steps: { type: array, items: { type: string } }
        decisions: { type: array, items: { type: string } }
        limits:
          type: object
          additionalProperties: { type: number }
    DeviceDeleteRun:
      type: object
      required: [deleted]
      properties:
        deleted: { type: array, items: { type: string }, description: Object IDs whose devices were deleted. }
        errors: { type: object, additionalProperties: { type: string } }
